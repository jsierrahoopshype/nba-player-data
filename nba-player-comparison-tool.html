        <div id="errorMessage" style="display: none;"></div>
    </div>

    <script>
        // CONFIGURATION
        // The page no longer downloads the full data files (rsStats.json etc., ~15 MB).
        // scripts/build_player_files.py splits them into one small file per player
        // (players/<slug>.json) plus a name index (players/index.json); a comparison
        // fetches only the players it shows. The full files stay in the repo for other tools.
        const DATA_BASE_URL = CMP_DATA_BASE_URL; // set in the <head> script
        const PLAYER_FILES_URL = DATA_BASE_URL + 'players/';
        const DATA_FILES = {
            comparisons: 'comparisons.json',
            allStarsData: 'allstars-data.json',
            playerIndex: 'players/index.json'
        };
        // Datasets held in each per-player file (same keys as playerData).
        const PLAYER_DATASETS = ['awards', 'allStar', 'awardVotes', 'combine', 'nba2k', 'poSeries',
                                 'poStats', 'rsStats', 'salaries', 'sneakers', 'bio'];

        let playerData = {};
        let players = [];
        let dataLoaded = false;
        PLAYER_DATASETS.forEach(k => { playerData[k] = []; });

        // ===== Per-player data store =====
        // playerData.<dataset> holds the rows of every player loaded so far, in the same
        // order as the full file (each row carries its index in the full file), so every
        // existing filter()/find() over playerData returns what it returned when the
        // whole file was loaded.
        const loadedRowMaps = {};
        PLAYER_DATASETS.forEach(k => { loadedRowMaps[k] = new Map(); });
        const playerFileRequests = {};   // slug -> Promise
        // name -> { hub: Head to Head hub slug, hs: headshot stem }, from the player files ("links")
        const playerLinks = {};
        const loadedPlayerSlugs = new Set();

        // playerSlug() is defined in the <head> script.

        function mergePlayerFile(file) {
            if (file.links) Object.assign(playerLinks, file.links);
            PLAYER_DATASETS.forEach(k => {
                const entries = file[k];
                if (!entries || !entries.length) return;
                const m = loadedRowMaps[k];
                let added = false;
                entries.forEach(e => {
                    if (!m.has(e[0])) { m.set(e[0], e[1]); added = true; }
                });
                if (added) playerData[k] = [...m.keys()].sort((a, b) => a - b).map(i => m.get(i));
            });
        }

        function loadPlayerFile(slug) {
            if (!playerFileRequests[slug]) {
                playerFileRequests[slug] = cmpTakeJSON(PLAYER_FILES_URL + encodeURIComponent(slug) + '.json')
                    .then(r => {
                        if (r.status === 404) return null; // no rows for this name
                        if (!r.json) throw new Error('HTTP ' + r.status + ' for player file ' + slug);
                        return r.json;
                    })
                    .then(file => {
                        if (file) mergePlayerFile(file);
                        loadedPlayerSlugs.add(slug);
                    })
                    .catch(err => {
                        delete playerFileRequests[slug]; // allow a retry later
                        throw err;
                    });
            }
            return playerFileRequests[slug];
        }

        function isPlayerLoaded(name) {
            return loadedPlayerSlugs.has(playerSlug(name));
        }

        // Resolves once every named player's rows are in playerData.
        function ensurePlayers(names) {
            const slugs = [...new Set(names.filter(Boolean).map(playerSlug))];
            return Promise.all(slugs.map(loadPlayerFile));
        }

        // Load the comparison definitions, the player name index and the All-Star list.
        async function loadData() {
            const getJSON = (file) => cmpTakeJSON(DATA_BASE_URL + file).then(r => {
                if (!r.json) throw new Error('HTTP ' + r.status + ' for ' + file);
                return r.json;
            });

            try {
                const results = await Promise.all([
                    getJSON(DATA_FILES.comparisons),
                    getJSON(DATA_FILES.playerIndex),
                    // Optional - for the random comparison and same-era suggestions
                    getJSON(DATA_FILES.allStarsData).catch(() => null)
                ]);
                playerData.comparisons = results[0];
                playerData.allStarsData = results[2];

                // Same list the page used to build from rsStats + awards (trimmed, sorted).
                players = results[1].slice().sort();
                dataLoaded = true;

                console.log(`Found ${players.length} unique players`);
                return Promise.resolve();
            } catch (error) {
                console.error('Error loading data:', error);
                throw error;
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', async function() {
            showLoading(true);
            
            try {
                await loadData();
                
                setupAutocomplete();
                
                // Check URL params for player comparison
                const urlParams = new URLSearchParams(window.location.search);
                const urlP1 = urlParams.get('p1');
                const urlP2 = urlParams.get('p2');

                // Make sure the rows of every player named in the URL are loaded before the
                // URL handling below (combine, range and career all read playerData directly).
                const urlNames = [];
                [urlP1, urlP2].forEach(v => {
                    if (v) v.split(',').forEach(n => { const r = findPlayerName(n.trim()); if (r) urlNames.push(r); });
                });
                await ensurePlayers(urlNames);

                // Reveal the page with its web fonts in place, as it always was when the data
                // took longer than the fonts (otherwise <select> text renders 1px off).
                // Capped so a slow font never holds the comparison back for long.
                try {
                    await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
                } catch (e) { /* fonts API unavailable: carry on */ }

                // Combine Mode URL: a comma inside p1/p2 means that side holds 2+
                // players. Checked BEFORE `mode` because combine is career-only —
                // if a URL somehow carries both, the range params are ignored.
                if ((urlP1 && urlP1.indexOf(',') !== -1) || (urlP2 && urlP2.indexOf(',') !== -1)) {
                    if (initCombineFromURL(urlP1, urlP2)) {
                        showLoading(false);
                        document.getElementById('mainContent').style.display = 'block';
                        return;
                    }
                }

                // Range Comparison URL: the presence of a valid `mode` param routes
                // to the Range tab instead of the career auto-run. (Additive: career
                // URLs without a mode param behave exactly as before.)
                const urlMode = urlParams.get('mode');
                if (urlMode === 'seasons' || urlMode === 'ages' || urlMode === 'calendar') {
                    initRangeFromURL(urlParams);
                    showLoading(false);
                    document.getElementById('mainContent').style.display = 'block';
                    return;
                }

                let p1, p2;
                
                if (urlP1 && urlP2 && players.includes(urlP1) && players.includes(urlP2)) {
                    // Use players from URL
                    p1 = urlP1;
                    p2 = urlP2;
                } else {
                    // Load random All-Star comparison on start
                    p1 = getRandomAllStar();
                    p2 = getRandomAllStar();
                    // Make sure they're different
                    while (p2 === p1 && players.length > 1) {
                        p2 = getRandomAllStar();
                    }
                }
                
                if (p1 && p2 && p1 !== p2) {
                    document.getElementById('player1-top').value = p1;
                    document.getElementById('player2-top').value = p2;
                    document.getElementById('player1-bottom').value = p1;
                    document.getElementById('player2-bottom').value = p2;
                    updateStickyPlayerOptions();
                    setTimeout(() => compareFromInputs(), 0);
                }
                
                showLoading(false);
                document.getElementById('mainContent').style.display = 'block';
            } catch (error) {
                console.error('[ComparePlayers]', error);
                showError("Couldn't load the player database. Try refreshing — if this keeps happening, the data might be updating right now.");
                showLoading(false);
            }
        });

        function showLoading(show) {
            document.getElementById('loadingMessage').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function getRandomAllStar() {
            if (!playerData.allStarsData || !playerData.allStarsData.allStars1990Plus) return null;
            
            // Filter to only All-Stars that exist in our players array
            const allStars = playerData.allStarsData.allStars1990Plus.filter(name => 
                players.includes(name)
            );
            
            if (allStars.length === 0) return null;
            return allStars[Math.floor(Math.random() * allStars.length)];
        }

        function getSameEraAllStar(playerName) {
            if (!playerData.allStarsData || !playerData.allStarsData.playerDebutYears) return getRandomAllStar();
            
            const debutYears = playerData.allStarsData.playerDebutYears;
            // Use ALL All-Stars (all eras) for same-era suggestions, filtered to those in our dataset
            const rawAllStarsList = playerData.allStarsData.allStarsAllEras || playerData.allStarsData.allStars1990Plus || [];
            const allStarsList = rawAllStarsList.filter(name => players.includes(name));
            
            const playerDebutYear = debutYears[playerName];
            
            if (!playerDebutYear) return getRandomAllStar();
            
            // Get ALL-STARS from any era within ±8 years of debut
            const candidates = allStarsList.filter(p => {
                const pDebut = debutYears[p];
                if (!pDebut) return false;
                const yearDiff = Math.abs(pDebut - playerDebutYear);
                return yearDiff <= 8 && p !== playerName;
            });
            
            if (candidates.length === 0) return getRandomAllStar();
            
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function makePlayerNamesClickable() {
            // Make all player names in the page clickable
            const resultsDiv = document.getElementById('results');
            if (!resultsDiv) return;
            
            const playerValueDivs = resultsDiv.querySelectorAll('.player-value');
            playerValueDivs.forEach(div => {
                const text = div.textContent.trim();
                // Check if it's a player name (not a stat value)
                if (text && players.includes(text)) {
                    div.style.cursor = 'pointer';
                    div.style.textDecoration = 'underline';
                    div.setAttribute('data-player-name', text);
                    
                    div.addEventListener('click', () => {
                        const clickedPlayer = div.getAttribute('data-player-name');
                        const currentP1 = document.getElementById('player1-top').value;
                        const currentP2 = document.getElementById('player2-top').value;
                        
                        // Keep clicked player in position, randomize opponent
                        if (clickedPlayer === currentP1) {
                            // Player 1 was clicked, randomize Player 2
                            const newP2 = getRandomAllStar();
                            if (newP2 && newP2 !== clickedPlayer) {
                                document.getElementById('player2-top').value = newP2;
                                document.getElementById('player2-bottom').value = newP2;
                                compareFromInputs();
                            }
                        } else if (clickedPlayer === currentP2) {
                            // Player 2 was clicked, randomize Player 1
                            const newP1 = getRandomAllStar();
                            if (newP1 && newP1 !== clickedPlayer) {
                                document.getElementById('player1-top').value = newP1;
                                document.getElementById('player1-bottom').value = newP1;
                                compareFromInputs();
                            }
                        }
                    });
                }
            });
        }

        function setupAutocomplete() {
            // Setup autocomplete for all 4 inputs (top and bottom)
            const inputs = [
                { input: 'player1-top', suggestions: 'suggestions1-top' },
                { input: 'player2-top', suggestions: 'suggestions2-top' },
                { input: 'player1-bottom', suggestions: 'suggestions1-bottom' },
                { input: 'player2-bottom', suggestions: 'suggestions2-bottom' }
            ];
            
            inputs.forEach(config => {
                const inputEl = document.getElementById(config.input);
                const suggestionsEl = document.getElementById(config.suggestions);
                
                inputEl.addEventListener('input', function() {
                    const value = this.value.toLowerCase();
                    
                    if (value.length < 2) {
                        suggestionsEl.style.display = 'none';
                        return;
                    }
                    
                    // Match on both exact and normalized names (handles apostrophes)
                    const normalizedValue = normalizePlayerName(value);
                    const matches = players.filter(p => 
                        p.toLowerCase().includes(value) || 
                        normalizePlayerName(p).includes(normalizedValue)
                    ).slice(0, 10); // Limit to 10 suggestions
                    
                    if (matches.length === 0) {
                        suggestionsEl.style.display = 'none';
                        return;
                    }
                    
                    suggestionsEl.innerHTML = matches.map(player => 
                        `<div class="autocomplete-suggestion" data-player="${player}">${player}</div>`
                    ).join('');
                    
                    suggestionsEl.style.display = 'block';
                    
                    // Add click handlers to suggestions
                    suggestionsEl.querySelectorAll('.autocomplete-suggestion').forEach(el => {
                        el.addEventListener('click', function() {
                            inputEl.value = this.getAttribute('data-player');
                            suggestionsEl.style.display = 'none';
                            
                            // Sync with other input
                            if (config.input.includes('top')) {
                                const bottomId = config.input.replace('top', 'bottom');
                                document.getElementById(bottomId).value = inputEl.value;
                            } else {
                                const topId = config.input.replace('bottom', 'top');
                                document.getElementById(topId).value = inputEl.value;
                            }
                        });
                    });
                });
                
                // Close suggestions when clicking outside
                document.addEventListener('click', function(e) {
                    if (!inputEl.contains(e.target) && !suggestionsEl.contains(e.target)) {
                        suggestionsEl.style.display = 'none';
                    }
                });
            });
        }

        function normalizePlayerName(name) {
            // Normalize by removing apostrophes, spaces, and converting to lowercase
            return name.toLowerCase().replace(/['\s.-]/g, '');
        }

        function findPlayerName(inputName) {
            // First try exact match
            if (players.includes(inputName)) {
                return inputName;
            }
            
            // Then try normalized match
            const normalized = normalizePlayerName(inputName);
            for (let player of players) {
                if (normalizePlayerName(player) === normalized) {
                    return player;
                }
            }
            
            return null;
        }

        // ==========================================
        // COMBINE MODE (compare a single player vs a GROUP of players) — additive.
        // Builds a synthetic combined "player" by aggregating the group's rows, then
        // reuses the unchanged performComparison() engine via the data-swap pattern.
        // Combine applies to full careers only (no season/age/calendar ranges).
        // ==========================================

        // Wire autocomplete onto a dynamically added input (same matching as setupAutocomplete).
        function attachAutocomplete(inputEl, suggestionsEl) {
            inputEl.addEventListener('input', function() {
                const value = this.value.toLowerCase();
                if (value.length < 2) { suggestionsEl.style.display = 'none'; return; }
                const normalizedValue = normalizePlayerName(value);
                const matches = players.filter(p =>
                    p.toLowerCase().includes(value) ||
                    normalizePlayerName(p).includes(normalizedValue)
                ).slice(0, 10);
                if (matches.length === 0) { suggestionsEl.style.display = 'none'; return; }
                suggestionsEl.innerHTML = matches.map(player =>
                    `<div class="autocomplete-suggestion" data-player="${player}">${player}</div>`
                ).join('');
                suggestionsEl.style.display = 'block';
                suggestionsEl.querySelectorAll('.autocomplete-suggestion').forEach(el => {
                    el.addEventListener('click', function() {
                        inputEl.value = this.getAttribute('data-player');
                        suggestionsEl.style.display = 'none';
                    });
                });
            });
            document.addEventListener('click', function(e) {
                if (!inputEl.contains(e.target) && !suggestionsEl.contains(e.target)) {
                    suggestionsEl.style.display = 'none';
                }
            });
        }

        // Add another autocomplete input under a side (1 or 2) so it becomes a combined group.
        function addPlayerInput(side) {
            const container = document.getElementById('extra-players-' + side);
            if (!container) return;
            const wrap = document.createElement('div');
            wrap.className = 'extra-player-row';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'player-autocomplete extra-player-input';
            input.placeholder = 'Add player to combine...';
            const sug = document.createElement('div');
            sug.className = 'autocomplete-suggestions';
            const removeBtn = document.createElement('span');
            removeBtn.className = 'remove-player-btn';
            removeBtn.textContent = '×';
            removeBtn.title = 'Remove';
            removeBtn.addEventListener('click', function() { wrap.remove(); });
            const wrapper = document.createElement('div');
            wrapper.className = 'player-select-wrapper';
            wrapper.style.flex = '1';
            wrapper.appendChild(input);
            wrapper.appendChild(sug);
            wrap.appendChild(wrapper);
            wrap.appendChild(removeBtn);
            container.appendChild(wrap);
            attachAutocomplete(input, sug);
            input.focus();
        }

        // Collect the resolved, de-duplicated player names on one side (primary + extras).
        function collectSidePlayers(side) {
            const raw = [];
            const primary = document.getElementById('player' + side + '-top');
            if (primary && primary.value.trim()) raw.push(primary.value.trim());
            document.querySelectorAll('#extra-players-' + side + ' .extra-player-input').forEach(inp => {
                if (inp.value.trim()) raw.push(inp.value.trim());
            });
            const resolved = [];
            raw.forEach(n => {
                const r = findPlayerName(n);
                if (r && resolved.indexOf(r) === -1) resolved.push(r);
            });
            return resolved;
        }

        // Build synthetic combined rows for a group, all keyed under one synthetic name.
        // rsStats/poStats/salaries get a per-member YEAR suffix so deduplicateSeasonRows
        // keeps each member's season distinct (correct totals, pooled averages, best peak).
        function buildCombinedPlayerData(playerNames) {
            const name = playerNames.join(' + ');
            const rsStats = [];
            const poStats = [];
            const salaries = [];
            const awards = [];
            const awardVotes = [];

            playerNames.forEach((pn, i) => {
                playerData.rsStats.forEach(r => {
                    if (r.PLAYER === pn) {
                        const c = Object.assign({}, r);
                        c.PLAYER = name;
                        c.YEAR = (r.YEAR != null ? r.YEAR : '') + '#' + i;
                        rsStats.push(c);
                    }
                });
                playerData.poStats.forEach(r => {
                    if (r.PLAYER === pn) {
                        const c = Object.assign({}, r);
                        c.PLAYER = name;
                        c.YEAR = (r.YEAR != null ? r.YEAR : '') + '#' + i;
                        poStats.push(c);
                    }
                });
                playerData.salaries.forEach(r => {
                    if (r.PLAYER === pn) {
                        const c = Object.assign({}, r);
                        c.PLAYER = name;
                        c.YEAR = (r.YEAR != null ? r.YEAR : '') + '#' + i;
                        salaries.push(c);
                    }
                });
                playerData.awards.forEach(r => {
                    if (r['PLAYER / COACH'] === pn) {
                        const c = Object.assign({}, r);
                        c['PLAYER / COACH'] = name;
                        awards.push(c);
                    }
                });
                playerData.awardVotes.forEach(r => {
                    if (r.PLAYER === pn) {
                        const c = Object.assign({}, r);
                        c.PLAYER = name;
                        awardVotes.push(c);
                    }
                });
            });

            // One synthetic NBA 2K row merging every member's editions under unique keys,
            // so get2KRating's high/avg/low becomes the group's high/avg/low.
            const k2 = { 'Full Name': name, 'First Name': name, 'Last Name': '' };
            let any2k = false;
            playerNames.forEach((pn, i) => {
                const row = playerData.nba2k.find(r =>
                    r['Full Name'] === pn || (r['First Name'] + ' ' + r['Last Name']) === pn);
                if (!row) return;
                Object.keys(row).forEach(key => {
                    if (key.startsWith('2K') || key.startsWith('2k')) {
                        k2[key + '#' + i] = row[key];
                        any2k = true;
                    }
                });
            });
            const nba2k = any2k ? [k2] : [];

            return { name, rsStats, poStats, salaries, awards, awardVotes, nba2k };
        }

        // Run the standard comparison engine with one or both sides aggregated into a group.
        // side1/side2 are arrays of resolved player names (length >= 1).
        function performCombinedComparison(side1, side2) {
            const addRs = [], addPo = [], addSal = [], addAwards = [], addVotes = [], add2k = [];
            const prep = (names) => {
                if (names.length === 1) return names[0]; // single side: real name + real data
                const c = buildCombinedPlayerData(names);
                addRs.push(...c.rsStats); addPo.push(...c.poStats); addSal.push(...c.salaries);
                addAwards.push(...c.awards); addVotes.push(...c.awardVotes); add2k.push(...c.nba2k);
                return c.name;
            };
            const name1 = prep(side1);
            const name2 = prep(side2);

            // Combine excludes Draft Combine, Signature Shoes and All-Star contests (the
            // Range section set) AND, for groups only, NBA CAREER AVERAGES.
            const combineComparisons = buildCombineComparisons();

            const orig = {
                rsStats: playerData.rsStats, poStats: playerData.poStats,
                awards: playerData.awards, awardVotes: playerData.awardVotes,
                salaries: playerData.salaries, nba2k: playerData.nba2k,
                comparisons: playerData.comparisons
            };

            let results;
            try {
                playerData.rsStats = orig.rsStats.concat(addRs);
                playerData.poStats = orig.poStats.concat(addPo);
                playerData.awards = orig.awards.concat(addAwards);
                playerData.awardVotes = orig.awardVotes.concat(addVotes);
                playerData.salaries = orig.salaries.concat(addSal);
                playerData.nba2k = orig.nba2k.concat(add2k);
                playerData.comparisons = combineComparisons;
                results = performComparison(name1, name2);
            } finally {
                Object.assign(playerData, orig);
            }
            return { results, name1, name2 };
        }

        // ===== Combine Mode URL support (additive) =====
        // Multiple players on one side are comma-separated inside p1/p2:
        //   ?p1=LeBron James&p2=Tracy McGrady,Bill Walton
        // No NBA name contains a comma, so the split is unambiguous, and a side
        // holding a single name keeps the exact URL shape it has always had.

        // Split one side's URL param into resolved, de-duplicated player names.
        function parseSideParam(raw) {
            if (!raw) return [];
            const out = [];
            raw.split(',').forEach(part => {
                const n = part.trim();
                if (!n) return;
                const r = findPlayerName(n);
                if (r && out.indexOf(r) === -1) out.push(r);
            });
            return out;
        }

        // Display label for one side: "A" or "A + B + C" (matches the synthetic
        // name buildCombinedPlayerData() builds for a group).
        function sideLabel(names) {
            return names.join(' + ');
        }

        // "LeBron James vs Tracy McGrady + Bill Walton - NBA Career Comparison"
        // (same "vs" + hyphen convention as the single-player title in comparePlayer)
        function combineTitle(side1, side2) {
            return `${sideLabel(side1)} vs ${sideLabel(side2)} - NBA Career Comparison`;
        }

        // Push the current combine comparison into the URL (history.pushState) and
        // title. Combine is career-only, so any Range params are dropped — same as
        // the single-player path in comparePlayer().
        function updateCombineURL(side1, side2) {
            const url = new URL(window.location);
            url.searchParams.set('p1', side1.join(','));
            url.searchParams.set('p2', side2.join(','));
            ['mode', 'from', 'to', 'from2', 'to2'].forEach(k => url.searchParams.delete(k));
            window.history.pushState({}, '', url);
            document.title = combineTitle(side1, side2);
        }

        // Fill one side's inputs from a name list: the first name goes in the primary
        // input, the rest into freshly created "+ Add player (combine)" rows.
        function fillSideInputs(side, names) {
            const primary = document.getElementById('player' + side + '-top');
            if (primary) primary.value = names[0] || '';
            const container = document.getElementById('extra-players-' + side);
            if (!container) return;
            container.innerHTML = '';
            for (let i = 1; i < names.length; i++) {
                addPlayerInput(side);
                const inputs = container.querySelectorAll('.extra-player-input');
                const last = inputs[inputs.length - 1];
                if (last) { last.value = names[i]; last.blur(); }
            }
        }

        // Populate the Career tab from a comma-form URL and auto-run the comparison.
        // Returns false when the URL can't produce a comparison, so the caller falls
        // back to the existing single-player / random load behaviour.
        function initCombineFromURL(rawP1, rawP2) {
            const side1 = parseSideParam(rawP1);
            const side2 = parseSideParam(rawP2);
            if (side1.length === 0 || side2.length === 0) return false;
            fillSideInputs(1, side1);
            fillSideInputs(2, side2);
            updateStickyPlayerOptions();
            // runComparison() re-collects from the inputs, so it applies the same
            // validation (and the same single-vs-single fallback) as a UI click.
            setTimeout(() => runComparison(), 0);
            return true;
        }

        // Entry point for the Compare button: routes to combine when a side has 2+ players,
        // otherwise delegates to the unchanged single-player flow (compareFromInputs).
        function runComparison() {
            if (!dataLoaded) { compareFromInputs(); return; }
            const side1 = collectSidePlayers(1);
            const side2 = collectSidePlayers(2);

            // Both sides single (or empty): behave exactly as today.
            if (side1.length <= 1 && side2.length <= 1) {
                if (side1.length === 1) document.getElementById('player1-top').value = side1[0];
                if (side2.length === 1) document.getElementById('player2-top').value = side2[0];
                compareFromInputs();
                return;
            }

            if (side1.length === 0 || side2.length === 0) {
                alert('Please select at least one player on each side.');
                return;
            }
            const overlap = side1.filter(n => side2.indexOf(n) !== -1);
            if (overlap.length) {
                alert('A player cannot appear on both sides: ' + overlap.join(', '));
                return;
            }

            const name1 = sideLabel(side1);
            const name2 = sideLabel(side2);

            // Make the combine comparison shareable/reloadable (comma form) and set
            // the dynamic page title.
            updateCombineURL(side1, side2);

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><div>Comparing…</div></div>';

            const seq = ++careerCompareSeq;
            setTimeout(() => {
                ensurePlayers(side1.concat(side2)).then(() => {
                    if (seq !== careerCompareSeq) return;
                    const out = performCombinedComparison(side1, side2);
                    displayResults(out.results, out.name1, out.name2);
                }).catch(err => {
                    console.error('[ComparePlayers]', err);
                    if (seq !== careerCompareSeq) return;
                    resultsDiv.innerHTML = '';
                    showError("Couldn't load the player database. Try refreshing — if this keeps happening, the data might be updating right now.");
                });
            }, 100);
        }

        function compareFromInputs() {
            const p1Input = document.getElementById('player1-top').value.trim();
            const p2Input = document.getElementById('player2-top').value.trim();
            
            if (!p1Input || !p2Input) {
                if (!loopActive) alert('Please enter both player names');
                return;
            }
            
            // Find actual player names (handles apostrophes and special characters)
            const p1 = findPlayerName(p1Input);
            const p2 = findPlayerName(p2Input);
            
            if (!p1) {
                if (!loopActive) alert(`Player "${p1Input}" not found. Please select from suggestions.`);
                return;
            }
            
            if (!p2) {
                if (!loopActive) alert(`Player "${p2Input}" not found. Please select from suggestions.`);
                return;
            }
            
            if (p1 === p2) {
                if (!loopActive) alert('Please select different players');
                return;
            }
            
            // Update inputs with actual player names
            document.getElementById('player1-top').value = p1;
            document.getElementById('player2-top').value = p2;
            document.getElementById('player1-bottom').value = p1;
            document.getElementById('player2-bottom').value = p2;
            
            // Update sticky player labels
            updateStickyPlayerOptions();
            
            comparePlayer(p1, p2);
        }

        function comparePlayer(player1Name, player2Name) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><div>Comparing players…</div></div>';
            
            // Update URL with player names
            const url = new URL(window.location);
            url.searchParams.set('p1', player1Name);
            url.searchParams.set('p2', player2Name);
            // Keep career URLs clean: drop any Range Comparison params if present
            ['mode', 'from', 'to', 'from2', 'to2'].forEach(k => url.searchParams.delete(k));
            window.history.pushState({}, '', url);
            
            // Update page title
            document.title = `${player1Name} vs ${player2Name} - NBA Career Comparison`;
            
            const seq = ++careerCompareSeq;
            setTimeout(() => {
                ensurePlayers([player1Name, player2Name]).then(() => {
                    if (seq !== careerCompareSeq) return; // a newer comparison was started
                    const results = performComparison(player1Name, player2Name);
                    displayResults(results, player1Name, player2Name);
                }).catch(err => {
                    console.error('[ComparePlayers]', err);
                    if (seq !== careerCompareSeq) return;
                    resultsDiv.innerHTML = '';
                    showError("Couldn't load the player database. Try refreshing — if this keeps happening, the data might be updating right now.");
                });
            }, 100);
        }

        // Increments on every career/combine comparison so a slow player-file fetch
        // can't overwrite a newer comparison.
        let careerCompareSeq = 0;

        function parseNumericValue(value) {
            // Helper function to convert values to numbers for comparison
            if (!value) return NaN;
            
            const strValue = String(value);
            
            // Check if it's in feet-inches format (e.g., "6' 7.25''")
            const feetInchesMatch = strValue.match(/(\d+)'\s*([\d.]+)['"]+/);
            if (feetInchesMatch) {
                const feet = parseFloat(feetInchesMatch[1]);
                const inches = parseFloat(feetInchesMatch[2]);
                return (feet * 12) + inches; // Convert to total inches
            }
            
            // Otherwise strip currency symbols and commas
            return parseFloat(strValue.replace(/[\$,]/g, ''));
        }

        function performComparison(player1Name, player2Name) {
            let player1Score = 0;
            let player2Score = 0;
            const categories = {};
            const sectionScores = {}; // Track scores per section
            let currentSection = null;
            
            // Sections that award points even when opponent has no data
            const alwaysAwardSections = [
                'ACCOLADES', 
                'BEST AWARDS RANKING', 
                'YEARS RECEIVING VOTES', 
                'SIGNATURE SHOES',
                'PLAYOFF SUCCESS'
            ];
            
            // Sections that require BOTH players to have data (like DRAFT COMBINE but counts toward overall)
            const requireBothDataSections = [
                'SALARIES',
                'NBA 2K'
            ];
            
            // Sections excluded from overall score
            const excludeFromOverall = ['DRAFT COMBINE'];
            
            playerData.comparisons.forEach(comp => {
                const category = comp['Comparison points'];
                const winCondition = comp['Who wins?'];
                const dataSource = comp['Wheres the data?'];
                
                // Check if this is a section header
                if (!winCondition && !dataSource) {
                    currentSection = category;
                    categories[currentSection] = [];
                    sectionScores[currentSection] = { player1: 0, player2: 0 };
                    return;
                }
                
                if (!currentSection || !category) return;
                
                // Get player stats
                const p1Value = getPlayerStat(player1Name, category, dataSource);
                const p2Value = getPlayerStat(player2Name, category, dataSource);
                
                // Determine winner
                let winner = 'tie';
                let awardPoint = false;
                
                // Check if this section always awards points
                const alwaysAward = alwaysAwardSections.includes(currentSection);
                
                // Check if this section requires both players to have data
                const requireBothData = requireBothDataSections.includes(currentSection) || 
                                       excludeFromOverall.includes(currentSection);
                
                if (p1Value !== null && p2Value !== null) {
                    // Both have data - normal comparison
                    const p1Num = parseNumericValue(p1Value);
                    const p2Num = parseNumericValue(p2Value);
                    
                    if (!isNaN(p1Num) && !isNaN(p2Num)) {
                        if (winCondition === 'Most') {
                            if (p1Num > p2Num) {
                                winner = 'player1';
                                awardPoint = true;
                            } else if (p2Num > p1Num) {
                                winner = 'player2';
                                awardPoint = true;
                            }
                        } else if (winCondition === 'Least') {
                            if (p1Num < p2Num) {
                                winner = 'player1';
                                awardPoint = true;
                            } else if (p2Num < p1Num) {
                                winner = 'player2';
                                awardPoint = true;
                            }
                        }
                        
                        // Check if this is an untracked stat (steals/blocks/turnovers/3P with a 0)
                        if (awardPoint) {
                            const untrackedSections = ['NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK'];
                            const untrackedCategories = ['steals', 'steal', 'blocks', 'block', 'turnovers', 'turnover', 'three', '3p', 'stl', 'blk', 'tov'];
                            
                            const inUntrackedSection = untrackedSections.some(s => 
                                currentSection && currentSection.trim().toUpperCase() === s.toUpperCase()
                            );
                            
                            const isUntrackedCategory = untrackedCategories.some(c => 
                                category && category.toLowerCase().includes(c)
                            );
                            
                            // Check if value is zero - check both raw and parsed
                            const isZeroValue = (rawVal, numVal) => {
                                if (numVal === 0) return true;
                                const strVal = String(rawVal).trim();
                                if (strVal === '0' || strVal === '0.0' || strVal === '0.00') return true;
                                return parseFloat(strVal) === 0;
                            };
                            
                            const p1IsZero = isZeroValue(p1Value, p1Num);
                            const p2IsZero = isZeroValue(p2Value, p2Num);
                            
                            // If either player has 0, don't award the point (stat wasn't tracked for them)
                            if (inUntrackedSection && isUntrackedCategory) {
                                if (p1IsZero || p2IsZero) {
                                    awardPoint = false;
                                    winner = 'tie';  // Also set to tie so row isn't highlighted
                                }
                            }
                        }
                    }
                } else if (alwaysAward && !requireBothData) {
                    // Only one has data - award point if in special sections (and not requiring both)
                    if (p1Value !== null && p2Value === null) {
                        const p1Num = parseNumericValue(p1Value);
                        if (!isNaN(p1Num) && p1Num > 0) {
                            winner = 'player1';
                            awardPoint = true;
                        }
                    } else if (p2Value !== null && p1Value === null) {
                        const p2Num = parseNumericValue(p2Value);
                        if (!isNaN(p2Num) && p2Num > 0) {
                            winner = 'player2';
                            awardPoint = true;
                        }
                    }
                }
                
                // Award points
                if (awardPoint) {
                    if (winner === 'player1') {
                        sectionScores[currentSection].player1++;
                        // Add to overall score unless it's an excluded section
                        if (!excludeFromOverall.includes(currentSection)) {
                            player1Score++;
                        }
                    } else if (winner === 'player2') {
                        sectionScores[currentSection].player2++;
                        // Add to overall score unless it's an excluded section
                        if (!excludeFromOverall.includes(currentSection)) {
                            player2Score++;
                        }
                    }
                }
                
                categories[currentSection].push({
                    metric: category,
                    player1Value: p1Value,
                    player2Value: p2Value,
                    winner: winner
                });
            });
            
            // Remove empty comparisons and untracked stats where both have 0
            Object.keys(categories).forEach(sectionName => {
                categories[sectionName] = categories[sectionName].filter(item => {
                    // First check: at least one player has data
                    if (item.player1Value === null && item.player2Value === null) {
                        return false;
                    }
                    
                    // Second check: for untracked stats, hide if BOTH have 0
                    const untrackedSections = ['NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK'];
                    const untrackedCategories = ['steals', 'steal', 'blocks', 'block', 'turnovers', 'turnover', 'three', '3p', 'stl', 'blk', 'tov'];
                    
                    const inUntrackedSection = untrackedSections.some(s => 
                        sectionName && sectionName.trim().toUpperCase() === s.toUpperCase()
                    );
                    
                    const isUntrackedCategory = untrackedCategories.some(c => 
                        item.metric && item.metric.toLowerCase().includes(c)
                    );
                    
                    if (inUntrackedSection && isUntrackedCategory) {
                        // Check if both values are 0
                        const isZero = (val) => {
                            if (val === null || val === undefined) return false;
                            if (val === '-' || val === '–') return true;
                            const strVal = String(val).trim();
                            if (strVal === '0' || strVal === '0.0' || strVal === '0.00') return true;
                            return parseFloat(strVal) === 0;
                        };
                        
                        if (isZero(item.player1Value) && isZero(item.player2Value)) {
                            return false; // Hide this row
                        }
                    }
                    
                    return true; // Show this row
                });
            });
            
            return {
                player1: player1Name,
                player2: player2Name,
                player1Score: player1Score,
                player2Score: player2Score,
                categories: categories,
                sectionScores: sectionScores
            };
        }

        function getPlayerStat(playerName, metric, dataSource) {
            if (!dataSource) return null;
            
            // Map metric to actual data field based on data source
            if (dataSource === 'Awards.csv') {
                return getAwardCount(playerName, metric);
            } else if (dataSource === 'RS-Stats.csv') {
                return getRegularSeasonStat(playerName, metric);
            } else if (dataSource === 'PO-Stats.csv') {
                return getPlayoffStat(playerName, metric);
            } else if (dataSource === 'PO-series.csv') {
                return getPlayoffSeriesStat(playerName, metric);
            } else if (dataSource === 'Salaries.csv') {
                return getSalaryStat(playerName, metric);
            } else if (dataSource === 'Combine.csv') {
                return getCombineStat(playerName, metric);
            } else if (dataSource === 'Award-Votes.csv') {
                return getVotingStat(playerName, metric);
            } else if (dataSource === 'Sneakers.csv') {
                return getSneakerStat(playerName, metric);
            } else if (dataSource === 'NBA2K.csv') {
                return get2KRating(playerName, metric);
            } else if (dataSource === 'All-Star.csv') {
                return getAllStarContestWins(playerName, metric);
            }
            
            return null;
        }

        function getAwardCount(playerName, awardType) {
            // Handle combined awards
            if (awardType === 'All-NBA Selections') {
                const first = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'All-NBA First Team'
                ).length;
                const second = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'All-NBA Second Team'
                ).length;
                const third = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'All-NBA Third Team'
                ).length;
                const total = first + second + third;
                return total > 0 ? total : null;
            }
            
            if (awardType === 'All-Defensive Team Selections') {
                const first = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'All-Defensive First Team'
                ).length;
                const second = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'All-Defensive Second Team'
                ).length;
                const total = first + second;
                return total > 0 ? total : null;
            }
            
            if (awardType === 'Olympic Medals') {
                const gold = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'Olympic Gold'
                ).length;
                const silver = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'Olympic Silver'
                ).length;
                const bronze = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'Olympic Bronze'
                ).length;
                const total = gold + silver + bronze;
                return total > 0 ? total : null;
            }
            
            if (awardType === 'World Cup Medals') {
                const gold = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'World Cup Gold'
                ).length;
                const silver = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'World Cup Silver'
                ).length;
                const bronze = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'World Cup Bronze'
                ).length;
                const total = gold + silver + bronze;
                return total > 0 ? total : null;
            }
            
            // Conference Finals MVP combines EC Finals MVP and WC Finals MVP
            if (awardType === 'Conference Finals MVP') {
                const ec = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'EC Finals MVP'
                ).length;
                const wc = playerData.awards.filter(row => 
                    row['PLAYER / COACH'] === playerName && row.AWARD === 'WC Finals MVP'
                ).length;
                const total = ec + wc;
                return total > 0 ? total : null;
            }
            
            // Regular award count
            const playerAwards = playerData.awards.filter(row => 
                row['PLAYER / COACH'] === playerName && row.AWARD === awardType
            );
            return playerAwards.length > 0 ? playerAwards.length : null;
        }

        // ==========================================
        // MULTI-TEAM SEASON DEDUPLICATION
        // When a player plays for multiple teams in one season, the data contains
        // separate rows per team PLUS a "TOT" row with aggregated stats.
        // Without deduplication, career stats double-count and peaks use partial stints.
        // This function keeps only one row per season: the TOT row if it exists,
        // otherwise the single team row, otherwise aggregates partial rows.
        // ==========================================
        function deduplicateSeasonRows(playerRows) {
            // Group rows by YEAR
            const byYear = {};
            playerRows.forEach(row => {
                const year = row.YEAR || 'unknown';
                if (!byYear[year]) byYear[year] = [];
                byYear[year].push(row);
            });
            
            const deduplicated = [];
            for (const year in byYear) {
                const yearRows = byYear[year];
                
                if (yearRows.length === 1) {
                    // Single row for this season — use it directly
                    deduplicated.push(yearRows[0]);
                } else {
                    // Multiple rows — look for TOT row first
                    const totRow = yearRows.find(r => 
                        r.TEAM === 'TOT' || r.TM === 'TOT' || r.Team === 'TOT'
                    );
                    
                    if (totRow) {
                        deduplicated.push(totRow);
                    } else {
                        // No TOT row — aggregate the partial rows manually
                        const aggregated = { ...yearRows[0] }; // Start with first row's structure
                        const numericColumns = ['GP', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TOV',
                                                'FGM', 'FGA', '3P', '3PA', 'FTM', 'FTA', 'MIN',
                                                'OREB', 'DREB', 'PF'];
                        
                        // Zero out numeric columns first, then sum all rows
                        numericColumns.forEach(col => { aggregated[col] = 0; });
                        
                        yearRows.forEach(row => {
                            numericColumns.forEach(col => {
                                const val = parseFloat(row[col]);
                                if (!isNaN(val)) {
                                    aggregated[col] = (aggregated[col] || 0) + val;
                                }
                            });
                        });
                        
                        deduplicated.push(aggregated);
                    }
                }
            }
            
            return deduplicated;
        }

        function getRegularSeasonStat(playerName, metric) {
            const rawRows = playerData.rsStats.filter(row => row.PLAYER === playerName);
            if (rawRows.length === 0) return null;
            const playerRows = deduplicateSeasonRows(rawRows);
            
            // Map metric to column name
            const columnMap = {
                'Points per game': 'PTS / G',
                'Rebounds per game': 'REB / G',
                'Assists per game': 'AST / G',
                'Steals per game': 'STL / G',
                'Blocks per game': 'BLK / G',
                'Field Goal %': 'FG%',
                'Three Point %': '3P%',
                'Free Throw %': 'FT%',
                'Turnovers per game': 'TOV / G',
                'Games': 'GP',
                'Points': 'PTS',
                'Rebounds': 'REB',
                'Assists': 'AST',
                'Steals': 'STL',
                'Blocks': 'BLK',
                'Turnovers': 'TOV',
                '3P%': '3P%'
            };
            
            // Season peak metrics - find highest single-season average
            // IMPORTANT: Calculate from raw totals (STAT / GP) per season,
            // not from a pre-calculated column that may not exist or may have a different name.
            const peakPerGameMetrics = {
                'Points per game peak': 'PTS',
                'Rebounds per game peak': 'REB',
                'Assists per game peak': 'AST',
                'Steals per game peak': 'STL',
                'Blocks per game peak': 'BLK',
                'Turnovers per game peak': 'TOV'
            };
            
            const peakPctMetrics = {
                'Field Goal % peak': { made: 'FGM', att: 'FGA', minAtt: 200 },
                'Three Point % peak': { made: '3P', att: '3PA', minAtt: 50 },
                'Free Throw % peak': { made: 'FTM', att: 'FTA', minAtt: 50 }
            };
            
            const MIN_GAMES_FOR_PEAK = 20;
            
            // For players with only one season, use that season as their peak regardless of games played
            const isSingleSeasonPlayer = playerRows.length === 1;
            
            // Check if this is a per-game peak metric
            if (peakPerGameMetrics[metric]) {
                const statColumn = peakPerGameMetrics[metric];
                let maxValue = -Infinity;
                
                playerRows.forEach(row => {
                    const stat = parseFloat(row[statColumn]);
                    const games = parseFloat(row['GP']);
                    
                    // For single-season players, skip the minimum games requirement
                    const meetsGamesRequirement = isSingleSeasonPlayer || (games >= MIN_GAMES_FOR_PEAK);
                    
                    if (!isNaN(stat) && !isNaN(games) && games > 0 && meetsGamesRequirement) {
                        const perGame = stat / games;
                        if (perGame > maxValue) {
                            maxValue = perGame;
                        }
                    }
                });
                
                return maxValue > -Infinity ? maxValue.toFixed(1) : null;
            }
            
            // Check if this is a percentage peak metric
            if (peakPctMetrics[metric]) {
                const pctInfo = peakPctMetrics[metric];
                let maxPct = -Infinity;
                
                playerRows.forEach(row => {
                    const made = parseFloat(row[pctInfo.made]);
                    const att = parseFloat(row[pctInfo.att]);
                    const games = parseFloat(row['GP']);
                    
                    // For single-season players, relax the minimum attempts and games requirements
                    const meetsRequirements = isSingleSeasonPlayer 
                        ? (att > 0)
                        : (att >= pctInfo.minAtt && !isNaN(games) && games >= MIN_GAMES_FOR_PEAK);
                    
                    // Require minimum attempts AND minimum games to avoid fluky small-sample peaks
                    if (!isNaN(made) && !isNaN(att) && meetsRequirements) {
                        const pct = (made / att) * 100;
                        if (pct > maxPct) {
                            maxPct = pct;
                        }
                    }
                });
                
                return maxPct > -Infinity ? maxPct.toFixed(1) + '%' : null;
            }
            
            const column = columnMap[metric];
            if (!column) return null;
            
            // For per-game stats, calculate total/games
            if (metric.includes('per game')) {
                const baseStatMap = {
                    'Points per game': 'PTS',
                    'Rebounds per game': 'REB',
                    'Assists per game': 'AST',
                    'Steals per game': 'STL',
                    'Blocks per game': 'BLK',
                    'Turnovers per game': 'TOV'
                };
                
                const totalColumn = baseStatMap[metric];
                if (!totalColumn) return null;
                
                let totalStat = 0;
                let totalGames = 0;
                
                playerRows.forEach(row => {
                    const stat = parseFloat(row[totalColumn]);
                    const games = parseFloat(row['GP']);
                    if (!isNaN(stat) && !isNaN(games)) {
                        totalStat += stat;
                        totalGames += games;
                    }
                });
                
                return totalGames > 0 ? (totalStat / totalGames).toFixed(1) : null;
            }
            
            // For percentages, calculate weighted average
            if (metric.includes('%')) {
                const percentageMap = {
                    'Field Goal %': { pct: 'FG%', made: 'FGM', att: 'FGA' },
                    'Three Point %': { pct: '3P%', made: '3P', att: '3PA' },
                    'Free Throw %': { pct: 'FT%', made: 'FTM', att: 'FTA' },
                    '3P%': { pct: '3P%', made: '3P', att: '3PA' }
                };
                
                const pctInfo = percentageMap[metric];
                if (!pctInfo) return null;
                
                let totalMade = 0;
                let totalAtt = 0;
                
                playerRows.forEach(row => {
                    const made = parseFloat(row[pctInfo.made]);
                    const att = parseFloat(row[pctInfo.att]);
                    if (!isNaN(made) && !isNaN(att)) {
                        totalMade += made;
                        totalAtt += att;
                    }
                });
                
                if (totalAtt > 0) {
                    const pct = (totalMade / totalAtt) * 100;
                    return pct.toFixed(1) + '%';
                }
                return null;
            }
            
            // For totals, sum up
            let total = 0;
            playerRows.forEach(row => {
                const val = parseFloat(row[column]);
                if (!isNaN(val)) {
                    total += val;
                }
            });
            return total > 0 ? Math.round(total) : null;
        }

        function getPlayoffStat(playerName, metric) {
            const rawRows = playerData.poStats.filter(row => row.PLAYER === playerName);
            if (rawRows.length === 0) return null;
            const playerRows = deduplicateSeasonRows(rawRows);
            
            // Similar to regular season stats

                'Points per game PO': 'PTS / G',
                'Rebounds per game PO': 'REB / G',
                'Assists per game PO': 'AST / G',
                'Steals per game PO': 'STL / G',
                'Blocks per game PO': 'BLK / G',
                'Field Goal % PO': 'FG%',
                'Three Point % PO': '3P%',
                'Free Throw % PO': 'FT%',
                'Turnovers per game PO': 'TOV / G',
                'Games PO': 'GP',
                'Points PO': 'PTS',
                'Rebounds PO': 'REB',
                'Assists PO': 'AST',
                'Steals PO': 'STL',
                'Blocks PO': 'BLK',
                'Turnovers PO': 'TOV'
            };
            
            // Playoff peak metrics - find highest single-postseason average
            // Calculate from raw totals (STAT / GP) per season, same as regular season peaks.
            const peakPerGameMetricsPO = {
                'Points per game PO peak': 'PTS',
                'Rebounds per game PO peak': 'REB',
                'Assists per game PO peak': 'AST',
                'Steals per game PO peak': 'STL',
                'Blocks per game PO peak': 'BLK',
                'Turnovers per game PO peak': 'TOV'
            };
            
            const peakPctMetricsPO = {
                'Field Goal % PO peak': { made: 'FGM', att: 'FGA', minAtt: 50 },
                'Three Point % PO peak': { made: '3P', att: '3PA', minAtt: 15 },
                'Free Throw % PO peak': { made: 'FTM', att: 'FTA', minAtt: 15 }
            };
            
            const MIN_GAMES_FOR_PO_PEAK = 4; // At least one full series
            
            // For players with only one playoff season, use that season as their peak
            const isSinglePlayoffSeasonPlayer = playerRows.length === 1;
            
            // Check if this is a per-game PO peak metric
            if (peakPerGameMetricsPO[metric]) {
                const statColumn = peakPerGameMetricsPO[metric];
                let maxValue = -Infinity;
                
                playerRows.forEach(row => {
                    const stat = parseFloat(row[statColumn]);
                    const games = parseFloat(row['GP']);
                    
                    // For single-season players, skip the minimum games requirement
                    const meetsGamesRequirement = isSinglePlayoffSeasonPlayer || (games >= MIN_GAMES_FOR_PO_PEAK);
                    
                    if (!isNaN(stat) && !isNaN(games) && games > 0 && meetsGamesRequirement) {
                        const perGame = stat / games;
                        if (perGame > maxValue) {
                            maxValue = perGame;
                        }
                    }
                });
                
                return maxValue > -Infinity ? maxValue.toFixed(1) : null;
            }
            
            // Check if this is a percentage PO peak metric
            if (peakPctMetricsPO[metric]) {
                const pctInfo = peakPctMetricsPO[metric];
                let maxPct = -Infinity;
                
                playerRows.forEach(row => {
                    const made = parseFloat(row[pctInfo.made]);
                    const att = parseFloat(row[pctInfo.att]);
                    const games = parseFloat(row['GP']);
                    
                    // For single-season players, relax the minimum requirements
                    const meetsRequirements = isSinglePlayoffSeasonPlayer
                        ? (att > 0)
                        : (att >= pctInfo.minAtt && !isNaN(games) && games >= MIN_GAMES_FOR_PO_PEAK);
                    
                    if (!isNaN(made) && !isNaN(att) && meetsRequirements) {
                        const pct = (made / att) * 100;
                        if (pct > maxPct) {
                            maxPct = pct;
                        }
                    }
                });
                
                return maxPct > -Infinity ? maxPct.toFixed(1) + '%' : null;
            }
            
            const column = columnMap[metric];
            if (!column) return null;
            
            // For per-game stats, calculate total/games
            if (metric.includes('per game')) {
                const baseStatMap = {
                    'Points per game PO': 'PTS',
                    'Rebounds per game PO': 'REB',
                    'Assists per game PO': 'AST',
                    'Steals per game PO': 'STL',
                    'Blocks per game PO': 'BLK',
                    'Turnovers per game PO': 'TOV'
                };
                
                const totalColumn = baseStatMap[metric];
                if (!totalColumn) return null;
                
                let totalStat = 0;
                let totalGames = 0;
                
                playerRows.forEach(row => {
                    const stat = parseFloat(row[totalColumn]);
                    const games = parseFloat(row['GP']);
                    if (!isNaN(stat) && !isNaN(games)) {
                        totalStat += stat;
                        totalGames += games;
                    }
                });
                
                return totalGames > 0 ? (totalStat / totalGames).toFixed(1) : null;
            }
            
            // For percentages, calculate weighted average
            if (metric.includes('%')) {
                const percentageMap = {
                    'Field Goal % PO': { pct: 'FG%', made: 'FGM', att: 'FGA' },
                    'Three Point % PO': { pct: '3P%', made: '3P', att: '3PA' },
                    'Free Throw % PO': { pct: 'FT%', made: 'FTM', att: 'FTA' }
                };
                
                const pctInfo = percentageMap[metric];
                if (!pctInfo) return null;
                
                let totalMade = 0;
                let totalAtt = 0;
                
                playerRows.forEach(row => {
                    const made = parseFloat(row[pctInfo.made]);
                    const att = parseFloat(row[pctInfo.att]);
                    if (!isNaN(made) && !isNaN(att)) {
                        totalMade += made;
                        totalAtt += att;
                    }
                });
                
                if (totalAtt > 0) {
                    const pct = (totalMade / totalAtt) * 100;
                    return pct.toFixed(1) + '%';
                }
                return null;
            }
            
            // For totals, sum up
            let total = 0;
            playerRows.forEach(row => {
                const val = parseFloat(row[column]);
                if (!isNaN(val)) {
                    total += val;
                }
            });
            return total > 0 ? Math.round(total) : null;
        }

        function getPlayoffSeriesStat(playerName, metric) {
            // Get all playoff rows for this player from poStats
            // Note: poStats uses "PLAYER" field, not "NAME"
            const rawRows = playerData.poStats.filter(row => row.PLAYER === playerName);
            if (rawRows.length === 0) return null;
            const playerRows = deduplicateSeasonRows(rawRows);
            
            // Count each result type
            const resultCounts = {
                'First Round': 0,
                'Conf Semis': 0,
                'Conf Finalist': 0,
                'Finalist': 0,
                'Champion': 0
            };
            
            playerRows.forEach(row => {
                const result = row.RESULT;
                if (resultCounts.hasOwnProperty(result)) {
                    resultCounts[result]++;
                }
            });
            
            // For playoff success metrics, calculate cumulative counts
            // If you reached Champion, you also reached all earlier rounds that year
            if (metric === 'Champion') {
                return resultCounts['Champion'] > 0 ? resultCounts['Champion'] : null;
            }
            
            if (metric === 'Finalist') {
                const count = resultCounts['Finalist'] + resultCounts['Champion'];
                return count > 0 ? count : null;
            }
            
            if (metric === 'Conference Finals') {
                const count = resultCounts['Conf Finalist'] + resultCounts['Finalist'] + resultCounts['Champion'];
                return count > 0 ? count : null;
            }
            
            if (metric === 'Conference Semis') {
                const count = resultCounts['Conf Semis'] + resultCounts['Conf Finalist'] + resultCounts['Finalist'] + resultCounts['Champion'];
                return count > 0 ? count : null;
            }
            
            if (metric === 'First Round') {
                const count = resultCounts['First Round'] + resultCounts['Conf Semis'] + resultCounts['Conf Finalist'] + resultCounts['Finalist'] + resultCounts['Champion'];
                return count > 0 ? count : null;
            }
            
            // For other playoff series stats, use poSeries data
            const playerSeriesRow = playerData.poSeries.find(row => row.NAME === playerName);
            if (!playerSeriesRow) return null;
            
            if (metric === 'Playoff series played') {
                return playerSeriesRow.TOT || null;
            }
            
            if (metric === 'Playoff series won') {
                return playerSeriesRow.W || null;
            }
            
            if (metric === 'Playoff series win %') {
                return playerSeriesRow['% W'] || null;
            }
            
            return null;
        }

        function getSalaryStat(playerName, metric) {
            const playerRows = playerData.salaries.filter(row => row.PLAYER === playerName);
            if (playerRows.length === 0) return null;
            
            // Group by year to avoid counting same salary multiple times in one season
            const salariesByYear = {};
            playerRows.forEach(row => {
                const year = row.YEAR;
                const salary = parseFloat(String(row.SALARY || '').replace(/[$,]/g, ''));
                
                if (!isNaN(salary) && salary > 0 && year) {
                    // Keep track of salaries per year, store in array in case of mid-season trades
                    if (!salariesByYear[year]) {
                        salariesByYear[year] = [];
                    }
                    salariesByYear[year].push(salary);
                }
            });
            
            // For each year, sum all salaries (in case of mid-season trades)
            const yearlyTotals = [];
            for (const year in salariesByYear) {
                const yearTotal = salariesByYear[year].reduce((sum, val) => sum + val, 0);
                yearlyTotals.push(yearTotal);
            }
            
            if (yearlyTotals.length === 0) return null;
            
            if (metric === 'Career earnings') {
                const total = yearlyTotals.reduce((sum, val) => sum + val, 0);
                return '$' + Math.round(total).toLocaleString();
            }
            
            if (metric === 'Average salary') {
                const avg = yearlyTotals.reduce((sum, val) => sum + val, 0) / yearlyTotals.length;
                return '$' + Math.round(avg).toLocaleString();
            }
            
            if (metric === 'Highest salary') {
                const max = Math.max(...yearlyTotals);
                return '$' + Math.round(max).toLocaleString();
            }
            
            if (metric === 'Lowest salary') {
                const min = Math.min(...yearlyTotals);
                return '$' + Math.round(min).toLocaleString();
            }
            
            return null;
        }

        function getCombineStat(playerName, metric) {

        function getVotingStat(playerName, metric) {
            const playerVotes = playerData.awardVotes.filter(row => row.PLAYER === playerName);
            
            // Best awards ranking - find lowest (best) rank for each award
            const awardRankingMap = {
                'Most Valuable Player': 'MVP',
                'Defensive Player of the Year': 'DPOY',
                'Rookie of the Year': 'ROY',
                'Most Improved Player': 'MIP',
                'Clutch Player of the Year': 'Clutch',
                'Sixth Man of the Year': 'Sixth Man',
                'Hustle Award': 'Hustle'
            };
            
            if (awardRankingMap[metric]) {
                const awardType = awardRankingMap[metric];
                const relevantVotes = playerVotes.filter(row => row.AWARD === awardType);
                
                if (relevantVotes.length === 0) return null;
                
                let bestRank = Infinity;
                relevantVotes.forEach(row => {
                    const rank = parseInt(row.RNK);
                    if (!isNaN(rank) && rank < bestRank) {
                        bestRank = rank;
                    }
                });
                
                return bestRank < Infinity ? bestRank : null;
            }
            
            // Years receiving votes
            const yearsVotesMap = {
                'Years with MVP votes': 'MVP',
                'Years with DPOY votes': 'DPOY',
                'Years with ROY votes': 'ROY',
                'Years with Sixth Man votes': 'Sixth Man',
                'Years with MIP votes': 'MIP',
                'Years with Clutch Player votes': 'Clutch',
                'Years with Hustle Award votes': 'Hustle'
            };
            
            if (yearsVotesMap[metric]) {
                const awardType = yearsVotesMap[metric];
                const relevantVotes = playerVotes.filter(row => row.AWARD === awardType);
                return relevantVotes.length > 0 ? relevantVotes.length : null;
            }
            
            return null;
        }

        function getSneakerStat(playerName, metric) {
            const playerRow = playerData.sneakers.find(row => row.PLAYER === playerName);
            if (!playerRow) return null;
            
            if (metric === 'Number of Shoes') {

        function get2KRating(playerName, metric) {
            const playerRow = playerData.nba2k.find(row =>

                row['First Name'] + ' ' + row['Last Name'] === playerName
            );

        function getAllStarContestWins(playerName, metric) {
