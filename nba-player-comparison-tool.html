        // ==========================================
        // SECTION/ROW FILTERING (display + scoring layer) — additive.
        // Lets readers hide sections or individual rows; hidden items drop out of
        // the displayed totals. The original `results` object is never mutated —
        // the visible view (and scores) is derived from it on every toggle.
        // ==========================================

        // Recompute visible scores from the immutable result + the hidden sets.
        // Mirrors the engine's scoring: a winning row adds to its section subtotal,
        // and to the overall unless its section is excluded (DRAFT COMBINE), so with
        // nothing hidden the totals equal the originally computed scores.
        function computeVisibleScores(results, hiddenSections) {
            let p1 = 0, p2 = 0;
            const sectionScores = {};
            Object.keys(results.categories).forEach(sec => {
                sectionScores[sec] = { player1: 0, player2: 0 };
                if (hiddenSections.has(sec)) return;
                results.categories[sec].forEach(item => {
                    if (item.winner === 'player1') {
                        sectionScores[sec].player1++;
                        if (sec !== 'DRAFT COMBINE') p1++;
                    } else if (item.winner === 'player2') {
                        sectionScores[sec].player2++;
                        if (sec !== 'DRAFT COMBINE') p2++;
                    }
                });
            });
            return { player1Score: p1, player2Score: p2, sectionScores: sectionScores };
        }

        // Re-attach the score-summary name click behavior (career mode) after a render.
        function wireScoreNameClicks(scope) {
            scope.querySelectorAll('.clickable-player-name').forEach(nameEl => {
                nameEl.addEventListener('click', function() {
                    const clickedPlayer = this.getAttribute('data-player-name');
                    const currentP1 = document.getElementById('player1-top').value;
                    const currentP2 = document.getElementById('player2-top').value;
                    if (clickedPlayer === currentP1) {
                        const newP2 = getRandomAllStar();
                        if (newP2 && newP2 !== clickedPlayer) {
                            document.getElementById('player2-top').value = newP2;
                            document.getElementById('player2-bottom').value = newP2;
                            compareFromInputs();
                        }
                    } else if (clickedPlayer === currentP2) {
                        const newP1 = getRandomAllStar();
                        if (newP1 && newP1 !== clickedPlayer) {
                            document.getElementById('player1-top').value = newP1;
                            document.getElementById('player1-bottom').value = newP1;
                            compareFromInputs();
                        }
                    }
                });
            });
        }

        // Render the score summary + sections (with hide/show toggles) into `wrap`,
        // keeping a hidden-set in closure so toggling re-derives the view live.
        // ===== Look: headshots and player pages (HoopsMatic Head to Head) =====
        // Busts from nba-headshots, the file Head to Head shows for the player, on a light grey
        // disc; fallbacks as Head to Head's: head-uniform-480, face-tight, then the initials.
        const HM_HUB = 'https://hoopsmatic.com/head-to-head/player/';
        const HS_BUST = 'https://jsierrahoopshype.github.io/nba-headshots/players/headshots/head-uniform-sharp/';
        const HS_ERR = "var s=this.dataset.s;if(!s){this.dataset.s=1;this.src=this.src.replace('/head-uniform-sharp/','/head-uniform-480/')}" +
            "else if(s==1){this.dataset.s=2;this.src=this.src.replace('/head-uniform-480/','/face-tight/')}else{this.onerror=null;this.parentNode.textContent=this.dataset.i}";
        function hmEsc(v) {
            return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function playerInitials(name) {
            const w = String(name || '').replace(/\./g, ' ').replace(/\(\d{4}\)/g, '').split(/\s+/).filter(x => x && !/^(jr|sr|ii|iii|iv|v),?$/i.test(x));
            return w.length ? (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase() : '?';
        }
        // His Head to Head page on HoopsMatic, or '' when there is none.
        function playerPageUrl(name) {
            const l = playerLinks[name];
            return l && l.hub && /^[a-z0-9-]+$/.test(l.hub) ? HM_HUB + l.hub + '/' : '';
        }
        // A face disc (cls 'ph' with a size, or 'f' / 'fm'); a link to his page when he has one.
        function playerFace(name, cls, size) {
            const l = playerLinks[name] || {}, ini = hmEsc(playerInitials(name)), url = playerPageUrl(name);
            const st = size ? ` style="--s:${size}px"` : '';
            const img = l.hs && /^[0-9a-z-]+$/.test(l.hs)
                ? `<img src="${HS_BUST + l.hs}.webp" alt="${hmEsc(name)}"${cls === 'ph' ? '' : ' loading="lazy"'} data-i="${ini}" onerror="${HS_ERR}">`
                : ini;
            return url
                ? `<a class="${cls}"${st} href="${url}" title="${hmEsc(name)} on HoopsMatic" aria-label="${hmEsc(name)}">${img}</a>`
                : `<span class="${cls}"${st}>${img}</span>`;
        }
        // The players behind a side's label: a group's "A + B" (combine mode) or one player.
        function sideMembers(label) {
            return players.includes(label) || playerLinks[label] ? [label] : String(label).split(' + ');
        }
        function sideFaces(label, big) {
            const m = sideMembers(label);
            if (m.length === 1) return playerFace(m[0], 'ph', big);
            return '<div class="sb-faces">' + m.map(n => playerFace(n, 'fm')).join('') + '</div>';
        }
        // A side's name(s), each player a link to his Head to Head page when he has one
        // (site rule: every named player links to his page); a group reads "A + B".
        function playerNameLinks(label) {
            return sideMembers(label).map(n => {
                const url = playerPageUrl(n), inner = nameWords(n);
                return url ? `<a class="pn" href="${url}" data-full="${hmEsc(n)}">${inner}</a>`
                           : `<span class="pn" data-full="${hmEsc(n)}">${inner}</span>`;
            }).join(' + ');
        }
        // A name as unbreakable words: lines may break between words, never inside one.
        // hyphenBreak (last resort, see fitComparison): a hyphenated surname may also break
        // right after its own hyphen ("Gilgeous-" / "Alexander").
        function nameWords(n, hyphenBreak) {
            return String(n).split(/\s+/).filter(Boolean).map(w => hyphenBreak && w.indexOf('-') > 0
                ? w.replace(/-/g, '-\n').split('\n').map(part => `<span class="nb">${hmEsc(part)}</span>`).join('<wbr>')
                : `<span class="nb">${hmEsc(w)}</span>`).join(' ');
        }
        // "Giannis Antetokounmpo" -> "G. Antetokounmpo" (the rest of the name kept as is).
        function initialName(n) {
            const w = String(n).split(/\s+/).filter(Boolean);
            return w.length < 2 ? n : w[0].charAt(0) + '. ' + w.slice(1).join(' ');
        }

        // ===== Fitting names and figures into their columns (phones) =====
        // Rules: a name never breaks inside a word, a number never wraps.
        //   - names: shrink the font down to a readable minimum; if it still doesn't fit,
        //     show "G. Antetokounmpo" (the full name stays as the link's accessible name);
        //   - money: in a section where any dollar figure doesn't fit, all its dollar
        //     figures show in short form ($397.5M); the full figure stays for screen
        //     readers and comes back when there is room (wider screen);
        //   - other numbers that don't fit: a smaller font.
        // Runs after every render, when a results box changes width, and when the fonts load.
        const NAME_MIN_PX = { score: 12, head: 10.5 }, NUM_MIN_PX = 11;
        const MONEY_RE = /^\$\d{1,3}(,\d{3})+(\.\d+)?$/;
        // Wider than its box? The widest unbreakable piece (a name word, a figure) against the
        // content width; scrollWidth alone misses overflow on the start side of right-aligned cells.
        function overflows(el) {
            const cs = getComputedStyle(el);
            const avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            let widest = 0;
            el.querySelectorAll('.nb, .num').forEach(x => {
                if (x.closest('.sr-only')) return;
                const vis = x.classList.contains('num') ? (x.querySelector('[aria-hidden="true"]') || x) : x;
                widest = Math.max(widest, vis.getBoundingClientRect().width);
            });
            return widest > avail + 0.5 || el.scrollWidth > el.clientWidth + 0.5;
        }
        function shrinkToFit(el, minPx) {
            let size = parseFloat(getComputedStyle(el).fontSize);
            while (overflows(el) && size > minPx) { size = Math.max(minPx, size - 0.5); el.style.fontSize = size + 'px'; }
            return !overflows(el);
        }
        function setName(pn, short, hyphenBreak) {
            const full = pn.dataset.full;
            pn.innerHTML = short
                ? `<span aria-hidden="true">${nameWords(initialName(full), hyphenBreak)}</span><span class="sr-only">${hmEsc(full)}</span>`
                : nameWords(full);
            if (short) pn.setAttribute('title', full); else pn.removeAttribute('title');
        }
        function shortMoney(s) {
            const n = parseFloat(String(s).replace(/[$,]/g, ''));
            if (!isFinite(n)) return s;
            const a = Math.abs(n);
            const [d, u] = a >= 1e9 ? [1e9, 'B'] : a >= 1e6 ? [1e6, 'M'] : a >= 1e3 ? [1e3, 'K'] : [1, ''];
            if (!u) return s;
            const v = n / d;
            return '$' + v.toFixed(v >= 10 ? 1 : 2) + u;   // $397.5M, $28.4M, $1.79M
        }
        function setNum(num, short) {
            const full = num.dataset.full;
            num.innerHTML = short ? `<span aria-hidden="true">${hmEsc(shortMoney(full))}</span><span class="sr-only">${hmEsc(full)}</span>` : hmEsc(full);
        }
        function fitComparison(scope) {
            if (!scope || !scope.offsetWidth) return;   // hidden (other tab): fitted when shown
            scope.querySelectorAll('.player-name-score, .cmp-head .player-name-cell').forEach(el => {
                const min = el.classList.contains('player-name-score') ? NAME_MIN_PX.score : NAME_MIN_PX.head;
                const pns = el.querySelectorAll('.pn');
                el.style.fontSize = '';
                pns.forEach(pn => setName(pn, false));
                if (shrinkToFit(el, min)) return;
                el.style.fontSize = '';
                pns.forEach(pn => setName(pn, true));
                if (shrinkToFit(el, min)) return;
                // last resort: a hyphenated surname may break after its hyphen
                el.style.fontSize = '';
                pns.forEach(pn => setName(pn, true, true));
                shrinkToFit(el, min);
            });
            scope.querySelectorAll('.section-score').forEach(el => el.querySelectorAll('.pn').forEach(pn => setName(pn, false)));
            scope.querySelectorAll('.cmp-box').forEach(box => {
                const cells = [...box.querySelectorAll('.player-value')].filter(c => c.querySelector('.num'));
                cells.forEach(c => { c.style.fontSize = ''; setNum(c.querySelector('.num'), false); });
                const money = cells.filter(c => MONEY_RE.test(c.querySelector('.num').dataset.full));
                if (money.some(overflows)) money.forEach(c => setNum(c.querySelector('.num'), true));
                cells.forEach(c => { if (overflows(c)) shrinkToFit(c, NUM_MIN_PX); });
            });
        }
        // Refit when a results box changes width (rotation, resize, a tab shown) and once the fonts are in.
        const fitWidths = new WeakMap();
        const fitObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(entries => {
            entries.forEach(e => {
                const w = Math.round(e.contentRect.width);
                if (w && fitWidths.get(e.target) !== w) { fitWidths.set(e.target, w); fitComparison(e.target); }
            });
        }) : null;
        function watchFit(wrap) {
            if (fitObserver && !fitWidths.has(wrap)) { fitWidths.set(wrap, Math.round(wrap.getBoundingClientRect().width)); fitObserver.observe(wrap); }
        }
        if (document.fonts) {
            const refitAll = () => document.querySelectorAll('.filter-cmp-wrap').forEach(fitComparison);
            document.fonts.ready.then(refitAll);
            if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', refitAll);
        }
        const SHUFFLE_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>';

        // House rule: in a stat ordering 3-pointers go last. Display order only (scores are
        // computed before this): inside each run of regular-season or playoff stats, the
        // "Three Point %" rows move to the end of that run.
        function threesLast(items) {
            const isThree = (it) => /^Three Point %/.test(it.metric);
            if (!items.some(isThree)) return items;
            const isPO = (it) => /\bPO\b/.test(it.metric);
            const out = [];
            let run = [];
            const flush = () => { out.push(...run.filter(it => !isThree(it)), ...run.filter(isThree)); run = []; };
            items.forEach(it => { if (run.length && isPO(run[0]) !== isPO(it)) flush(); run.push(it); });
            flush();
            return out;
        }

        function renderFilterableComparison(wrap, results, p1, p2, opts) {
            opts = opts || {};
            const clickable = !!opts.clickable;
            const hiddenSections = new Set();

            const esc = (s) => String(s);
            // The name links to his page; in career mode a shuffle button beside it keeps the
            // "random opponent" action the name used to have (wireScoreNameClicks reads
            // .clickable-player-name). Groups (combine mode) get no button: it did nothing there.
            const nameDiv = (n) => {
                const shuffle = clickable && players.includes(n)
                    ? `<button type="button" class="sb-shuffle clickable-player-name" data-player-name="${hmEsc(n)}" title="Random opponent for ${hmEsc(n)}" aria-label="Random opponent for ${hmEsc(n)}">${SHUFFLE_SVG}</button>`
                    : '';
                return `<div class="sb-namerow"><div class="player-name-score">${playerNameLinks(n)}</div>${shuffle}</div>`;
            };
            const nameSpan = (n) => playerNameLinks(n);
            // a side's small faces for a box's header row (each member of a group)
            const headFaces = (n) => '<span class="sb-faces">' + sideMembers(n).map(m => playerFace(m, 'f')).join('') + '</span>';

            function render() {
                const sc = computeVisibleScores(results, hiddenSections);
                const lead = sc.player1Score > sc.player2Score ? 1 : (sc.player2Score > sc.player1Score ? 2 : 0);
                let html = `
                    <div class="score-summary">
                        <div class="player-score">${sideFaces(p1, 72)}${nameDiv(p1)}</div>
                        <div class="sb-mid"><div class="sb-big"><span class="score-value${lead === 1 ? ' lead1' : ''}">${sc.player1Score}</span><i class="score-divider">–</i><span class="score-value${lead === 2 ? ' lead2' : ''}">${sc.player2Score}</span></div></div>
                        <div class="player-score">${sideFaces(p2, 72)}${nameDiv(p2)}</div>
                    </div>`;

                Object.keys(results.categories).forEach(sec => {
                    const items = results.categories[sec];
                    if (items.length === 0) return;
                    const secHidden = hiddenSections.has(sec);
                    const ss = sc.sectionScores[sec] || { player1: 0, player2: 0 };
                    const showScore = !secHidden && (ss.player1 > 0 || ss.player2 > 0);
                    const subtitle = showScore
                        ? `<div class="section-score">${nameSpan(p1)} ${ss.player1} – ${nameSpan(p2)} ${ss.player2}</div>`
                        : '';

                    html += `<div class="category-section${secHidden ? ' cmp-section-hidden' : ''}">
                        <div class="category-title">
                            <label class="cmp-toggle-label" title="Show or hide this section"><input type="checkbox" class="cmp-sec-check" data-section="${esc(sec)}" ${secHidden ? '' : 'checked'}></label>
                            ${esc(sec)}
                            ${subtitle}
                        </div>`;

                    if (!secHidden) {
                        // one box per section (Head to Head .vt): both players in a header row, then a row per stat
                        html += `<div class="cmp-box"><div class="cmp-head">
                                    <div>${headFaces(p1)}<div class="player-name-cell">${playerNameLinks(p1)}</div></div>
                                    <div></div>
                                    <div>${headFaces(p2)}<div class="player-name-cell">${playerNameLinks(p2)}</div></div>
                                </div>`;
                        threesLast(items).forEach(item => {
                            const rowClass = item.winner === 'player1' ? 'winner-left' :
                                            item.winner === 'player2' ? 'winner-right' : 'tie';
                            const p1Class = item.winner === 'player1' ? 'player-value winner' : 'player-value';
                            const p2Class = item.winner === 'player2' ? 'player-value winner' : 'player-value';
                            const numSpan = (v) => `<span class="num" data-full="${hmEsc(v)}">${hmEsc(v)}</span>`;
                            const p1Display = item.player1Value !== null ? numSpan(item.player1Value) : '<span class="no-data">–</span>';
                            const p2Display = item.player2Value !== null ? numSpan(item.player2Value) : '<span class="no-data">–</span>';

                            html += `
                                <div class="comparison-row ${rowClass}">
                                    <div class="${p1Class}">${p1Display}</div>
                                    <div class="metric-name">${esc(item.metric)}</div>
                                    <div class="${p2Class}">${p2Display}</div>
                                </div>`;
                        });
                        html += `</div>`;
                    }

                    html += `</div>`;
                });

                wrap.innerHTML = html;
                fitComparison(wrap);
                watchFit(wrap);

                wrap.querySelectorAll('.cmp-sec-check').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const s = this.getAttribute('data-section');
                        if (this.checked) hiddenSections.delete(s); else hiddenSections.add(s);
                        render();
                    });
                });
                if (clickable) wireScoreNameClicks(wrap);
                if (typeof opts.afterRender === 'function') opts.afterRender();
            }

            render();
        }

        function displayResults(results, player1Name, player2Name) {
            const resultsDiv = document.getElementById('results');

            // Filterable scored region (toggles + live recompute); extras live outside it.
            // While the loop runs, a Stop button sits at the top of the results (in the page,
            // nothing pinned over it).
            resultsDiv.innerHTML = (loopActive
                ? '<div class="loop-stop-bar"><button type="button" class="loop-button active" onclick="toggleLoop()">Stop Comparison Loop</button></div>'
                : '') + '<div class="filter-cmp-wrap"></div>';
            const wrap = resultsDiv.querySelector('.filter-cmp-wrap');
            renderFilterableComparison(wrap, results, player1Name, player2Name, {
                clickable: true,
                afterRender: makePlayerNamesClickable
            });

            let extra = '';

            // Add same-era suggestion button (only if All-Stars data is available)
            const sameEraP1 = getSameEraAllStar(player1Name);
            const sameEraP2 = getSameEraAllStar(player2Name);
            if (sameEraP1 && sameEraP2) {
                extra += `
                    <div class="suggestions-section">
                        <h3>Try These Comparisons</h3>
                        <div class="suggestion-chips">
                            <button class="suggestion-btn" data-p1="${player1Name}" data-p2="${sameEraP1}">
                                ${player1Name} vs ${sameEraP1}
                            </button>
                            <button class="suggestion-btn" data-p1="${player2Name}" data-p2="${sameEraP2}">
                                ${player2Name} vs ${sameEraP2}
                            </button>
                        </div>
                    </div>
                `;
            }

            // Add bottom loop button
            extra += `
                <div class="loop-controls">
                    <button class="loop-button" id="loopBtnBottom" onclick="toggleLoop()">${loopActive ? 'Stop Comparison Loop' : 'Start Comparison Loop'}</button>
                </div>
            `;

            resultsDiv.insertAdjacentHTML('beforeend', extra);

            // Attach click handlers to suggestion buttons
            resultsDiv.querySelectorAll('.suggestion-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const p1 = this.getAttribute('data-p1');
                    const p2 = this.getAttribute('data-p2');
                    loadComparison(p1, p2);
                });
            });
        }
        
        // ==========================================
        // LOOP MODE — matches Season Comparison Tool
        // ==========================================
        let loopActive = false;
        let usedOpponents = new Set();
        let scrollAnimationId = null;

        function updateStickyPlayerOptions() {
            const p1Name = document.getElementById('player1-top').value || 'Player 1';
            const p2Name = document.getElementById('player2-top').value || 'Player 2';
            
            document.getElementById('stickyP1Option').textContent = `Keep ${p1Name}`;
            document.getElementById('stickyP2Option').textContent = `Keep ${p2Name}`;
        }

        function getRandomOpponent(excludePlayers) {
            if (!playerData.allStarsData || !playerData.allStarsData.allStars1990Plus) return null;
            
            // Filter to only All-Stars that exist in our players array (from rsStats)
            const allStars = playerData.allStarsData.allStars1990Plus.filter(name => 
                players.includes(name)
            );
            
            if (allStars.length === 0) return null;
            
            const available = allStars.filter(p => 
                !excludePlayers.includes(p) && !usedOpponents.has(p)
            );
            
            // If we've used all opponents, reset the used list
            if (available.length === 0) {
                usedOpponents.clear();
                const freshAvailable = allStars.filter(p => !excludePlayers.includes(p));
                if (freshAvailable.length === 0) return null;
                const pick = freshAvailable[Math.floor(Math.random() * freshAvailable.length)];
                usedOpponents.add(pick);
                return pick;
            }
            
            const pick = available[Math.floor(Math.random() * available.length)];
            usedOpponents.add(pick);
            return pick;
        }

        function smoothScrollToBottom(durationMs) {
            // Cancel any existing scroll animation
            if (scrollAnimationId) {
                cancelAnimationFrame(scrollAnimationId);
            }
            
            // Start from the top of the page
            const startY = 0;
            window.scrollTo(0, startY);
            
            const targetY = document.documentElement.scrollHeight - window.innerHeight;
            const distance = targetY - startY;
            
            // If no scrolling needed (page fits in viewport), wait then trigger next comparison
            if (distance <= 0) {
                setTimeout(() => {
                    if (loopActive) runLoopComparison();
                }, 3000);
                return;
            }
            
            const startTime = performance.now();
            
            function animateScroll(currentTime) {
                if (!loopActive) return;
                
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / durationMs, 1);
                
                // Linear scrolling - constant speed
                window.scrollTo(0, startY + (distance * progress));
                
                if (progress < 1) {
                    scrollAnimationId = requestAnimationFrame(animateScroll);
                } else {
                    // Scroll finished - trigger next comparison after 1.5 seconds
                    setTimeout(() => {
                        if (loopActive) runLoopComparison();
                    }, 1500);
                }
            }
            
            scrollAnimationId = requestAnimationFrame(animateScroll);
        }

        function startLoop() {
            const loopBtn = document.getElementById('loopBtn');
            const loopBtnBottom = document.getElementById('loopBtnBottom');
            const scrollSelect = document.getElementById('scrollDuration');
            const stickySelect = document.getElementById('stickyPlayer');
            
            loopActive = true;
            loopBtn.textContent = 'Stop Comparison Loop';
            loopBtn.classList.add('active');
            if (loopBtnBottom) {
                loopBtnBottom.textContent = 'Stop Comparison Loop';
                loopBtnBottom.classList.add('active');
            }
            // (the in-page Stop bar appears at the top of the results with the first loop render)
            scrollSelect.disabled = true;
            stickySelect.disabled = true;
            usedOpponents.clear();
            
            // Update sticky player labels
            updateStickyPlayerOptions();
            
            // Run first comparison immediately (scroll callback will trigger next)
            runLoopComparison();
        }

        function stopLoop() {
            const loopBtn = document.getElementById('loopBtn');
            const loopBtnBottom = document.getElementById('loopBtnBottom');
            const scrollSelect = document.getElementById('scrollDuration');
            const stickySelect = document.getElementById('stickyPlayer');
            
            loopActive = false;
            loopBtn.textContent = 'Start Comparison Loop';
            loopBtn.classList.remove('active');
            if (loopBtnBottom) {
                loopBtnBottom.textContent = 'Start Comparison Loop';
                loopBtnBottom.classList.remove('active');
            }
            document.querySelectorAll('.loop-stop-bar').forEach(el => el.remove());
            scrollSelect.disabled = false;
            stickySelect.disabled = false;
            
            if (scrollAnimationId) {
                cancelAnimationFrame(scrollAnimationId);
                scrollAnimationId = null;
            }
        }

        function toggleLoop() {
            if (loopActive) {
                stopLoop();
            } else {
                startLoop();
            }
        }

        function runLoopComparison() {
            const stickyMode = document.getElementById('stickyPlayer').value;
            const scrollDuration = parseInt(document.getElementById('scrollDuration').value) * 1000;
            const currentP1 = document.getElementById('player1-top').value;
            const currentP2 = document.getElementById('player2-top').value;
            
            if (stickyMode === 'p1') {
                // Keep Player 1, randomize Player 2
                const newOpponent = getRandomOpponent([currentP1]);
                if (!newOpponent) return;
                
                document.getElementById('player2-top').value = newOpponent;
                document.getElementById('player2-bottom').value = newOpponent;
                
            } else if (stickyMode === 'p2') {
                // Keep Player 2, randomize Player 1
                const newOpponent = getRandomOpponent([currentP2]);
                if (!newOpponent) return;
                
                document.getElementById('player1-top').value = newOpponent;
                document.getElementById('player1-bottom').value = newOpponent;
                
            } else {
                // Randomize both players - use All-Stars that exist in our dataset
                let allStars = [];
                if (playerData.allStarsData && playerData.allStarsData.allStars1990Plus) {
                    allStars = playerData.allStarsData.allStars1990Plus.filter(name => 
                        players.includes(name)
                    );
                }
                
                // Fallback: if no All-Stars available, pick from top of players list
                if (allStars.length < 2) {
                    allStars = players.slice(0, 100);
                }
                
                if (allStars.length < 2) return;
                
                const idx1 = Math.floor(Math.random() * allStars.length);
                let idx2 = Math.floor(Math.random() * allStars.length);
                while (idx2 === idx1) idx2 = Math.floor(Math.random() * allStars.length);
                
                document.getElementById('player1-top').value = allStars[idx1];
                document.getElementById('player2-top').value = allStars[idx2];
                document.getElementById('player1-bottom').value = allStars[idx1];
                document.getElementById('player2-bottom').value = allStars[idx2];
            }
            
            compareFromInputs();
            
            // Start smooth scroll after brief delay for content to render
            setTimeout(() => {
                if (loopActive) {
                    smoothScrollToBottom(scrollDuration);
                }
            }, 1500);
        }

        function loadComparison(p1, p2) {
            document.getElementById('player1-top').value = p1;
            document.getElementById('player2-top').value = p2;
            document.getElementById('player1-bottom').value = p1;
            document.getElementById('player2-bottom').value = p2;
            compareFromInputs();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // RANGE COMPARISON (new, additive)
        // Compares two players over a slice of their careers (a season range
        // or an age range). It reuses the existing performComparison() engine
        // by temporarily injecting year-filtered copies of the data arrays,
        // then restoring them. No existing career-comparison code is modified.
        // ==========================================

        let rangeAutocompleteReady = false;

        // Sections shown in the range comparison. Order is taken from
        // comparisons.json; everything else (Draft Combine, Signature Shoes,
        // All-Star contests, Best Vote Ranking) is excluded.
        const RANGE_SECTIONS = new Set([
            'ACCOLADES', 'NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK',
            'PLAYOFF SUCCESS', 'BEST AWARDS RANKING', 'YEARS RECEIVING VOTES', 'SALARIES', 'NBA 2K'
        ]);

        function switchTab(tab) {
            const careerPanel = document.getElementById('careerPanel');
            const rangePanel = document.getElementById('rangePanel');
            const tabCareer = document.getElementById('tab-career');
            const tabRange = document.getElementById('tab-range');

            if (tab === 'range') {
                careerPanel.style.display = 'none';
                rangePanel.style.display = 'block';
                tabCareer.classList.remove('active');
                tabRange.classList.add('active');

                // Wire up autocomplete the first time the tab is opened (data is loaded by now)
                if (!rangeAutocompleteReady && dataLoaded) {
                    setupRangeAutocomplete();
                    rangeAutocompleteReady = true;
                }
                // Convenience: prefill from the career inputs if the range inputs are empty
                const rp1 = document.getElementById('range-player1');
                const rp2 = document.getElementById('range-player2');
                if (!rp1.value) rp1.value = document.getElementById('player1-top').value || '';
                if (!rp2.value) rp2.value = document.getElementById('player2-top').value || '';
            } else {
                rangePanel.style.display = 'none';
                careerPanel.style.display = 'block';
                tabRange.classList.remove('active');
                tabCareer.classList.add('active');
            }
        }

        function updateRangeLabels() {
            const mode = document.getElementById('range-mode').value;
            const unit = mode === 'age' ? 'age' : (mode === 'calendar' ? 'year' : 'season #');
            document.getElementById('range-from-label').textContent = 'From (' + unit + ')';
            document.getElementById('range-to-label').textContent = 'To (' + unit + ')';
            document.getElementById('range-from2-label').textContent = 'Player 2 From (' + unit + ')';
            document.getElementById('range-to2-label').textContent = 'Player 2 To (' + unit + ')';

            // Calendar mode uses year dropdowns (populated from the players); other modes
            // keep their free number inputs. Only the input UI swaps — compareRange still
            // reads the same range-from/range-to (kept mirrored from the selects).
            const isCal = mode === 'calendar';
            [['range-from', 'range-from-cal'], ['range-to', 'range-to-cal'],
             ['range-from2', 'range-from2-cal'], ['range-to2', 'range-to2-cal']].forEach(pair => {
                const ie = document.getElementById(pair[0]);
                const se = document.getElementById(pair[1]);
                if (ie) ie.style.display = isCal ? 'none' : '';
                if (se) se.style.display = isCal ? '' : 'none';
            });
            if (isCal) populateCalendarYears();
        }

        // Format an NBA ending-year as a full season label, e.g. 2018 -> "2017-18".
        function formatSeasonLabel(y) {
            const yr = parseInt(y, 10);
            if (isNaN(yr)) return String(y);
            return (yr - 1) + '-' + String(yr).slice(-2);
        }

        // Distinct rsStats YEARs (ascending, as strings) across the given players.
        function getUnionYears(names) {
            const set = new Set();
            names.forEach(n => {
                playerData.rsStats.forEach(r => {
                    if (r.PLAYER === n && r.YEAR != null && r.YEAR !== '') set.add(String(r.YEAR));
                });
            });
            return [...set].sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
        }

        // Fill one year <select>, preserving the paired number input's value if still valid
        // (else default to min/max), then mirror the choice back into the number input.
        function populateOneYearSelect(selId, inpId, years, defaultLast) {
            const sel = document.getElementById(selId);
            const inp = document.getElementById(inpId);
            if (!sel || !inp) return;
            if (!years.length) { sel.innerHTML = ''; sel.disabled = true; return; }
            sel.disabled = false;
            sel.innerHTML = years.map(y => `<option value="${y}">${formatSeasonLabel(y)}</option>`).join('');
            const cur = String(inp.value);
            sel.value = years.indexOf(cur) !== -1 ? cur : (defaultLast ? years[years.length - 1] : years[0]);
            inp.value = sel.value;
        }

        // Populate the four calendar year dropdowns from the selected players' careers.
        function populateCalendarYears() {
            const p1 = findPlayerName((document.getElementById('range-player1').value || '').trim());
            const p2 = findPlayerName((document.getElementById('range-player2').value || '').trim());
            const need = [p1, p2].filter(Boolean);
            if (need.some(n => !isPlayerLoaded(n))) {
                // Fill the dropdowns again once the players' seasons have arrived.
                ensurePlayers(need).then(() => populateCalendarYears()).catch(err => console.error('[ComparePlayers]', err));
            }
            const union = getUnionYears([p1, p2].filter(Boolean));
            const p2years = p2 ? getUnionYears([p2]) : union;
            populateOneYearSelect('range-from-cal', 'range-from', union, false);
            populateOneYearSelect('range-to-cal', 'range-to', union, true);
            populateOneYearSelect('range-from2-cal', 'range-from2', p2years, false);
            populateOneYearSelect('range-to2-cal', 'range-to2', p2years, true);
        }

        // Mirror the calendar dropdown selections into the number inputs that compareRange reads.
        function onCalSelectChange() {
            [['range-from-cal', 'range-from'], ['range-to-cal', 'range-to'],
             ['range-from2-cal', 'range-from2'], ['range-to2-cal', 'range-to2']].forEach(pair => {
                const se = document.getElementById(pair[0]);
                const ie = document.getElementById(pair[1]);
                if (se && ie && se.value) ie.value = se.value;
            });
        }

        function toggleDiffRange() {
            const checked = document.getElementById('range-diff-p2').checked;
            document.getElementById('range-p2-fields').style.display = checked ? 'flex' : 'none';
        }

        function setupRangeAutocomplete() {
            const configs = [
                { input: 'range-player1', suggestions: 'range-suggestions1' },
                { input: 'range-player2', suggestions: 'range-suggestions2' }
            ];
            configs.forEach(config => {
                const inputEl = document.getElementById(config.input);
                const suggestionsEl = document.getElementById(config.suggestions);

                inputEl.addEventListener('input', function() {
                    const value = this.value.toLowerCase();
                    if (value.length < 2) { suggestionsEl.style.display = 'none'; return; }

                    const normalizedValue = normalizePlayerName(value);
                    const matches = players.filter(p =>
                        p.toLowerCase().includes(value) ||
                        normalizePlayerName(p).includes(normalizedValue)
                    ).slice(0, 10);

                    if (matches.length === 0) { suggestionsEl.style.display = 'none'; return; }

                    suggestionsEl.innerHTML = matches.map(player =>
                        `<div class="autocomplete-suggestion" data-player="${player}">${player}</div>`
                    ).join('');
                    suggestionsEl.style.display = 'block';

                    suggestionsEl.querySelectorAll('.autocomplete-suggestion').forEach(el => {
                        el.addEventListener('click', function() {
                            inputEl.value = this.getAttribute('data-player');
                            suggestionsEl.style.display = 'none';
                            // Refresh calendar year dropdowns when a player is picked.
                            if (document.getElementById('range-mode').value === 'calendar') populateCalendarYears();
                        });
                    });
                });

                // Typed (not picked) player changes also refresh the calendar dropdowns.
                inputEl.addEventListener('change', function() {
                    if (document.getElementById('range-mode').value === 'calendar') populateCalendarYears();
                });

                document.addEventListener('click', function(e) {
                    if (!inputEl.contains(e.target) && !suggestionsEl.contains(e.target)) {
                        suggestionsEl.style.display = 'none';
                    }
                });
            });
        }

        // --- Bio / age helpers ---
        function getBioRecord(playerName) {
            if (!playerData.bio) return null;
            return playerData.bio.find(r => r.PLAYER === playerName) || null;
        }

        function parseBirthday(str) {
            if (!str) return null;
            const parts = String(str).split('/');
            if (parts.length !== 3) return null;
            const month = parseInt(parts[0], 10);
            const day = parseInt(parts[1], 10);
            const year = parseInt(parts[2], 10);
            if (isNaN(month) || isNaN(day) || isNaN(year)) return null;
            return { month, day, year };
        }

        function ageAsOfFeb1(bd, seasonYear) {
            // Age on February 1 of the season's ending year.
            let age = seasonYear - bd.year;
            if (bd.month > 2 || (bd.month === 2 && bd.day > 1)) age -= 1;
            return age;
        }

        // Returns a Set of calendar years (ints) covered by the chosen
        // season/age range for this player, derived from their RS seasons.
        function computeInRangeYears(playerName, fromVal, toVal, mode) {
            const inRange = new Set();

            // Calendar Range: the year itself is the filter — return every year
            // from..to inclusive (no season-number or age math, player-independent).
            if (mode === 'calendar') {
                for (let y = fromVal; y <= toVal; y++) inRange.add(y);
                return inRange;
            }

            const rawRows = playerData.rsStats.filter(r => r.PLAYER === playerName);
            if (rawRows.length === 0) return inRange;

            const dedup = deduplicateSeasonRows(rawRows);
            const years = [...new Set(dedup.map(r => parseInt(r.YEAR, 10)).filter(y => !isNaN(y)))]
                .sort((a, b) => a - b);

            if (mode === 'age') {
                const bioRec = getBioRecord(playerName);
                const bd = parseBirthday(bioRec && bioRec.BIRTHDAY);
                if (!bd) return inRange;
                years.forEach(y => {
                    const age = ageAsOfFeb1(bd, y);
                    if (age >= fromVal && age <= toVal) inRange.add(y);
                });
            } else {
                years.forEach((y, idx) => {
                    const seasonNum = idx + 1; // Season 1 = earliest year
                    if (seasonNum >= fromVal && seasonNum <= toVal) inRange.add(y);
                });
            }
            return inRange;
        }

        // Wrapper helpers requested by spec: return only the in-range rows.
        function getFilteredRsStats(playerName, fromVal, toVal, mode) {
            const years = computeInRangeYears(playerName, fromVal, toVal, mode);
            return playerData.rsStats.filter(r =>
                r.PLAYER === playerName && years.has(parseInt(r.YEAR, 10)));
        }

        function getFilteredPoStats(playerName, fromVal, toVal, mode) {
            const years = computeInRangeYears(playerName, fromVal, toVal, mode);
            return playerData.poStats.filter(r =>
                r.PLAYER === playerName && years.has(parseInt(r.YEAR, 10)));
        }

        // Build a comparisons list containing only the allowed sections (in order),
        // dropping All-Star contest rows that live inside ACCOLADES.
        function buildRangeComparisons() {
            const out = [];
            let include = false;
            playerData.comparisons.forEach(comp => {
                const cat = comp['Comparison points'];
                const isHeader = !comp['Who wins?'] && !comp['Wheres the data?'];
                if (isHeader) {
                    include = RANGE_SECTIONS.has(cat);
                    if (include) out.push(comp);
                } else if (include) {
                    if (comp['Wheres the data?'] === 'All-Star.csv') return; // excluded contests
                    out.push(comp);
                }
            });
            return out;
        }

        // Combine-mode comparisons: the Range section set, minus NBA CAREER AVERAGES
        // (pooled group averages can mislead, so they're hidden for combined groups only).
        function buildCombineComparisons() {
            const COMBINE_EXCLUDED = ['NBA CAREER AVERAGES', 'NBA SEASON PEAK'];
            const out = [];
            let skip = false;
            buildRangeComparisons().forEach(comp => {
                const cat = comp['Comparison points'];
                const isHeader = !comp['Who wins?'] && !comp['Wheres the data?'];
                if (isHeader) {
                    skip = COMBINE_EXCLUDED.indexOf(cat) !== -1;
                    if (!skip) out.push(comp);
                } else if (!skip) {
                    out.push(comp);
                }
            });
            return out;
        }

        // Make a shallow copy of a player's NBA 2K row with out-of-range editions blanked.
        function build2KCloneForRange(playerName, years) {
            const row = playerData.nba2k.find(r =>
                r['Full Name'] === playerName ||
                (r['First Name'] + ' ' + r['Last Name']) === playerName);
            if (!row) return null;
            const clone = { ...row };
            Object.keys(clone).forEach(key => {
                if (key.startsWith('2K') || key.startsWith('2k')) {
                    const yy = parseInt(key.substring(2), 10);
                    if (isNaN(yy)) return;
                    const editionYear = 2000 + yy; // 2K16 -> 2016
                    if (!years.has(editionYear)) clone[key] = '';
                }
            });
            return clone;
        }

        // Run the standard comparison engine against year-filtered data.
        function performRangeComparison(p1, from1, to1, p2, from2, to2, mode) {
            const years1 = computeInRangeYears(p1, from1, to1, mode);
            const years2 = computeInRangeYears(p2, from2, to2, mode);

            // Combined filtered datasets (each player keyed by name inside performComparison).
            const filteredRs = getFilteredRsStats(p1, from1, to1, mode)
                .concat(getFilteredRsStats(p2, from2, to2, mode));
            const filteredPo = getFilteredPoStats(p1, from1, to1, mode)
                .concat(getFilteredPoStats(p2, from2, to2, mode));
            const filteredAwards = playerData.awards.filter(r => {
                const n = r['PLAYER / COACH'];
                return (n === p1 && years1.has(parseInt(r.YEAR, 10))) ||
                       (n === p2 && years2.has(parseInt(r.YEAR, 10)));
            });
            const filteredVotes = playerData.awardVotes.filter(r =>
                (r.PLAYER === p1 && years1.has(parseInt(r.YEAR, 10))) ||
                (r.PLAYER === p2 && years2.has(parseInt(r.YEAR, 10))));
            const filteredSalaries = playerData.salaries.filter(r =>
                (r.PLAYER === p1 && years1.has(parseInt(r.YEAR, 10))) ||
                (r.PLAYER === p2 && years2.has(parseInt(r.YEAR, 10))));
            const filtered2K = [];
            const c1 = build2KCloneForRange(p1, years1); if (c1) filtered2K.push(c1);
            const c2 = build2KCloneForRange(p2, years2); if (c2) filtered2K.push(c2);

            const rangeComparisons = buildRangeComparisons();

            // Swap in the filtered data, run the existing engine, then restore.
            const orig = {
                rsStats: playerData.rsStats, poStats: playerData.poStats,
                awards: playerData.awards, awardVotes: playerData.awardVotes,
                salaries: playerData.salaries, nba2k: playerData.nba2k,
                comparisons: playerData.comparisons
            };

            let results;
            try {
                playerData.rsStats = filteredRs;
                playerData.poStats = filteredPo;
                playerData.awards = filteredAwards;
                playerData.awardVotes = filteredVotes;
                playerData.salaries = filteredSalaries;
                playerData.nba2k = filtered2K;
                playerData.comparisons = rangeComparisons;
                results = performComparison(p1, p2);
            } finally {
                Object.assign(playerData, orig);
            }

            results.years1 = years1;
            results.years2 = years2;
            return results;
        }

        function rangeLabel(mode, fromVal, toVal) {
            // Calendar mode: no prefix — the (year-span) shown next to it is the range itself,
            // so the summary reads "[Player] (2018-2026)".
            if (mode === 'calendar') return '';
            return (mode === 'age' ? 'Ages ' : 'Seasons ') + fromVal + '-' + toVal;
        }

        function yearSpan(yearSet) {
            const arr = [...yearSet].sort((a, b) => a - b);
            if (arr.length === 0) return 'no seasons';
            return arr[0] + '-' + arr[arr.length - 1];
        }

        // Build the dynamic page title for a range comparison.
        // Same range for both players  -> "P1 vs P2 — Seasons X-Y Comparison"
        // Different ranges per player -> "P1 (Seasons X-Y) vs P2 (Seasons Z-W) Comparison"
        function rangeTitle(p1, p2, mode, from1, to1, from2, to2) {
            if (mode === 'calendar') {
                if (from1 !== from2 || to1 !== to2) {
                    return `${p1} (${from1}-${to1}) vs ${p2} (${from2}-${to2}) Comparison`;
                }
                return `${p1} vs ${p2} - ${from1}-${to1} Comparison`;
            }
            const unit = mode === 'age' ? 'Ages' : 'Seasons';
            if (from1 !== from2 || to1 !== to2) {
                return `${p1} (${unit} ${from1}-${to1}) vs ${p2} (${unit} ${from2}-${to2}) Comparison`;
            }
            return `${p1} vs ${p2} - ${unit} ${from1}-${to1} Comparison`;
        }

        // Push the current range comparison into the URL (history.pushState) and title.
        // mode is the internal value ('season' | 'age'); the URL uses 'seasons' | 'ages'.
        function updateRangeURL(p1, p2, mode, from1, to1, useDiff, from2, to2) {
            const url = new URL(window.location);
            url.searchParams.set('p1', p1);
            url.searchParams.set('p2', p2);
            url.searchParams.set('mode', mode === 'age' ? 'ages' : (mode === 'calendar' ? 'calendar' : 'seasons'));
            url.searchParams.set('from', from1);
            url.searchParams.set('to', to1);
            if (useDiff) {
                url.searchParams.set('from2', from2);
                url.searchParams.set('to2', to2);
            } else {
                url.searchParams.delete('from2');
                url.searchParams.delete('to2');
            }
            window.history.pushState({}, '', url);
            document.title = rangeTitle(p1, p2, mode, from1, to1, from2, to2);
        }

        // Populate the Range tab from URL params and auto-run (called on page load
        // when a valid `mode` param is present). urlParams is a URLSearchParams.
        function initRangeFromURL(urlParams) {
            const urlMode = urlParams.get('mode');
            const mode = urlMode === 'ages' ? 'age' : (urlMode === 'calendar' ? 'calendar' : 'season');
            const p1 = urlParams.get('p1');
            const p2 = urlParams.get('p2');
            const from = urlParams.get('from');
            const to = urlParams.get('to');
            const from2 = urlParams.get('from2');
            const to2 = urlParams.get('to2');

            // Switch to the Range tab (also wires up range autocomplete).
            switchTab('range');

            if (p1) document.getElementById('range-player1').value = p1;
            if (p2) document.getElementById('range-player2').value = p2;
            document.getElementById('range-mode').value = mode;
            updateRangeLabels();
            if (from !== null && from !== '') document.getElementById('range-from').value = from;
            if (to !== null && to !== '') document.getElementById('range-to').value = to;

            const hasDiff = from2 !== null && from2 !== '' && to2 !== null && to2 !== '';
            document.getElementById('range-diff-p2').checked = hasDiff;
            toggleDiffRange();
            if (hasDiff) {
                document.getElementById('range-from2').value = from2;
                document.getElementById('range-to2').value = to2;
            }

            // For a calendar URL, sync the dropdowns to the now-set year values.
            if (mode === 'calendar') populateCalendarYears();

            // Auto-run only when we have a complete, resolvable comparison.
            if (p1 && p2 && from && to && findPlayerName(p1) && findPlayerName(p2)) {
                setTimeout(() => compareRange(), 0);
            }
        }

        function compareRange() {
            if (!dataLoaded) return;

            const p1 = findPlayerName(document.getElementById('range-player1').value.trim());
            const p2 = findPlayerName(document.getElementById('range-player2').value.trim());
            if (!p1) { alert('Player 1 not found. Please select from suggestions.'); return; }
            if (!p2) { alert('Player 2 not found. Please select from suggestions.'); return; }
            if (p1 === p2) { alert('Please select two different players.'); return; }

            // Fetch the two players' rows first, then run this same function again.
            if (!isPlayerLoaded(p1) || !isPlayerLoaded(p2)) {
                const rd = document.getElementById('range-results');
                rd.innerHTML = '<div class="loading"><div class="spinner"></div><div>Comparing ranges…</div></div>';
                ensurePlayers([p1, p2]).then(() => compareRange()).catch(err => {
                    console.error('[ComparePlayers]', err);
                    rd.innerHTML = '';
                    showError("Couldn't load the player database. Try refreshing — if this keeps happening, the data might be updating right now.");
                });
                return;
            }

            document.getElementById('range-player1').value = p1;
            document.getElementById('range-player2').value = p2;

            const mode = document.getElementById('range-mode').value;
            const from1 = parseInt(document.getElementById('range-from').value, 10);
            const to1 = parseInt(document.getElementById('range-to').value, 10);

            const useDiff = document.getElementById('range-diff-p2').checked;
            const from2 = useDiff ? parseInt(document.getElementById('range-from2').value, 10) : from1;
            const to2 = useDiff ? parseInt(document.getElementById('range-to2').value, 10) : to1;

            if ([from1, to1, from2, to2].some(v => isNaN(v))) {
                alert('Please enter valid numbers for the range.'); return;
            }
            if (from1 > to1 || from2 > to2) {
                alert('"From" must be less than or equal to "To".'); return;
            }

            // Update URL + page title (requirement: shareable range URLs)
            updateRangeURL(p1, p2, mode, from1, to1, useDiff, from2, to2);

            const resultsDiv = document.getElementById('range-results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><div>Comparing ranges…</div></div>';

            setTimeout(() => {
                const results = performRangeComparison(p1, from1, to1, p2, from2, to2, mode);
                displayRangeResults(results, p1, p2, {
                    mode: mode, from1: from1, to1: to1, from2: from2, to2: to2
                });
            }, 50);
        }

        function displayRangeResults(results, p1, p2, meta) {
            const resultsDiv = document.getElementById('range-results');

            const summary = `Comparing ${playerNameLinks(p1)} ${rangeLabel(meta.mode, meta.from1, meta.to1)} ` +
                `(${yearSpan(results.years1)}) vs ${playerNameLinks(p2)} ${rangeLabel(meta.mode, meta.from2, meta.to2)} ` +
                `(${yearSpan(results.years2)})`;

            const renderedAny = Object.keys(results.categories).some(s => results.categories[s].length > 0);

            resultsDiv.innerHTML = `<div class="range-summary">${summary}</div><div class="filter-cmp-wrap"></div>`;

            if (renderedAny) {
                renderFilterableComparison(resultsDiv.querySelector('.filter-cmp-wrap'), results, p1, p2, { clickable: false });
            } else {
                resultsDiv.insertAdjacentHTML('beforeend', '<div class="range-summary" style="font-weight: 400;">No data found for the selected ranges.</div>');
            }
        }
    </script>
</body>
