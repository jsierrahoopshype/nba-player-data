<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Comparison Tool - HoopsHype</title>
    <meta name="description" content="Compare any two NBA players across 140+ categories including awards, stats, salaries, and more.">
    <script>
        // Speed: start the comparison data downloads immediately. Placed before the
        // render-blocking font stylesheet below, which otherwise holds up the main script
        // (and its downloads) until the stylesheet arrives. The main script takes these
        // responses with cmpTakeJSON() instead of downloading again.
        // playerSlug() must match slug() in scripts/build_player_files.py.
        function playerSlug(name) {
            let s = '';
            for (const c of String(name)) s += /^[A-Za-z0-9]$/.test(c) ? c.toLowerCase() : '_';
            return s.charAt(0) === '_' ? 'p' + s : s; // GitHub Pages skips files starting with '_'
        }
        var CMP_DATA_BASE_URL = 'https://jsierrahoopshype.github.io/nba-player-data/';
        var cmpPrefetched = {};
        // Resolves to { status, json } (json is null for a non-OK status); rejects on network error.
        // A server error (5xx) or a network error is retried once after a short pause: the
        // hoopsmatic.com Worker relays these files and its upstream can fail for a moment.
        function cmpFetchJSON(url, retried) {
            const again = () => new Promise(res => setTimeout(res, 700)).then(() => cmpFetchJSON(url, true));
            return fetch(url).then(r => {
                if (r.status >= 500 && !retried) return again();
                return r.ok ? r.json().then(j => ({ status: r.status, json: j })) : { status: r.status, json: null };
            }, err => { if (retried) throw err; return again(); });
        }
        function cmpTakeJSON(url) {
            const p = cmpPrefetched[url];
            if (p) { delete cmpPrefetched[url]; return p; }
            return cmpFetchJSON(url);
        }
        (function () {
            try {
                const urls = ['comparisons.json', 'players/index.json', 'allstars-data.json'].map(f => CMP_DATA_BASE_URL + f);
                const q = new URLSearchParams(location.search);
                ['p1', 'p2'].forEach(k => {
                    const v = q.get(k);
                    if (v) v.split(',').forEach(n => {
                        n = n.trim();
                        if (n) urls.push(CMP_DATA_BASE_URL + 'players/' + encodeURIComponent(playerSlug(n)) + '.json');
                    });
                });
                urls.forEach(u => {
                    if (!cmpPrefetched[u]) { cmpPrefetched[u] = cmpFetchJSON(u); cmpPrefetched[u].catch(() => {}); }
                });
            } catch (e) { /* best-effort: the main script fetches anything missing */ }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Look of HoopsMatic Head to Head (jsierrahoopshype/nba-head-to-head src/styles.css), its
           values reused: DM Sans + JetBrains Mono, the 115% root, the #f5f5f7 page / #fff surface /
           #f0f0f2 header row / #d1d1d6 border palette, #1d1d1f text and #6e6e73 secondary text,
           12px boxes / 10px inputs and buttons / 8px chips / 6px toggles, the .bh block header,
           the .scoreboard, the .vt three-column stat table (leader's cell on a light tint of his
           side's color), the .ph headshot disc on #f0f0f2, near-black buttons. Links are the text
           color, underlined on hover only. Mobile first. Class names and ids are the tool's own
           (the scripts and the hoopsmatic.com Worker rely on them). */
        :root {
            --bg: #f5f5f7; --surface: #fff; --surface-hover: #f0f0f2; --border: #d1d1d6;
            --text: #1d1d1f; --text-secondary: #6e6e73; --accent: #3b82f6; --accent-dim: rgba(59,130,246,.15);
            --green: #1d8a40; --green-dim: rgba(52,199,89,.16);
            --red: #d12c2c; --red-dim: rgba(239,68,68,.13);
            --a: #2563eb; --b: #c2410c; --ta: #e2ebfc; --tb: #f7e6dd;
            --mono: 'JetBrains Mono', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 115%; -webkit-text-size-adjust: 100%; }
        body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg);
            color: var(--text); min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        a { color: var(--text); text-decoration: none; }
        a:hover { text-decoration: underline; text-underline-offset: 2px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        .container { max-width: 860px; margin: 0 auto; padding: 1rem 1rem 3rem; }
        h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.25; margin-bottom: .35rem; overflow-wrap: anywhere; }
        .subtitle { color: var(--text-secondary); font-size: .9rem; margin-bottom: 1.1rem; max-width: 60rem; }

        .loading { text-align: center; padding: 2rem 1rem; color: var(--text-secondary); font-family: var(--mono); font-size: .8rem; }
        .spinner { border: 3px solid var(--border); border-top-color: var(--text); border-radius: 50%; width: 28px; height: 28px;
            animation: spin 1s linear infinite; margin: 0 auto .8rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Career / Range: Head to Head's segmented toggle */
        .tab-bar { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: .8rem; }
        .tab-button { font-family: var(--mono); font-size: .7rem; font-weight: 500; padding: .32rem .6rem; border: 1px solid var(--border);
            border-radius: 6px; background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: .12s; }
        .tab-button:hover { border-color: var(--text); color: var(--text); }
        .tab-button.active { background: var(--text); border-color: var(--text); color: #fff; font-weight: 600; }

        /* the two-player picker (Head to Head .qpick: one row, the input boxes, a near-black button) */
        .player-selector { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: .35rem; align-items: start; margin: .2rem 0 .7rem; }
        .player-select-card { min-width: 0; }
        .player-select-card h3, .select-group label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
        .select-group { min-width: 0; }
        .player-select-wrapper { position: relative; }
        .player-autocomplete { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 16px; padding: .55rem .6rem; border: 1px solid var(--border);
            border-radius: 10px; background: var(--surface); color: var(--text); outline: none; }
        .player-autocomplete:focus { border-color: var(--text); box-shadow: 0 0 0 3px rgba(29,29,31,.12); }
        .player-autocomplete::placeholder { color: var(--text-secondary); }
        /* suggestions: Head to Head's .sugg list, in the page flow under the box (never floating over it) */
        .autocomplete-suggestions { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-top: .3rem; overflow: hidden; }
        .autocomplete-suggestion { display: flex; align-items: center; padding: .45rem .7rem; cursor: pointer; font-size: .9rem; min-height: 2.8rem; line-height: 1.25; overflow-wrap: anywhere; }
        .autocomplete-suggestion + .autocomplete-suggestion { border-top: 1px solid var(--border); }
        .autocomplete-suggestion:hover { background: var(--surface-hover); }
        .vs-text { font-family: var(--mono); font-size: .66rem; font-weight: 600; color: var(--text-secondary); padding-top: .85rem; text-align: center; }
        .add-player-link { display: inline-block; margin-top: .4rem; font-family: var(--mono); font-size: .64rem; font-weight: 600; color: var(--text); cursor: pointer;
            text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; user-select: none; }
        .add-player-link:hover { text-decoration-color: var(--text); }
        .extra-player-row { position: relative; margin-top: .35rem; display: flex; align-items: flex-start; gap: .3rem; }
        .extra-player-row .player-select-wrapper { min-width: 0; }
        .remove-player-btn { flex: 0 0 auto; cursor: pointer; color: var(--text-secondary); font-size: 1.1rem; line-height: 1; padding: .6rem .2rem; user-select: none; }
        .remove-player-btn:hover { color: var(--red); }

        .compare-button { display: block; background: var(--text); color: #fff; border: none; border-radius: 10px; padding: .65rem 1.1rem; margin: 0 0 .8rem;
            font-family: var(--mono); font-weight: 600; font-size: .74rem; cursor: pointer; }
        .compare-button:hover { background: #3a3a3c; }
        .compare-button:disabled { background: var(--border); cursor: not-allowed; }

        /* loop controls: Head to Head's outlined .btn and its small select */
        .loop-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-bottom: 1rem; }
        .loop-button { font-family: var(--mono); font-weight: 600; font-size: .72rem; padding: .55rem .9rem; border: 1px solid var(--text); border-radius: 10px;
            background: var(--surface); color: var(--text); cursor: pointer; }
        .loop-button:hover { background: var(--surface-hover); }
        .loop-button.active { background: var(--text); color: #fff; }
        .loop-interval { font-family: var(--mono); font-size: .7rem; font-weight: 500; padding: .5rem .5rem; border: 1px solid var(--border); border-radius: 6px;
            background: var(--surface); color: var(--text); cursor: pointer; }
        .loop-stop-bar { margin: 0 0 .6rem; }
        .loop-stop-bar .loop-button { width: 100%; }

        /* faces: nba-headshots busts shown whole on a light grey #f0f0f2 circle; initials when there is no file */
        .ph, .f, .fm { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden;
            background: #f0f0f2; flex-shrink: 0; vertical-align: middle; font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: normal; color: #55555c; line-height: 1; }
        .ph { width: var(--s); height: var(--s); font-size: calc(var(--s) * .34); }
        .ph > img, .f > img, .fm > img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: contain; display: block; }
        a.ph:hover, a.f:hover, a.fm:hover { text-decoration: none; }
        .f { width: 24px; height: 24px; font-size: 9px; }
        .fm { width: 32px; height: 32px; font-size: 11px; }

        /* the score: Head to Head's .scoreboard */
        .score-summary { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,auto) minmax(0,1fr); align-items: center; gap: .4rem;
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem .8rem .9rem; margin: .2rem 0 1.4rem; }
        .player-score { display: flex; flex-direction: column; align-items: center; gap: .4rem; text-align: center; min-width: 0; }
        .player-score:first-child .ph { box-shadow: 0 0 0 3px var(--a); }
        .player-score:last-child .ph { box-shadow: 0 0 0 3px var(--b); }
        .sb-faces { display: flex; justify-content: center; flex-wrap: wrap; gap: .25rem; }
        .player-score:first-child .sb-faces .fm { box-shadow: 0 0 0 2px var(--a); }
        .player-score:last-child .sb-faces .fm { box-shadow: 0 0 0 2px var(--b); }
        .player-name-score { font-weight: 700; font-size: .84rem; line-height: 1.2; max-width: 100%; text-wrap: balance; }
        .sb-namerow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .3rem; min-width: 0; max-width: 100%; }
        .sb-shuffle { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0;
            border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; }
        .sb-shuffle:hover { border-color: var(--text); }
        /* touch screens: a 44px tap area (WCAG 2.5.5) with the button still small; the gap keeps it off the name link */
        @media (pointer: coarse) {
            .sb-namerow { gap: .5rem; }
            .sb-shuffle { position: relative; width: 34px; height: 34px; }
            .sb-shuffle::after { content: ""; position: absolute; inset: -5px; }
        }
        .sb-shuffle:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
        .sb-mid { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .sb-big { font-family: var(--mono); font-size: 1.75rem; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .score-value { display: inline-block; font-weight: 500; color: var(--text); border-radius: 8px; padding: 0 .2em; }
        .score-value.lead1 { background: var(--ta); font-weight: 800; }
        .score-value.lead2 { background: var(--tb); font-weight: 800; }
        .score-divider { font-style: normal; color: var(--text-secondary); margin: 0 .12rem; }

        /* sections: one strong header (Head to Head .bh), one box under it (.vt) */
        .category-section { margin-bottom: 1.6rem; min-width: 0; }
        .category-title { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; margin-bottom: .7rem; padding-bottom: .35rem; border-bottom: 2px solid var(--text); }
        .section-score { font-family: var(--mono); font-size: .68rem; font-weight: 500; color: var(--text-secondary); letter-spacing: 0; margin-top: .15rem; }
        .section-score a { color: var(--text); font-weight: 600; }
        .cmp-toggle-label { flex: 0 0 auto; display: inline-flex; align-items: center; cursor: pointer; }
        .cmp-toggle-label input { cursor: pointer; margin: 0; accent-color: var(--text); width: .85rem; height: .85rem; }
        .category-title .cmp-toggle-label { margin-right: .45rem; vertical-align: -1px; }
        .category-section.cmp-section-hidden .category-title { opacity: .5; }

        .cmp-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; font-size: .8rem; }
        .cmp-head, .comparison-row { display: grid; grid-template-columns: minmax(0,34fr) minmax(0,32fr) minmax(0,34fr); align-items: stretch; }
        /* the header row: two halves, the left player at the left, the right one at the right
           (Head to Head .cs-legend), so long names have room */
        .cmp-head { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
        .cmp-head > div:nth-child(2) { display: none; }
        .cmp-head > div:first-child { align-items: flex-start; text-align: left; }
        .cmp-head { background: var(--surface-hover); border-bottom: 1px solid var(--border); }
        .cmp-head > div { padding: .55rem .55rem; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; gap: .3rem; text-align: right; min-width: 0; }
        .cmp-head .player-name-cell { font-family: 'DM Sans', sans-serif; font-size: .72rem; font-weight: 700; color: var(--text); line-height: 1.3; max-width: 100%; text-wrap: balance; }
        .comparison-row { border-bottom: 1px solid var(--border); }
        .comparison-row:last-child { border-bottom: none; }
        .comparison-row > div { padding: .55rem .55rem; min-height: 2.6rem; display: flex; align-items: center; min-width: 0; line-height: 1.3; }
        .metric-name { overflow-wrap: break-word; }
        /* a name's words and a figure never break (see fitComparison) */
        .nb, .num { white-space: nowrap; }
        .num { font-variant-numeric: tabular-nums; }
        .player-value { justify-content: flex-end; text-align: right; font-family: var(--mono); font-weight: 500; font-size: .92rem; font-variant-numeric: tabular-nums; color: var(--text); }
        .comparison-row.winner-left .player-value.winner { background: var(--ta); font-weight: 700; }
        .comparison-row.winner-right .player-value.winner { background: var(--tb); font-weight: 700; }
        .metric-name { justify-content: center; text-align: center; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: .72rem; color: var(--text); }
        .no-data { color: var(--text-secondary); font-weight: 500; }

        /* more comparisons: Head to Head's chips */
        .suggestions-section { margin: 1.6rem 0 1rem; }
        .suggestions-section h3 { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; margin-bottom: .7rem; padding-bottom: .35rem; border-bottom: 2px solid var(--text); }
        .suggestion-chips { display: flex; flex-wrap: wrap; gap: .35rem; }
        .suggestion-btn { font-family: var(--mono); font-size: .68rem; font-weight: 600; padding: .34rem .7rem; border: 1px solid var(--border); border-radius: 8px;
            background: var(--surface); color: var(--text); cursor: pointer; text-align: left; }
        .suggestion-btn:hover { border-color: var(--text); }

        .error-message { background: var(--red-dim); color: var(--red); padding: .8rem .9rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid var(--red); font-size: .86rem; }

        /* Range Comparison */
        .range-controls { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .7rem; }
        .range-control-group { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
        .range-control-group label { font-size: .8rem; font-weight: 700; }
        .range-select, .range-number { font-family: 'DM Sans', sans-serif; font-size: 16px; padding: .5rem .6rem; border: 1px solid var(--border); border-radius: 10px;
            background: var(--surface); color: var(--text); outline: none; max-width: 100%; }
        .range-number { width: 7rem; }
        .range-select:focus, .range-number:focus { border-color: var(--text); box-shadow: 0 0 0 3px rgba(29,29,31,.12); }
        .range-diff-toggle { margin-bottom: .8rem; font-size: .8rem; color: var(--text-secondary); }
        .range-diff-toggle label { cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; }
        .range-diff-toggle input { accent-color: var(--text); }
        .range-summary { font-size: .86rem; font-weight: 600; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: .7rem .8rem; margin-bottom: 1rem; }

        /* phones: faces and score on one row, the names on the row under them, each name
           with half the box (left player left-aligned, right player right-aligned, as Head to
           Head's .cs-legend), so long surnames fit whole */
        @media (max-width: 480px) {
            .score-summary { grid-template-columns: repeat(4, minmax(0,1fr)); row-gap: .55rem; column-gap: .3rem; }
            .score-summary > .player-score { display: contents; }
            .score-summary > .player-score:first-child > :first-child { grid-column: 1; grid-row: 1; justify-self: start; }
            .score-summary > .sb-mid { grid-column: 2 / span 2; grid-row: 1; }
            .score-summary > .player-score:last-child > :first-child { grid-column: 4; grid-row: 1; justify-self: end; }
            .score-summary > .player-score:first-child > .sb-namerow { grid-column: 1 / span 2; grid-row: 2; justify-content: flex-start; text-align: left; }
            .score-summary > .player-score:last-child > .sb-namerow { grid-column: 3 / span 2; grid-row: 2; justify-content: flex-end; text-align: right; }
            .score-summary > .player-score:first-child .sb-faces { justify-content: flex-start; }
            .score-summary > .player-score:last-child .sb-faces { justify-content: flex-end; }
        }
        /* small phones: a smaller score and faces so each name column keeps whole words */
        @media (max-width: 420px) {
            .cmp-head .player-name-cell { font-size: .64rem; }
            .cmp-head > div { padding: .5rem .45rem; }
        }
        @media (max-width: 360px) {
            .score-summary { padding: .9rem .5rem .8rem; gap: .25rem; }
            .sb-big { font-size: 1.3rem; }
            .score-summary .ph { --s: 56px !important; }
            .player-name-score { font-size: .76rem; }
        }
        /* (mouse only: on touch screens the button keeps its 44px tap area) */
        @media (max-width: 360px) and (pointer: fine) {
            .sb-shuffle { width: 26px; height: 26px; }
        }
        @media (min-width: 640px) {
            .player-name-score { font-size: .95rem; }
            .vs-text { padding-top: .9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NBA Player Comparison Tool</h1>
        <div class="subtitle">Compare any two NBA players across 140+ categories</div>

        <div id="loadingMessage" class="loading">
            <div class="spinner"></div>
            <div>Loading player database…</div>
        </div>

        <div id="mainContent" style="display: none;">
            <!-- ===== Tab switcher (new, additive) ===== -->
            <div class="tab-bar">
                <button class="tab-button active" id="tab-career" onclick="switchTab('career')">Career Comparison</button>
                <button class="tab-button" id="tab-range" onclick="switchTab('range')">Range Comparison</button>
            </div>

            <!-- ===== Career Comparison panel (existing UI, unchanged) ===== -->
            <div id="careerPanel">
            <!-- Player selector at top -->
            <div class="player-selector">
                <div class="player-select-card">
                    <h3>Player 1</h3>
                    <div class="select-group">
                        <label>Player Name</label>
                        <div class="player-select-wrapper">
                            <input type="text" id="player1-top" class="player-autocomplete" placeholder="Type player name...">
                            <div id="suggestions1-top" class="autocomplete-suggestions"></div>
                        </div>
                        <div id="extra-players-1" class="extra-players"></div>
                        <span class="add-player-link" onclick="addPlayerInput(1)">+ Add player (combine)</span>
                    </div>
                </div>
                <div class="vs-text">VS</div>
                <div class="player-select-card">
                    <h3>Player 2</h3>
                    <div class="select-group">
                        <label>Player Name</label>
                        <div class="player-select-wrapper">
                            <input type="text" id="player2-top" class="player-autocomplete" placeholder="Type player name...">
                            <div id="suggestions2-top" class="autocomplete-suggestions"></div>
                        </div>
                        <div id="extra-players-2" class="extra-players"></div>
                        <span class="add-player-link" onclick="addPlayerInput(2)">+ Add player (combine)</span>
                    </div>
                </div>
            </div>

            <button class="compare-button" onclick="runComparison()" id="compareBtn">
                Compare Players
            </button>

            <div class="loop-controls">
                <button class="loop-button" id="loopBtn" onclick="toggleLoop()">Start Comparison Loop</button>
                <select id="scrollDuration" class="loop-interval" title="Scroll speed">
                    <option value="15">15s scroll</option>
                    <option value="30" selected>30s scroll</option>
                    <option value="45">45s scroll</option>
                </select>
                <select id="stickyPlayer" class="loop-interval">
                    <option value="none">Randomize Both</option>
                    <option value="p1" id="stickyP1Option">Keep Player 1</option>
                    <option value="p2" id="stickyP2Option">Keep Player 2</option>
                </select>
            </div>
            
            <div id="results"></div>
            
            <!-- Player selector at bottom -->
            <div class="player-selector" style="margin-top: 1.6rem;">
                <div class="player-select-card">
                    <h3>Player 1</h3>
                    <div class="select-group">
                        <label>Player Name</label>
                        <div class="player-select-wrapper">
                            <input type="text" id="player1-bottom" class="player-autocomplete" placeholder="Type player name...">
                            <div id="suggestions1-bottom" class="autocomplete-suggestions"></div>

                    </div>
                    <div class="range-control-group">
                        <label id="range-to2-label">Player 2 To (season #)</label>
                        <input type="number" id="range-to2" class="range-number" min="1" value="5">
                        <select id="range-to2-cal" class="range-select" style="display: none;" onchange="onCalSelectChange()"></select>
