        // ==========================================
        // LOOP MODE — matches Season Comparison Tool
        // ==========================================
        let loopActive = false;
        let usedOpponents = new Set();
        let scrollAnimationId = null;

        function updateStickyPlayerOptions() {
            const p1Name = document.getElementById('player1-top').value || 'Player 1';
            const p2Name = document.getElementById('player2-top').value || 'Player 2';
            
            document.getElementById('stickyP1Option').textContent = `Keep ${p1Name}`;
            document.getElementById('stickyP2Option').textContent = `Keep ${p2Name}`;
        }

        function getRandomOpponent(excludePlayers) {
            if (!playerData.allStarsData || !playerData.allStarsData.allStars1990Plus) return null;
            
            // Filter to only All-Stars that exist in our players array (from rsStats)
            const allStars = playerData.allStarsData.allStars1990Plus.filter(name => 
                players.includes(name)
            );
            
            if (allStars.length === 0) return null;
            
            const available = allStars.filter(p => 
                !excludePlayers.includes(p) && !usedOpponents.has(p)
            );
            
            // If we've used all opponents, reset the used list
            if (available.length === 0) {
                usedOpponents.clear();
                const freshAvailable = allStars.filter(p => !excludePlayers.includes(p));
                if (freshAvailable.length === 0) return null;
                const pick = freshAvailable[Math.floor(Math.random() * freshAvailable.length)];
                usedOpponents.add(pick);
                return pick;
            }
            
            const pick = available[Math.floor(Math.random() * available.length)];
            usedOpponents.add(pick);
            return pick;
        }

        function smoothScrollToBottom(durationMs) {
            // Cancel any existing scroll animation
            if (scrollAnimationId) {
                cancelAnimationFrame(scrollAnimationId);
            }
            
            // Start from the top of the page
            const startY = 0;
            window.scrollTo(0, startY);
            
            const targetY = document.documentElement.scrollHeight - window.innerHeight;
            const distance = targetY - startY;
            
            // If no scrolling needed (page fits in viewport), wait then trigger next comparison
            if (distance <= 0) {
                setTimeout(() => {
                    if (loopActive) runLoopComparison();
                }, 3000);
                return;
            }
            
            const startTime = performance.now();
            
            function animateScroll(currentTime) {
                if (!loopActive) return;
                
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / durationMs, 1);
                
                // Linear scrolling - constant speed
                window.scrollTo(0, startY + (distance * progress));
                
                if (progress < 1) {
                    scrollAnimationId = requestAnimationFrame(animateScroll);
                } else {
                    // Scroll finished - trigger next comparison after 1.5 seconds
                    setTimeout(() => {
                        if (loopActive) runLoopComparison();
                    }, 1500);
                }
            }
            
            scrollAnimationId = requestAnimationFrame(animateScroll);
        }

        function startLoop() {
            const loopBtn = document.getElementById('loopBtn');
            const loopBtnBottom = document.getElementById('loopBtnBottom');
            const scrollSelect = document.getElementById('scrollDuration');
            const stickySelect = document.getElementById('stickyPlayer');
            
            loopActive = true;
            loopBtn.textContent = 'Stop Comparison Loop';
            loopBtn.classList.add('active');
            if (loopBtnBottom) {
                loopBtnBottom.textContent = 'Stop Comparison Loop';
                loopBtnBottom.classList.add('active');
            }
            const floatBtn = document.getElementById('loopStopFloat');
            if (floatBtn) floatBtn.classList.add('visible');
            scrollSelect.disabled = true;
            stickySelect.disabled = true;
            usedOpponents.clear();
            
            // Update sticky player labels
            updateStickyPlayerOptions();
            
            // Run first comparison immediately (scroll callback will trigger next)
            runLoopComparison();
        }

        function stopLoop() {
            const loopBtn = document.getElementById('loopBtn');
            const loopBtnBottom = document.getElementById('loopBtnBottom');
            const scrollSelect = document.getElementById('scrollDuration');
            const stickySelect = document.getElementById('stickyPlayer');
            
            loopActive = false;
            loopBtn.textContent = 'Start Comparison Loop';
            loopBtn.classList.remove('active');
            if (loopBtnBottom) {
                loopBtnBottom.textContent = 'Start Comparison Loop';
                loopBtnBottom.classList.remove('active');
            }
            const floatBtn = document.getElementById('loopStopFloat');
            if (floatBtn) floatBtn.classList.remove('visible');
            scrollSelect.disabled = false;
            stickySelect.disabled = false;
            
            if (scrollAnimationId) {
                cancelAnimationFrame(scrollAnimationId);
                scrollAnimationId = null;
            }
        }

        function toggleLoop() {
            if (loopActive) {
                stopLoop();
            } else {
                startLoop();
            }
        }

        function runLoopComparison() {
            const stickyMode = document.getElementById('stickyPlayer').value;
            const scrollDuration = parseInt(document.getElementById('scrollDuration').value) * 1000;
            const currentP1 = document.getElementById('player1-top').value;
            const currentP2 = document.getElementById('player2-top').value;
            
            if (stickyMode === 'p1') {
                // Keep Player 1, randomize Player 2
                const newOpponent = getRandomOpponent([currentP1]);
                if (!newOpponent) return;
                
                document.getElementById('player2-top').value = newOpponent;
                document.getElementById('player2-bottom').value = newOpponent;
                
            } else if (stickyMode === 'p2') {
                // Keep Player 2, randomize Player 1
                const newOpponent = getRandomOpponent([currentP2]);
                if (!newOpponent) return;
                
                document.getElementById('player1-top').value = newOpponent;
                document.getElementById('player1-bottom').value = newOpponent;
                
            } else {
                // Randomize both players - use All-Stars that exist in our dataset
                let allStars = [];
                if (playerData.allStarsData && playerData.allStarsData.allStars1990Plus) {
                    allStars = playerData.allStarsData.allStars1990Plus.filter(name => 
                        players.includes(name)
                    );
                }
                
                // Fallback: if no All-Stars available, pick from top of players list
                if (allStars.length < 2) {
                    allStars = players.slice(0, 100);
                }
                
                if (allStars.length < 2) return;
                
                const idx1 = Math.floor(Math.random() * allStars.length);
                let idx2 = Math.floor(Math.random() * allStars.length);
                while (idx2 === idx1) idx2 = Math.floor(Math.random() * allStars.length);
                
                document.getElementById('player1-top').value = allStars[idx1];
                document.getElementById('player2-top').value = allStars[idx2];
                document.getElementById('player1-bottom').value = allStars[idx1];
                document.getElementById('player2-bottom').value = allStars[idx2];
            }
            
            compareFromInputs();
            
            // Start smooth scroll after brief delay for content to render
            setTimeout(() => {
                if (loopActive) {
                    smoothScrollToBottom(scrollDuration);
                }
            }, 1500);
        }

        function loadComparison(p1, p2) {
            document.getElementById('player1-top').value = p1;
            document.getElementById('player2-top').value = p2;
            document.getElementById('player1-bottom').value = p1;
            document.getElementById('player2-bottom').value = p2;
            compareFromInputs();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // RANGE COMPARISON (new, additive)
        // Compares two players over a slice of their careers (a season range
        // or an age range). It reuses the existing performComparison() engine
        // by temporarily injecting year-filtered copies of the data arrays,
        // then restoring them. No existing career-comparison code is modified.
        // ==========================================

        let rangeAutocompleteReady = false;

        // Sections shown in the range comparison. Order is taken from
        // comparisons.json; everything else (Draft Combine, Signature Shoes,
        // All-Star contests, Best Vote Ranking) is excluded.
        const RANGE_SECTIONS = new Set([
            'ACCOLADES', 'NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK',
            'PLAYOFF SUCCESS', 'BEST AWARDS RANKING', 'YEARS RECEIVING VOTES', 'SALARIES', 'NBA 2K'
        ]);

        function switchTab(tab) {

            const rangePanel = document.getElementById('rangePanel');
            const tabCareer = document.getElementById('tab-career');

                if (!rangeAutocompleteReady && dataLoaded) {
                    setupRangeAutocomplete();
                    rangeAutocompleteReady = true;
                }
                // Convenience: prefill from the career inputs if the range inputs are empty
                const rp1 = document.getElementById('range-player1');
                const rp2 = document.getElementById('range-player2');
                if (!rp1.value) rp1.value = document.getElementById('player1-top').value || '';
                if (!rp2.value) rp2.value = document.getElementById('player2-top').value || '';
            } else {

                careerPanel.style.display = 'block';

        function updateRangeLabels() {
            const mode = document.getElementById('range-mode').value;
            const unit = mode === 'age' ? 'age' : (mode === 'calendar' ? 'year' : 'season #');
            document.getElementById('range-from-label').textContent = 'From (' + unit + ')';
            document.getElementById('range-to-label').textContent = 'To (' + unit + ')';
            document.getElementById('range-from2-label').textContent = 'Player 2 From (' + unit + ')';

        }

        function toggleDiffRange() {
            const checked = document.getElementById('range-diff-p2').checked;
            document.getElementById('range-p2-fields').style.display = checked ? 'flex' : 'none';
        }

        function setupRangeAutocomplete() {
            const configs = [
                { input: 'range-player1', suggestions: 'range-suggestions1' },
                { input: 'range-player2', suggestions: 'range-suggestions2' }
            ];
            configs.forEach(config => {
                const inputEl = document.getElementById(config.input);
                const suggestionsEl = document.getElementById(config.suggestions);

                inputEl.addEventListener('input', function() {
                    const value = this.value.toLowerCase();
                    if (value.length < 2) { suggestionsEl.style.display = 'none'; return; }

                    const normalizedValue = normalizePlayerName(value);
                    const matches = players.filter(p =>
                        p.toLowerCase().includes(value) ||
                        normalizePlayerName(p).includes(normalizedValue)
                    ).slice(0, 10);

                    if (matches.length === 0) { suggestionsEl.style.display = 'none'; return; }

                    suggestionsEl.innerHTML = matches.map(player =>
                        `<div class="autocomplete-suggestion" data-player="${player}">${player}</div>`
                    ).join('');
                    suggestionsEl.style.display = 'block';

                    suggestionsEl.querySelectorAll('.autocomplete-suggestion').forEach(el => {
                        el.addEventListener('click', function() {
                            inputEl.value = this.getAttribute('data-player');
                            suggestionsEl.style.display = 'none';
                        });
                    });
                });

                document.addEventListener('click', function(e) {
                    if (!inputEl.contains(e.target) && !suggestionsEl.contains(e.target)) {
                        suggestionsEl.style.display = 'none';
                    }
                });

        }

        // --- Bio / age helpers ---
        function getBioRecord(playerName) {
            if (!playerData.bio) return null;
            return playerData.bio.find(r => r.PLAYER === playerName) || null;
        }

        function parseBirthday(str) {
            if (!str) return null;
            const parts = String(str).split('/');
            if (parts.length !== 3) return null;
            const month = parseInt(parts[0], 10);
            const day = parseInt(parts[1], 10);
            const year = parseInt(parts[2], 10);
            if (isNaN(month) || isNaN(day) || isNaN(year)) return null;
            return { month, day, year };
        }

        function ageAsOfFeb1(bd, seasonYear) {
            // Age on February 1 of the season's ending year.
            let age = seasonYear - bd.year;
            if (bd.month > 2 || (bd.month === 2 && bd.day > 1)) age -= 1;
            return age;
        }

        // Returns a Set of calendar years (ints) covered by the chosen
        // season/age range for this player, derived from their RS seasons.
        function computeInRangeYears(playerName, fromVal, toVal, mode) {
            const inRange = new Set();

            // Calendar Range: the year itself is the filter — return every year
            // from..to inclusive (no season-number or age math, player-independent).
            if (mode === 'calendar') {
                for (let y = fromVal; y <= toVal; y++) inRange.add(y);
                return inRange;
            }

            const rawRows = playerData.rsStats.filter(r => r.PLAYER === playerName);
            if (rawRows.length === 0) return inRange;

            const dedup = deduplicateSeasonRows(rawRows);
            const years = [...new Set(dedup.map(r => parseInt(r.YEAR, 10)).filter(y => !isNaN(y)))]
                .sort((a, b) => a - b);

            if (mode === 'age') {
                const bioRec = getBioRecord(playerName);
                const bd = parseBirthday(bioRec && bioRec.BIRTHDAY);
                if (!bd) return inRange;
                years.forEach(y => {
                    const age = ageAsOfFeb1(bd, y);
                    if (age >= fromVal && age <= toVal) inRange.add(y);
                });
            } else {
                years.forEach((y, idx) => {
                    const seasonNum = idx + 1; // Season 1 = earliest year
                    if (seasonNum >= fromVal && seasonNum <= toVal) inRange.add(y);
                });
            }
            return inRange;
        }

        // Wrapper helpers requested by spec: return only the in-range rows.
        function getFilteredRsStats(playerName, fromVal, toVal, mode) {
            const years = computeInRangeYears(playerName, fromVal, toVal, mode);
            return playerData.rsStats.filter(r =>
                r.PLAYER === playerName && years.has(parseInt(r.YEAR, 10)));
        }

        function getFilteredPoStats(playerName, fromVal, toVal, mode) {
            const years = computeInRangeYears(playerName, fromVal, toVal, mode);
            return playerData.poStats.filter(r =>
                r.PLAYER === playerName && years.has(parseInt(r.YEAR, 10)));
        }

        // Build a comparisons list containing only the allowed sections (in order),
        // dropping All-Star contest rows that live inside ACCOLADES.
        function buildRangeComparisons() {
            const out = [];
            let include = false;
            playerData.comparisons.forEach(comp => {
                const cat = comp['Comparison points'];
                const isHeader = !comp['Who wins?'] && !comp['Wheres the data?'];
                if (isHeader) {
                    include = RANGE_SECTIONS.has(cat);
                    if (include) out.push(comp);
                } else if (include) {
                    if (comp['Wheres the data?'] === 'All-Star.csv') return; // excluded contests
                    out.push(comp);
                }
            });
            return out;
        }

        // Make a shallow copy of a player's NBA 2K row with out-of-range editions blanked.
        function build2KCloneForRange(playerName, years) {
            const row = playerData.nba2k.find(r =>
                r['Full Name'] === playerName ||
                (r['First Name'] + ' ' + r['Last Name']) === playerName);
            if (!row) return null;
            const clone = { ...row };
            Object.keys(clone).forEach(key => {
                if (key.startsWith('2K') || key.startsWith('2k')) {
                    const yy = parseInt(key.substring(2), 10);
                    if (isNaN(yy)) return;
                    const editionYear = 2000 + yy; // 2K16 -> 2016
                    if (!years.has(editionYear)) clone[key] = '';
                }
            });
            return clone;
        }

        // Run the standard comparison engine against year-filtered data.
        function performRangeComparison(p1, from1, to1, p2, from2, to2, mode) {
            const years1 = computeInRangeYears(p1, from1, to1, mode);
            const years2 = computeInRangeYears(p2, from2, to2, mode);

            // Combined filtered datasets (each player keyed by name inside performComparison).
            const filteredRs = getFilteredRsStats(p1, from1, to1, mode)
                .concat(getFilteredRsStats(p2, from2, to2, mode));
            const filteredPo = getFilteredPoStats(p1, from1, to1, mode)
                .concat(getFilteredPoStats(p2, from2, to2, mode));
            const filteredAwards = playerData.awards.filter(r => {
                const n = r['PLAYER / COACH'];
                return (n === p1 && years1.has(parseInt(r.YEAR, 10))) ||
                       (n === p2 && years2.has(parseInt(r.YEAR, 10)));
            });
            const filteredVotes = playerData.awardVotes.filter(r =>
                (r.PLAYER === p1 && years1.has(parseInt(r.YEAR, 10))) ||
                (r.PLAYER === p2 && years2.has(parseInt(r.YEAR, 10))));
            const filteredSalaries = playerData.salaries.filter(r =>
                (r.PLAYER === p1 && years1.has(parseInt(r.YEAR, 10))) ||
                (r.PLAYER === p2 && years2.has(parseInt(r.YEAR, 10))));
            const filtered2K = [];
            const c1 = build2KCloneForRange(p1, years1); if (c1) filtered2K.push(c1);
            const c2 = build2KCloneForRange(p2, years2); if (c2) filtered2K.push(c2);

            const rangeComparisons = buildRangeComparisons();

            // Swap in the filtered data, run the existing engine, then restore.
            const orig = {
                rsStats: playerData.rsStats, poStats: playerData.poStats,
                awards: playerData.awards, awardVotes: playerData.awardVotes,
                salaries: playerData.salaries, nba2k: playerData.nba2k,
                comparisons: playerData.comparisons
            };

            let results;
            try {
                playerData.rsStats = filteredRs;
                playerData.poStats = filteredPo;
                playerData.awards = filteredAwards;
                playerData.awardVotes = filteredVotes;
                playerData.salaries = filteredSalaries;
                playerData.nba2k = filtered2K;
                playerData.comparisons = rangeComparisons;
                results = performComparison(p1, p2);
            } finally {
                Object.assign(playerData, orig);
            }

            results.years1 = years1;
            results.years2 = years2;
            return results;
        }

        function rangeLabel(mode, fromVal, toVal) {
            // Calendar mode: no prefix — the (year-span) shown next to it is the range itself,
            // so the summary reads "[Player] (2018-2026)".
            if (mode === 'calendar') return '';
            return (mode === 'age' ? 'Ages ' : 'Seasons ') + fromVal + '-' + toVal;
        }

        function yearSpan(yearSet) {
            const arr = [...yearSet].sort((a, b) => a - b);
            if (arr.length === 0) return 'no seasons';
            return arr[0] + '-' + arr[arr.length - 1];
        }

        // Build the dynamic page title for a range comparison.
        // Same range for both players  -> "P1 vs P2 — Seasons X-Y Comparison"
        // Different ranges per player -> "P1 (Seasons X-Y) vs P2 (Seasons Z-W) Comparison"
        function rangeTitle(p1, p2, mode, from1, to1, from2, to2) {
            if (mode === 'calendar') {
                if (from1 !== from2 || to1 !== to2) {
                    return `${p1} (${from1}-${to1}) vs ${p2} (${from2}-${to2}) Comparison`;
                }
                return `${p1} vs ${p2} — ${from1}-${to1} Comparison`;
            }
            const unit = mode === 'age' ? 'Ages' : 'Seasons';
            if (from1 !== from2 || to1 !== to2) {
                return `${p1} (${unit} ${from1}-${to1}) vs ${p2} (${unit} ${from2}-${to2}) Comparison`;
            }
            return `${p1} vs ${p2} — ${unit} ${from1}-${to1} Comparison`;
        }

        // Push the current range comparison into the URL (history.pushState) and title.
        // mode is the internal value ('season' | 'age'); the URL uses 'seasons' | 'ages'.
        function updateRangeURL(p1, p2, mode, from1, to1, useDiff, from2, to2) {
            const url = new URL(window.location);
            url.searchParams.set('p1', p1);
            url.searchParams.set('p2', p2);
            url.searchParams.set('mode', mode === 'age' ? 'ages' : (mode === 'calendar' ? 'calendar' : 'seasons'));
            url.searchParams.set('from', from1);
            url.searchParams.set('to', to1);
            if (useDiff) {
                url.searchParams.set('from2', from2);
                url.searchParams.set('to2', to2);
            } else {
                url.searchParams.delete('from2');
                url.searchParams.delete('to2');
            }
            window.history.pushState({}, '', url);
            document.title = rangeTitle(p1, p2, mode, from1, to1, from2, to2);
        }

        // Populate the Range tab from URL params and auto-run (called on page load
        // when a valid `mode` param is present). urlParams is a URLSearchParams.
        function initRangeFromURL(urlParams) {
            const urlMode = urlParams.get('mode');
            const mode = urlMode === 'ages' ? 'age' : (urlMode === 'calendar' ? 'calendar' : 'season');
            const p1 = urlParams.get('p1');
            const p2 = urlParams.get('p2');
            const from = urlParams.get('from');
            const to = urlParams.get('to');
            const from2 = urlParams.get('from2');
            const to2 = urlParams.get('to2');

            // Switch to the Range tab (also wires up range autocomplete).
            switchTab('range');

            if (p1) document.getElementById('range-player1').value = p1;
            if (p2) document.getElementById('range-player2').value = p2;
            document.getElementById('range-mode').value = mode;
            updateRangeLabels();
            if (from !== null && from !== '') document.getElementById('range-from').value = from;
            if (to !== null && to !== '') document.getElementById('range-to').value = to;

            const hasDiff = from2 !== null && from2 !== '' && to2 !== null && to2 !== '';
            document.getElementById('range-diff-p2').checked = hasDiff;
            toggleDiffRange();
            if (hasDiff) {
                document.getElementById('range-from2').value = from2;
                document.getElementById('range-to2').value = to2;
            }

            // Auto-run only when we have a complete, resolvable comparison.
            if (p1 && p2 && from && to && findPlayerName(p1) && findPlayerName(p2)) {
                setTimeout(() => compareRange(), 500);
            }
        }

        function compareRange() {
            if (!dataLoaded) return;

            const p1 = findPlayerName(document.getElementById('range-player1').value.trim());
            const p2 = findPlayerName(document.getElementById('range-player2').value.trim());
            if (!p1) { alert('Player 1 not found. Please select from suggestions.'); return; }
            if (!p2) { alert('Player 2 not found. Please select from suggestions.'); return; }
            if (p1 === p2) { alert('Please select two different players.'); return; }

            document.getElementById('range-player1').value = p1;
            document.getElementById('range-player2').value = p2;

            const mode = document.getElementById('range-mode').value;
            const from1 = parseInt(document.getElementById('range-from').value, 10);
            const to1 = parseInt(document.getElementById('range-to').value, 10);

            const useDiff = document.getElementById('range-diff-p2').checked;
            const from2 = useDiff ? parseInt(document.getElementById('range-from2').value, 10) : from1;
            const to2 = useDiff ? parseInt(document.getElementById('range-to2').value, 10) : to1;

            if ([from1, to1, from2, to2].some(v => isNaN(v))) {
                alert('Please enter valid numbers for the range.'); return;
            }
            if (from1 > to1 || from2 > to2) {
                alert('"From" must be less than or equal to "To".'); return;
            }

            // Update URL + page title (requirement: shareable range URLs)
            updateRangeURL(p1, p2, mode, from1, to1, useDiff, from2, to2);

            const resultsDiv = document.getElementById('range-results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><div>Comparing ranges…</div></div>';

            setTimeout(() => {
                const results = performRangeComparison(p1, from1, to1, p2, from2, to2, mode);
                displayRangeResults(results, p1, p2, {
                    mode: mode, from1: from1, to1: to1, from2: from2, to2: to2
                });
            }, 50);
        }

        function displayRangeResults(results, p1, p2, meta) {
            const resultsDiv = document.getElementById('range-results');

            const summary = `Comparing ${p1} ${rangeLabel(meta.mode, meta.from1, meta.to1)} ` +
                `(${yearSpan(results.years1)}) vs ${p2} ${rangeLabel(meta.mode, meta.from2, meta.to2)} ` +
                `(${yearSpan(results.years2)})`;

            let html = `<div class="range-summary">${summary}</div>`;

            html += `
                <div class="score-summary">
                    <div class="player-score">
                        <div class="player-name-score">${p1}</div>
                        <div class="score-value">${results.player1Score}</div>
                    </div>
                    <div class="score-divider">–</div>
                    <div class="player-score">
                        <div class="player-name-score">${p2}</div>
                        <div class="score-value">${results.player2Score}</div>
                    </div>
                </div>
            `;

            let renderedAny = false;
            Object.keys(results.categories).forEach(categoryName => {
                const items = results.categories[categoryName];
                if (items.length === 0) return;
                renderedAny = true;

                const sectionScore = results.sectionScores[categoryName];
                const showScore = sectionScore && (sectionScore.player1 > 0 || sectionScore.player2 > 0);
                const sectionScoreHTML = showScore ?
                    `<div class="section-score">${p1} ${sectionScore.player1} – ${p2} ${sectionScore.player2}</div>` : '';

                html += `<div class="category-section">
                    <div class="category-title">${categoryName}${sectionScoreHTML}</div>`;

                items.forEach(item => {
                    const rowClass = item.winner === 'player1' ? 'winner-left' :
                                    item.winner === 'player2' ? 'winner-right' : 'tie';
                    const p1Class = item.winner === 'player1' ? 'player-value winner' : 'player-value';
                    const p2Class = item.winner === 'player2' ? 'player-value winner' : 'player-value';
                    const p1Display = item.player1Value !== null ? item.player1Value : '<span class="no-data">–</span>';
                    const p2Display = item.player2Value !== null ? item.player2Value : '<span class="no-data">–</span>';

                    html += `
                        <div class="comparison-row ${rowClass}">
                            <div class="${p1Class}">${p1Display}</div>
                            <div class="player-value player-name-cell" style="font-weight: normal; font-size: 16px;">${p1}</div>
                            <div class="metric-name">${item.metric}</div>
                            <div class="player-value player-name-cell" style="font-weight: normal; font-size: 16px;">${p2}</div>
                            <div class="${p2Class}">${p2Display}</div>
                        </div>
                    `;
                });

                html += `</div>`;
            });

            if (!renderedAny) {
                html += `<div class="range-summary" style="font-weight: 400;">No data found for the selected ranges.</div>`;
            }

            resultsDiv.innerHTML = html;
        }
    </script>
    <button class="loop-stop-floating" id="loopStopFloat" onclick="toggleLoop()">⏹ Stop Loop</button>
</body>
</html>
