            'Rebounds per game': 'RPG',
            'Rebounds per game PO': 'RPG (PO)',
            'Assists per game': 'APG',
            'Assists per game PO': 'APG (PO)',
            'All-NBA Selections': 'All-NBA',
            'All-NBA First Team': 'All-NBA 1st',
            'All-NBA 1st Team': 'All-NBA 1st',
            'All-Defensive Team Selections': 'All-Defense',
            'All-Defensive First Team': 'All-Def 1st',
            'All-Defense 1st Team': 'All-Def 1st',
            'World Cup Medals': 'World Cup',
            'Scoring Leader': 'Scoring Title',
            'Rebounding Leader': 'Reb. Leader',
            'Assists Leader': 'Ast. Leader'
        };

        function labelFor(metric) {
            // First apply DISPLAY_LABELS, then ABBREV_LABELS
            var display = DISPLAY_LABELS[metric] || metric;
            return ABBREV_LABELS[display] || ABBREV_LABELS[metric] || display;
        }

        // Sections excluded from biggest wins (voting ranks, not actual awards)
        var EXCLUDED_WIN_SECTIONS = ['BEST AWARDS RANKING', 'BEST VOTE RANKING', 'YEARS RECEIVING VOTES'];

        function getTopWins(whichPlayer, compData) {
            var wins = [];
            var globalIndex = 0;
            compData.sections.forEach(function(section) {
                var skipSection = EXCLUDED_WIN_SECTIONS.indexOf(section.name) >= 0;
                section.items.forEach(function(item) {
                    if (!skipSection && item.winner === whichPlayer) {
                        var prioIdx = WIN_PRIORITY.indexOf(item.metric);
                        var sortKey = prioIdx >= 0 ? prioIdx : WIN_PRIORITY.length + globalIndex;
                        wins.push({
                            metric: item.metric,
                            p1Value: item.p1Value,
                            p2Value: item.p2Value,
                            sortKey: sortKey
                        });
                    }
                    globalIndex++;
                });
            });

            wins.sort(function(a, b) { return a.sortKey - b.sortKey; });

            // Deduplicate by metric name (keep first occurrence)
            var seen = {};
            var deduped = [];
            for (var i = 0; i < wins.length; i++) {
                if (!seen[wins[i].metric]) {
                    seen[wins[i].metric] = true;
                    deduped.push(wins[i]);
                }
            }

            return deduped.slice(0, 10);
        }

        function formatWinLabel(metric) {
            return DISPLAY_LABELS[metric] || metric;
        }

        // Normalize a stat value: null / '-' / '–' → '0', otherwise keep as-is
        function valOrZero(v) {
            if (v === null || v === undefined || v === '-' || v === '\u2013' || v === '') return '0';
            return String(v);
        }

        function drawFinalScreen(ctx, data, width, height, fadeProgress) {
            var S = width / 1280;
            var isSquare = Math.abs(width - height) < 50;
            var maxLines = isSquare ? 12 : 10;

            // Layout percentages (of height)
            var L = isSquare
                ? { title: 0.06, names: 0.14, scores: 0.22, banner: 0.33, winsTop: 0.38, winsBot: 0.96 }
                : { title: 0.05, names: 0.12, scores: 0.22, banner: 0.33, winsTop: 0.40, winsBot: 0.93 };

            // Carbon fiber background
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (var gx = 0; gx < width; gx += 4) {
                ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, height); ctx.stroke();
            }
            for (var gy = 0; gy < height; gy += 4) {
                ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(width, gy); ctx.stroke();
            }

            // Top red accent bar
            ctx.fillStyle = '#e31837';
            ctx.fillRect(0, 0, width, Math.round(6 * S));

            ctx.globalAlpha = Math.min(1, fadeProgress * 2);

            // "FINAL SCORE" heading — wide letter-spacing
            var titleSize = Math.round(42 * S * FS);
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 ' + titleSize + 'px ' + FF_HEAD;
            ctx.textAlign = 'center';
            var titleStr = 'FINAL SCORE';
            var spacing = Math.round(8 * S);
            var titleTotalW = 0;
            for (var ci = 0; ci < titleStr.length; ci++) {
                titleTotalW += ctx.measureText(titleStr[ci]).width + (ci < titleStr.length - 1 ? spacing : 0);
            }
            var titleStartX = (width - titleTotalW) / 2;
            var titleY = Math.round(height * L.title);
            for (var ci = 0; ci < titleStr.length; ci++) {
                ctx.textAlign = 'left';
                ctx.fillText(titleStr[ci], titleStartX, titleY);
                titleStartX += ctx.measureText(titleStr[ci]).width + spacing;
            }

            // Red underline
            var ulW = Math.round(60 * S);
            ctx.fillStyle = '#e31837';
            ctx.fillRect((width - ulW) / 2, titleY + Math.round(10 * S), ulW, Math.round(2 * S));

            var p1Won = data.player1Score > data.player2Score;
            var p2Won = data.player2Score > data.player1Score;
            var tied = data.player1Score === data.player2Score;

            // Player names
            var nameSize = Math.round(24 * S * FS);
            ctx.font = '800 ' + nameSize + 'px ' + FF_HEAD;
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(data.player1Name.toUpperCase(), width * 0.25, Math.round(height * L.names));
            ctx.fillText(data.player2Name.toUpperCase(), width * 0.75, Math.round(height * L.names));

            // Scores — massive
            var scoreSize = Math.round(140 * S * FS);
            ctx.font = '900 ' + scoreSize + 'px ' + FF_MONO;

            var scoresY = Math.round(height * L.scores);
            ctx.fillStyle = p1Won ? '#e31837' : '#444444';
            ctx.fillText(String(data.player1Score), width * 0.25, scoresY);

            ctx.fillStyle = '#333333';
            ctx.font = '400 ' + Math.round(48 * S * FS) + 'px ' + FF_BODY;
            ctx.fillText('\u2013', width / 2, scoresY - Math.round(20 * S));

            ctx.font = '900 ' + scoreSize + 'px ' + FF_MONO;
            ctx.fillStyle = p2Won ? '#e31837' : '#444444';
            ctx.fillText(String(data.player2Score), width * 0.75, scoresY);

            // Winner pill
            var pillY = Math.round(height * L.banner);
            var pillH = Math.round(34 * S * FS);
            var winnerText = tied ? 'TIE' :
                (p1Won ? data.player1Name.toUpperCase() + ' WINS' : data.player2Name.toUpperCase() + ' WINS');
            var pillFontSize = Math.round(16 * S * FS);
            ctx.font = '800 ' + pillFontSize + 'px ' + FF_HEAD;
            var pillTextW = ctx.measureText(winnerText).width;
            var pillW = pillTextW + Math.round(36 * S);
            var pillX = (width - pillW) / 2;
            var pillR = Math.round(pillH / 2);

            ctx.fillStyle = tied ? '#333333' : '#e31837';
            roundRect(ctx, pillX, pillY, pillW, pillH, pillR);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(winnerText, width / 2, pillY + pillH * 0.67);

            // Horizontal divider line
            var dividerY = Math.round(height * L.winsTop) - Math.round(4 * S);
            ctx.fillStyle = '#222222';
            ctx.fillRect(0, dividerY, width, 1);

            // ---- BIGGEST WINS AREA ----
            var winsAreaY = dividerY + 1;
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, winsAreaY, width, height - winsAreaY);

            var compData = lastComparisonData;
            if (compData) {
                var p1Wins = getTopWins('player1', compData);
                var p2Wins = getTopWins('player2', compData);

                var colPad = Math.round(24 * S);
                var midX = width / 2;
                var leftColX = colPad;
                var leftColW = midX - colPad - Math.round(6 * S);
                var rightColX = midX + Math.round(6 * S);
                var rightColW = width - rightColX - colPad;

                // Column headers
                var hdrY = winsAreaY + Math.round(20 * S);
                var hdrFont = Math.round(14 * S * FS);

                function drawColHdr(x, w, pName) {
                    ctx.fillStyle = '#e31837';
                    ctx.font = '800 ' + hdrFont + 'px ' + FF_HEAD;
                    ctx.textAlign = 'left';
                    ctx.fillText(pName.toUpperCase(), x + Math.round(6 * S), hdrY);
                    ctx.fillRect(x + Math.round(6 * S), hdrY + Math.round(4 * S), w - Math.round(12 * S), 1);
                }

                drawColHdr(leftColX, leftColW, data.player1Name);
                drawColHdr(rightColX, rightColW, data.player2Name);

                // Vertical center divider
                ctx.fillStyle = '#222222';
                ctx.fillRect(midX - 0.5, winsAreaY, 1, height - winsAreaY - Math.round(30 * S));

                // Win rows
                var rowStartY = hdrY + Math.round(18 * S);
                var rowBottomLimit = Math.round(height * L.winsBot);
                var availRowH = rowBottomLimit - rowStartY;
                var lineH = availRowH / maxLines;
                var mFont = Math.max(Math.round(9 * S), Math.round(lineH * 0.52 * FS));
                var vFont = Math.max(Math.round(9 * S), Math.round(lineH * 0.52 * FS));
                function drawWinRows(wins, colX, colW, isP1Col) {
                    for (var i = 0; i < wins.length; i++) {
                        var y = rowStartY + i * lineH;
                        var w = wins[i];
                        var label = labelFor(w.metric);
                        var p1v = valOrZero(w.p1Value);
                        var p2v = valOrZero(w.p2Value);
                        var textY = y + lineH * 0.72;

                        ctx.font = '600 ' + mFont + 'px ' + FF_HEAD;
                        ctx.fillStyle = '#888888';
                        ctx.textAlign = 'left';
                        ctx.fillText(label, colX + Math.round(6 * S), textY);

                        var rightEdge = colX + colW - Math.round(6 * S);
                        var dashStr = ' \u2013 ';

                        ctx.font = '600 ' + vFont + 'px ' + FF_MONO;
                        var dashW = ctx.measureText(dashStr).width;

                        if (isP1Col) {
                            ctx.font = '600 ' + vFont + 'px ' + FF_MONO;
                            var p2W = ctx.measureText(p2v).width;

                            ctx.fillStyle = '#555555';
                            ctx.textAlign = 'right';
                            ctx.fillText(p2v, rightEdge, textY);

                            ctx.fillStyle = '#333333';
                            ctx.fillText(dashStr, rightEdge - p2W, textY);

                            ctx.font = '800 ' + vFont + 'px ' + FF_MONO;
                            ctx.fillStyle = '#e31837';
                            ctx.fillText(p1v, rightEdge - p2W - dashW, textY);
                        } else {
                            ctx.font = '800 ' + vFont + 'px ' + FF_MONO;
                            var p2BW = ctx.measureText(p2v).width;

                            ctx.fillStyle = '#e31837';
                            ctx.textAlign = 'right';
                            ctx.fillText(p2v, rightEdge, textY);

                            ctx.font = '600 ' + vFont + 'px ' + FF_MONO;
                            ctx.fillStyle = '#333333';
                            ctx.fillText(dashStr, rightEdge - p2BW, textY);

                            ctx.fillStyle = '#555555';
                            ctx.fillText(p1v, rightEdge - p2BW - dashW, textY);
                        }

                        if (i < wins.length - 1) {
                            ctx.fillStyle = '#1a1a1a';
                            ctx.fillRect(colX + Math.round(4 * S), y + lineH - 1, colW - Math.round(8 * S), 1);
                        }
                    }
                }

                drawWinRows(p1Wins, leftColX, leftColW, true);
                drawWinRows(p2Wins, rightColX, rightColW, false);
            }

            // Branding
            ctx.fillStyle = '#333333';
            ctx.font = '400 ' + Math.round(13 * S * FS) + 'px ' + FF_BODY;
            ctx.textAlign = 'center';
            ctx.fillText('HoopsMatic.com', width / 2, height - Math.round(10 * S));

            ctx.globalAlpha = 1;
        }

        // Intro screen removed — video starts directly on scrolling content

        // ========================================
        // VIDEO GENERATION
        // ========================================

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function generateVideo() {
            var player1 = document.getElementById('player1').value.trim();
            var player2 = document.getElementById('player2').value.trim();
            var compType = document.getElementById('comparisonType').value;
            var resolution = document.getElementById('resolution').value;
            var duration = parseInt(document.getElementById('duration').value, 10);
            var framerate = parseInt(document.getElementById('framerate').value, 10);
            console.log('[VideoGen] duration=' + duration + 's, framerate=' + framerate + 'fps, totalFrames=' + (duration * framerate));

            // Validation
            if (!player1 || !player2) {
                showStatus('Please select both players', 'error');
                return;
            }

            if (!allPlayers.includes(player1) || !allPlayers.includes(player2)) {
                showStatus('Invalid player names. Please select from autocomplete.', 'error');
                return;
            }

            if (player1 === player2) {
                showStatus('Please select two different players', 'error');
                return;
            }

            if (compType === 'season') {
                var s1 = document.getElementById('season1Select').value;
                var s2 = document.getElementById('season2Select').value;
                if (!s1 || !s2) {
                    showStatus('Please select seasons for both players', 'error');
                    return;
                }
            }

            // Disable button and show progress
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('loadingSpinner').style.display = 'inline-block';
            document.getElementById('btnText').textContent = 'Generating...';
            showStatus('Starting video generation...', 'info');
            updateProgress(0, 'Initializing...');

            try {
                var canvas = document.getElementById('videoCanvas');
                var ctx = canvas.getContext('2d');

                var resolutions = {
                    '1080p': { width: 1920, height: 1080 },
                    '720p': { width: 1280, height: 720 },
                    'square': { width: 1080, height: 1080 },
                    'story': { width: 1080, height: 1920 }
                };

                var dims = resolutions[resolution];
                canvas.width = dims.width;
                canvas.height = dims.height;

                // Show preview panel
                document.getElementById('previewPanel').classList.add('active');
                canvas.scrollIntoView({ behavior: 'smooth', block: 'center' });

                updateProgress(10, 'Calculating comparison...');

                // Get comparison data
                var comparisonData = performComparison(player1, player2);
                lastComparisonData = comparisonData;

                if (comparisonData.sections.length === 0) {
                    showStatus('No comparison data found for these players. Try different players.', 'error');
                    document.getElementById('generateBtn').disabled = false;
                    document.getElementById('loadingSpinner').style.display = 'none';
                    document.getElementById('btnText').textContent = 'Generate Video';
                    return;
                }

                updateProgress(20, 'Building content layout...');

                var contentLayout = buildContentLayout(comparisonData, dims.width, dims.height);

                updateProgress(25, 'Setting up video recorder...');

                // Create offscreen canvas for recording (immune to tab throttling)
                var offscreen = document.createElement('canvas');
                offscreen.width = dims.width;
                offscreen.height = dims.height;
                var offCtx = offscreen.getContext('2d');
                var previewCtx = ctx; // #videoCanvas context for live preview

                // Set up MediaRecorder on the offscreen canvas
                var stream = offscreen.captureStream(framerate);
                recordedChunks = [];

                var mimeType = 'video/webm;codecs=vp9';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm;codecs=vp8';
                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = 'video/webm';
                    }
                }

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 8000000
                });

                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                // Start recording and give it time to initialise
                mediaRecorder.start();
                await sleep(50);
                updateProgress(30, 'Recording started...');

                // --- Frame rendering loop (setTimeout-based, not rAF) ---
                var frameDelay = Math.round(1000 / framerate);

                // Timing allocation
                var startPauseFrames = Math.round(framerate * 2.0);
                var outroFrames = Math.round(framerate * 10.0);
                var pauseFrames = Math.round(framerate * 2.0);
                var scrollFrames = Math.max(1, duration * framerate - startPauseFrames - pauseFrames - outroFrames);
                var totalFrames = startPauseFrames + scrollFrames + pauseFrames + outroFrames;
                console.log('[VideoGen] totalFrames=' + totalFrames + ', startPause=' + startPauseFrames + ', scroll=' + scrollFrames + ', pause=' + pauseFrames + ', outro=' + outroFrames);

                // Pre-calculate running scores for animated counter
                var runningScores = [];
                var cumP1 = 0, cumP2 = 0;
                contentLayout.items.forEach(function(item) {
                    if (item.type === 'item') {
                        if (item.winner === 'player1') cumP1++;
                        else if (item.winner === 'player2') cumP2++;
                    }
                    runningScores.push({ p1: cumP1, p2: cumP2 });
                });

                var visibleContentHeight = dims.height - 140;
                var totalScrollDistance = Math.max(0, contentLayout.totalHeight - visibleContentHeight + 80);

                // Track when each item was first revealed (-1 = never seen)
                var itemRevealedAtFrame = new Array(contentLayout.items.length).fill(-1);

                // Helper: count scores for settled items (age >= 8)
                function countRevealedScores(curFrame) {
                    var p1 = 0, p2 = 0;
                    for (var i = 0; i < contentLayout.items.length; i++) {
                        var it = contentLayout.items[i];
                        if (it.type === 'item' && itemRevealedAtFrame[i] !== -1 && (curFrame - itemRevealedAtFrame[i]) >= 8) {
                            if (it.winner === 'player1') p1++;
                            else if (it.winner === 'player2') p2++;
                        }
                    }
                    return { p1: p1, p2: p2 };
                }

                for (var frame = 0; frame < totalFrames; frame++) {
                    var frameStart = performance.now();

                    // Clear offscreen canvas
                    offCtx.fillStyle = '#f5f5f7';
                    offCtx.fillRect(0, 0, dims.width, dims.height);

                    if (frame < startPauseFrames) {
                        // START PAUSE — hold first frame (scrollY=0, nothing revealed)
                        drawHeader(offCtx, comparisonData, dims.width, 0, 0);
                        drawScrollingContent(offCtx, contentLayout, dims.width, dims.height, 0, itemRevealedAtFrame, frame);

                    } else if (frame < startPauseFrames + scrollFrames) {
                        // SCROLLING PHASE — pure linear scroll
                        var scrollFrame = frame - startPauseFrames;
                        var scrollProgress = scrollFrame / scrollFrames;
                        var scrollY = scrollProgress * totalScrollDistance;

                        var scores = countRevealedScores(frame);
                        drawHeader(offCtx, comparisonData, dims.width, scores.p1, scores.p2);
                        drawScrollingContent(offCtx, contentLayout, dims.width, dims.height, scrollY, itemRevealedAtFrame, frame);

                    } else if (frame < startPauseFrames + scrollFrames + pauseFrames) {
                        // END PAUSE — hold last scroll frame with final scores
                        var scores = countRevealedScores(frame);
                        drawHeader(offCtx, comparisonData, dims.width, scores.p1, scores.p2);
                        drawScrollingContent(offCtx, contentLayout, dims.width, dims.height, totalScrollDistance, itemRevealedAtFrame, frame);

                    } else {
                        // OUTRO/FINAL SCREEN PHASE
                        var outroFrame = frame - startPauseFrames - scrollFrames - pauseFrames;
                        var outroProgress = outroFrame / outroFrames;
                        drawFinalScreen(offCtx, comparisonData, dims.width, dims.height, outroProgress);
                    }

                    // Mirror offscreen canvas to the visible preview canvas
                    previewCtx.drawImage(offscreen, 0, 0);

                    // Update progress bar every 30 frames
                    if (frame % 30 === 0) {
                        var percent = 30 + ((frame / totalFrames) * 65);
                        updateProgress(percent, 'Rendering frame ' + frame + '/' + totalFrames + '...');
                    }

                    // Sleep to maintain target frame rate (not throttled like rAF)
                    var elapsed = performance.now() - frameStart;
                    await sleep(Math.max(1, frameDelay - elapsed));
                }

                // Stop recording
                updateProgress(95, 'Finalizing video...');
                mediaRecorder.stop();

                // Wait for the onstop event to fire and create the blob
                await new Promise(function(resolve) {
                    mediaRecorder.onstop = function() {
                        videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                        updateProgress(100, 'Video complete!');
                        showStatus('Video generated successfully! Size: ' + (videoBlob.size / 1024 / 1024).toFixed(2) + ' MB', 'success');
                        document.getElementById('downloadBtn').style.display = 'block';
                        document.getElementById('generateBtn').disabled = false;
                        document.getElementById('loadingSpinner').style.display = 'none';
                        document.getElementById('btnText').textContent = 'Generate Video';
                        resolve();
                    };
                });

            } catch (error) {
                console.error('Video generation error:', error);
                showStatus('Error generating video: ' + error.message, 'error');
                document.getElementById('generateBtn').disabled = false;
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('btnText').textContent = 'Generate Video';
            }
        }

        // ========================================
        // DOWNLOAD
        // ========================================

        function downloadVideo() {
            if (!videoBlob) return;

            var player1 = document.getElementById('player1').value.replace(/\s+/g, '-');
            var player2 = document.getElementById('player2').value.replace(/\s+/g, '-');
            var filename = player1 + '-vs-' + player2 + '-comparison.webm';

            var url = URL.createObjectURL(videoBlob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);

            showStatus('Download started! Check your downloads folder.', 'success');
        }

        function resetGenerator() {
            document.getElementById('previewPanel').classList.remove('active');
            document.getElementById('progressContainer').classList.remove('active');
            document.getElementById('statusMessage').classList.remove('active');
            document.getElementById('player1').value = '';
            document.getElementById('player2').value = '';
            document.getElementById('season1Select').innerHTML = '<option value="">-- Choose Season --</option>';
            document.getElementById('season2Select').innerHTML = '<option value="">-- Choose Season --</option>';
            document.getElementById('season1Select').disabled = true;
            document.getElementById('season2Select').disabled = true;
            videoBlob = null;
            recordedChunks = [];
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========================================
        // INITIALIZATION
        // ========================================

        window.addEventListener('DOMContentLoaded', function() {
            loadAllData();

            setupAutocomplete('player1', 'suggestions1');
            setupAutocomplete('player2', 'suggestions2');

            document.getElementById('generateBtn').addEventListener('click', generateVideo);
            document.getElementById('downloadBtn').addEventListener('click', downloadVideo);
            document.getElementById('resetBtn').addEventListener('click', resetGenerator);
            document.getElementById('comparisonType').addEventListener('change', onComparisonTypeChange);
        });
    </script>
