        // ===== Section include/exclude filter (additive) =====
        // Populate the checklist by running the (unchanged) comparison once to see
        // which sections exist for the chosen players/mode.
        function loadSectionFilterList() {
            const listEl = document.getElementById('sectionFilterList');
            const player1 = document.getElementById('player1').value.trim();
            const player2 = document.getElementById('player2').value.trim();
            if (!player1 || !player2 || !allPlayers.includes(player1) || !allPlayers.includes(player2)) {
                showStatus('Select two valid players first (use the autocomplete).', 'error');
                return;
            }
            if (player1 === player2) { showStatus('Please select two different players', 'error'); return; }

            let data;
            try {
                data = performComparison(player1, player2);
            } catch (e) {
                showStatus(e && e.message ? e.message : 'Could not load sections.', 'error');
                return;
            }
            if (!data || !data.sections || data.sections.length === 0) {
                listEl.innerHTML = '<div class="section-filter-hint">No sections available for this comparison (check players/seasons).</div>';
                return;
            }

            let html = '<div class="section-filter-hint">Uncheck any section to exclude it from the video and the score.</div>';
            data.sections.forEach(function(s) {
                const val = String(s.name).replace(/"/g, '&quot;');
                html += '<label><input type="checkbox" class="section-filter-check" value="' + val + '" checked> ' + s.name + '</label>';
            });
            listEl.innerHTML = html;
        }

        // Derive a filtered copy of comparisonData (original untouched): drop unchecked
        // sections and recompute totals from the remaining sections' row wins. A section
        // is excluded only if it was offered in the checklist AND is unchecked, so a
        // stale checklist (different players) safely leaves all sections included.
        function filterComparisonSections(comparisonData) {
            const checks = document.querySelectorAll('#sectionFilterList .section-filter-check');
            if (!checks.length) return comparisonData;

            const offered = {}, checked = {};
            checks.forEach(function(cb) {
                offered[cb.value] = true;
                if (cb.checked) checked[cb.value] = true;
            });

            const sections = comparisonData.sections.filter(function(s) {
                return !offered[s.name] || checked[s.name];
            });
            if (sections.length === comparisonData.sections.length) return comparisonData;

            let p1 = 0, p2 = 0;
            sections.forEach(function(s) {
                s.items.forEach(function(it) {
                    if (it.winner === 'player1') p1++;
                    else if (it.winner === 'player2') p2++;
                });
            });

            const copy = {};
            for (const k in comparisonData) copy[k] = comparisonData[k];
            copy.sections = sections;
            copy.player1Score = p1;
            copy.player2Score = p2;
            return copy;
        }

        async function generateVideo() {
            var player1 = document.getElementById('player1').value.trim();
            var player2 = document.getElementById('player2').value.trim();
            var compType = document.getElementById('comparisonType').value;
            var resolution = document.getElementById('resolution').value;
            var framerate = parseInt(document.getElementById('framerate').value, 10);
            console.log('[VideoGen] framerate=' + framerate + 'fps');

            // Validation
            if (!player1 || !player2) {
                showStatus('Please select both players', 'error');
                return;
            }

            if (!allPlayers.includes(player1) || !allPlayers.includes(player2)) {
                showStatus('Invalid player names. Please select from autocomplete.', 'error');
                return;
            }

            if (player1 === player2) {
                showStatus('Please select two different players', 'error');
                return;
            }

            if (compType === 'season') {
                var s1 = document.getElementById('season1Select').value;
                var s2 = document.getElementById('season2Select').value;
                if (!s1 || !s2) {
                    showStatus('Please select seasons for both players', 'error');
                    return;
                }
            }

            // Disable button and show progress
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('loadingSpinner').style.display = 'inline-block';
            document.getElementById('btnText').textContent = 'Generating...';
            showStatus('Starting video generation...', 'info');
            updateProgress(0, 'Initializing...');

            try {
                var canvas = document.getElementById('videoCanvas');
                var ctx = canvas.getContext('2d');

                var resolutions = {
                    '1080p': { width: 1920, height: 1080 },
                    '720p': { width: 1280, height: 720 },
                    'square': { width: 1080, height: 1080 },
                    'story': { width: 1080, height: 1920 }
                };

                var dims = resolutions[resolution];
                canvas.width = dims.width;
                canvas.height = dims.height;

                // Show preview panel
                document.getElementById('previewPanel').classList.add('active');
                canvas.scrollIntoView({ behavior: 'smooth', block: 'center' });

                updateProgress(10, 'Calculating comparison...');

                // Get comparison data
                var comparisonData = performComparison(player1, player2);
                // Drop any sections the user unchecked (and recompute totals) before rendering.
                comparisonData = filterComparisonSections(comparisonData);
                lastComparisonData = comparisonData;

                if (comparisonData.sections.length === 0) {
                    showStatus('No comparison data found for these players. Try different players.', 'error');
                    document.getElementById('generateBtn').disabled = false;
                    document.getElementById('loadingSpinner').style.display = 'none';
                    document.getElementById('btnText').textContent = 'Generate Video';
                    return;
                }

                updateProgress(15, 'Loading headshots...');

                // Preload player headshots with 3-second timeout
                var p1Img = null, p2Img = null;
                var p1Url = getHeadshotUrl(player1);
                var p2Url = getHeadshotUrl(player2);
                function loadImg(url) {
                    if (!url) return Promise.resolve(null);
                    return Promise.race([
                        new Promise(function(resolve) {
                            var img = new Image();
                            img.crossOrigin = 'anonymous';
                            img.onload = function() { resolve(img); };
                            img.onerror = function() { resolve(null); };
                            img.src = url;
                        }),
                        new Promise(function(resolve) { setTimeout(function() { resolve(null); }, 3000); })
                    ]);
                }
                var hsResults = await Promise.allSettled([loadImg(p1Url), loadImg(p2Url)]);
                p1Img = hsResults[0].status === 'fulfilled' ? hsResults[0].value : null;
                p2Img = hsResults[1].status === 'fulfilled' ? hsResults[1].value : null;

                updateProgress(20, 'Building content layout...');

                var contentLayout = buildContentLayout(comparisonData, dims.width, dims.height);

                updateProgress(25, 'Setting up video recorder...');

                // Create offscreen canvas for recording (immune to tab throttling)
                var offscreen = document.createElement('canvas');
                offscreen.width = dims.width;
                offscreen.height = dims.height;
                var offCtx = offscreen.getContext('2d');
                var previewCtx = ctx; // #videoCanvas context for live preview

                // Set up MediaRecorder on the offscreen canvas
                var stream = offscreen.captureStream(framerate);
                recordedChunks = [];

                var mimeType = 'video/webm;codecs=vp9';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm;codecs=vp8';
                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = 'video/webm';
                    }
                }

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 8000000
                });

                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                // Start recording and give it time to initialise
                mediaRecorder.start();
                await sleep(50);
                updateProgress(30, 'Recording started...');

                // Set up parallel MP4 muxer
                var mp4Muxer = new Mp4Muxer.Muxer({
                    target: new Mp4Muxer.ArrayBufferTarget(),
                    fastStart: 'in-memory',
                    video: {
                        codec: 'avc',
                        width: dims.width,
                        height: dims.height
                    }
                });

                var videoEncoder = new VideoEncoder({
                    output: function(chunk, meta) {
                        mp4Muxer.addVideoChunk(chunk, meta);
                    },
                    error: function(e) {
                        console.error('VideoEncoder error:', e);
                    }
                });

                videoEncoder.configure({
                    codec: 'avc1.4d0034',
                    width: dims.width,
                    height: dims.height,
                    bitrate: 8_000_000,
                    framerate: framerate
                });

                // --- Frame rendering loop (setTimeout-based, not rAF) ---
                var frameDelay = Math.round(1000 / framerate);

                // Build reveal schedule (skip ties — they show instantly as settled)
                var revealGap = Math.round(framerate * 0.66);
                var itemRevealSchedule = new Array(contentLayout.items.length).fill(-1);
                var revealableIndices = [];
                for (var ri = 0; ri < contentLayout.items.length; ri++) {
                    var rItem = contentLayout.items[ri];
                    if (rItem.type === 'item') {
                        if (rItem.winner === 'tie') {
                            itemRevealSchedule[ri] = -2; // always settled, no flash
                        } else {
                            revealableIndices.push(ri);
                        }
                    }
                }
                var startPauseFrames = Math.round(framerate * 2.0);
                for (var ri = 0; ri < revealableIndices.length; ri++) {
                    itemRevealSchedule[revealableIndices[ri]] = startPauseFrames + ri * revealGap;
                }
                var lastRevealFrame = revealableIndices.length > 0 ?
                    itemRevealSchedule[revealableIndices[revealableIndices.length - 1]] : startPauseFrames;
                var contentEndFrame = lastRevealFrame + revealGap; // buffer after last reveal
                var pauseFrames = Math.round(framerate * 0.8);
                var outroFrames = Math.round(framerate * 10.0);
                var totalFrames = contentEndFrame + pauseFrames + outroFrames;
                console.log('[VideoGen] totalFrames=' + totalFrames + ' (' + (totalFrames / framerate).toFixed(1) + 's), revealables=' + revealableIndices.length + ', revealGap=' + revealGap + ', contentEnd=' + contentEndFrame);

                var visibleContentHeight = dims.height - 140;

                // Helper: count scores for settled items (age >= 8)
                function countRevealedScores(curFrame) {
                    var p1 = 0, p2 = 0;
                    for (var i = 0; i < contentLayout.items.length; i++) {
                        var it = contentLayout.items[i];
                        var sched = itemRevealSchedule[i];
                        if (sched !== -1 && curFrame >= sched + 8) {
                            if (it.winner === 'player1') p1++;
                            else if (it.winner === 'player2') p2++;
                        }
                    }
                    return { p1: p1, p2: p2 };
                }

                // Scroll state
                var currentScrollY = 0;

                for (var frame = 0; frame < totalFrames; frame++) {
                    var frameStart = performance.now();

                    // Clear offscreen canvas
                    offCtx.fillStyle = '#f5f5f7';
                    offCtx.fillRect(0, 0, dims.width, dims.height);

                    // Calculate target scroll based on most recently SETTLED item (age >= 8)
                    var targetScrollY = 0;
                    if (frame >= startPauseFrames) {
                        // Find the last settled item (revealed + age >= 8)
                        var lastSettledIdx = -1;
                        for (var li = revealableIndices.length - 1; li >= 0; li--) {
                            var si = revealableIndices[li];
                            var sched = itemRevealSchedule[si];
                            if (sched !== -1 && frame >= sched + 8) {
                                lastSettledIdx = si;
                                break;
                            }
                        }
                        if (lastSettledIdx >= 0) {
                            targetScrollY = Math.max(0, contentLayout.items[lastSettledIdx].y - visibleContentHeight * 0.55);
                        }
                        // Hard cap: never scroll past the last settled item
                        var maxScrollY = targetScrollY;
                        if (currentScrollY > maxScrollY) currentScrollY = maxScrollY;
                    }
                    // Slow lerp scroll (0.04 = visibly lags behind reveals)
                    currentScrollY += (targetScrollY - currentScrollY) * 0.04;

                    if (frame < contentEndFrame + pauseFrames) {
                        // CONTENT + PAUSE PHASE
                        var scores = countRevealedScores(frame);
                        drawHeader(offCtx, comparisonData, dims.width, scores.p1, scores.p2, p1Img, p2Img);
                        drawScrollingContent(offCtx, contentLayout, dims.width, dims.height, currentScrollY, itemRevealSchedule, frame);

                    } else {
                        // OUTRO/FINAL SCREEN PHASE
                        var outroFrame = frame - contentEndFrame - pauseFrames;
                        var outroProgress = outroFrame / outroFrames;
                        var finalScores = countRevealedScores(frame);
                        drawFinalScreen(offCtx, comparisonData, dims.width, dims.height, outroProgress, p1Img, p2Img, finalScores.p1, finalScores.p2);
                    }

                    // Mirror offscreen canvas to the visible preview canvas
                    previewCtx.drawImage(offscreen, 0, 0);

                    // Capture frame for MP4 encoder
                    var videoFrame = new VideoFrame(offscreen, { timestamp: (frame * 1_000_000) / framerate });
                    videoEncoder.encode(videoFrame, { keyFrame: frame % (framerate * 2) === 0 });
                    videoFrame.close();

                    // Update progress bar every 30 frames
                    if (frame % 30 === 0) {
                        var percent = 30 + ((frame / totalFrames) * 65);
                        updateProgress(percent, 'Rendering frame ' + frame + '/' + totalFrames + '...');
                    }

                    // Sleep to maintain target frame rate (not throttled like rAF)
                    var elapsed = performance.now() - frameStart;
                    await sleep(Math.max(1, frameDelay - elapsed));
                }

                // Finalize MP4
                await videoEncoder.flush();
                mp4Muxer.finalize();
                window.mp4Buffer = mp4Muxer.target.buffer;

                // Stop recording
                updateProgress(95, 'Finalizing video...');
                mediaRecorder.stop();

                // Wait for the onstop event to fire and create the blob
                await new Promise(function(resolve) {
                    mediaRecorder.onstop = function() {
                        videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                        updateProgress(100, 'Video complete!');
                        showStatus('Video generated successfully! Size: ' + (videoBlob.size / 1024 / 1024).toFixed(2) + ' MB', 'success');
                        document.getElementById('downloadMp4Btn').style.display = 'block';
                        document.getElementById('downloadBtn').style.display = 'block';
                        document.getElementById('generateBtn').disabled = false;
                        document.getElementById('loadingSpinner').style.display = 'none';
                        document.getElementById('btnText').textContent = 'Generate Video';
                        resolve();
                    };
                });

            } catch (error) {
                console.error('Video generation error:', error);
                showStatus('Error generating video: ' + error.message, 'error');
                document.getElementById('generateBtn').disabled = false;
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('btnText').textContent = 'Generate Video';
            }
        }

        // ========================================
        // DOWNLOAD
        // ========================================

        function downloadVideo() {
            if (!videoBlob) return;

            var player1 = document.getElementById('player1').value.replace(/\s+/g, '-');
            var player2 = document.getElementById('player2').value.replace(/\s+/g, '-');
            var filename = player1 + '-vs-' + player2 + '-comparison.webm';

            var url = URL.createObjectURL(videoBlob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);

            showStatus('Download started! Check your downloads folder.', 'success');
        }

        function downloadMP4() {
            if (!window.mp4Buffer) return;
            var blob = new Blob([window.mp4Buffer], { type: 'video/mp4' });
            var p1 = document.getElementById('player1').value.replace(/\s+/g, '-');
            var p2 = document.getElementById('player2').value.replace(/\s+/g, '-');
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = p1 + '-vs-' + p2 + '-comparison.mp4';
            a.click();
            URL.revokeObjectURL(url);
            showStatus('MP4 download started! Check your downloads folder.', 'success');
        }

        function resetGenerator() {
            document.getElementById('previewPanel').classList.remove('active');
            document.getElementById('progressContainer').classList.remove('active');
            document.getElementById('statusMessage').classList.remove('active');
            document.getElementById('player1').value = '';
            document.getElementById('player2').value = '';
            document.getElementById('season1Select').innerHTML = '<option value="">-- Choose Season --</option>';
            document.getElementById('season2Select').innerHTML = '<option value="">-- Choose Season --</option>';
            document.getElementById('season1Select').disabled = true;
            document.getElementById('season2Select').disabled = true;
            videoBlob = null;
            recordedChunks = [];
            window.mp4Buffer = null;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========================================
        // INITIALIZATION
        // ========================================

        window.addEventListener('DOMContentLoaded', function() {
            loadAllData();

            setupAutocomplete('player1', 'suggestions1');
            setupAutocomplete('player2', 'suggestions2');

            document.getElementById('generateBtn').addEventListener('click', generateVideo);
            document.getElementById('downloadMp4Btn').addEventListener('click', downloadMP4);
            document.getElementById('downloadBtn').addEventListener('click', downloadVideo);
            document.getElementById('resetBtn').addEventListener('click', resetGenerator);
            document.getElementById('comparisonType').addEventListener('change', onComparisonTypeChange);
        });
    </script>
</body>
</html>
