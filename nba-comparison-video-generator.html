<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Comparison Video Generator - HoopsHype</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 0;
        }

        .header {
            background: linear-gradient(135deg, #e31837 0%, #c41230 100%);
            color: white;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(227, 24, 55, 0.3);
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .header p {
            font-size: 18px;
            opacity: 0.95;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 30px;
        }

        .settings-panel {
            background: #2a2a2a;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .settings-section {
            margin-bottom: 35px;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .settings-section h3 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 700;
        }

        .player-inputs {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 25px;
            align-items: start;
        }

        .vs-divider {
            font-size: 32px;
            font-weight: bold;
            color: #e31837;
            text-shadow: 0 2px 10px rgba(227, 24, 55, 0.5);
            padding-top: 12px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            background: #1a1a1a;
            color: white;
            border: 2px solid #404040;
            border-radius: 8px;
            transition: all 0.3s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #e31837;
            box-shadow: 0 0 0 3px rgba(227, 24, 55, 0.1);
        }

        select option {
            background: #2a2a2a;
            color: white;
        }

        .video-settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
        }

        .setting-group label {
            font-size: 15px;
            margin-bottom: 10px;
            color: #bbb;
            font-weight: 600;
        }

        .season-select-group {
            margin-top: 12px;
            display: none;
        }

        .season-select-group.active {
            display: block;
        }

        .season-select-group label {
            font-size: 13px;
            color: #bbb;
            display: block;
            margin-bottom: 6px;
        }

        .season-select-group select {
            padding: 12px;
            font-size: 14px;
        }

        .generate-btn {
            width: 100%;
            padding: 22px;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #e31837 0%, #c41230 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(227, 24, 55, 0.4);
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(227, 24, 55, 0.5);
        }

        .generate-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .generate-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .preview-panel {
            background: #2a2a2a;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: none;
        }

        .preview-panel.active {
            display: block;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .preview-header h3 {
            font-size: 24px;
            font-weight: 700;
        }

        #videoCanvas {
            width: 100%;
            border: 3px solid #404040;
            border-radius: 12px;
            background: #000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .progress-container {
            margin: 25px 0;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-label {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #1a1a1a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #404040;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e31837 0%, #c41230 100%);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(227, 24, 55, 0.5);
        }

        .status-message {
            text-align: center;
            padding: 18px;
            border-radius: 10px;
            margin: 25px 0;
            font-size: 16px;
            font-weight: 600;
            display: none;
        }

        .status-message.active {
            display: block;
        }

        .status-message.info {
            background: rgba(33, 150, 243, 0.15);
            color: #42a5f5;
            border: 2px solid rgba(33, 150, 243, 0.3);
        }

        .status-message.success {
            background: rgba(76, 175, 80, 0.15);
            color: #66bb6a;
            border: 2px solid rgba(76, 175, 80, 0.3);
        }

        .status-message.error {
            background: rgba(244, 67, 54, 0.15);
            color: #ef5350;
            border: 2px solid rgba(244, 67, 54, 0.3);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .download-btn, .reset-btn {
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .download-btn {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(76, 175, 80, 0.4);
        }

        .reset-btn {
            background: #404040;
            color: white;
        }

        .reset-btn:hover {
            background: #505050;
        }

        .autocomplete-suggestions {
            position: absolute;
            background: #2a2a2a;
            border: 2px solid #404040;
            border-top: none;
            max-height: 350px;
            overflow-y: auto;
            width: 100%;
            z-index: 1000;
            display: none;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .autocomplete-suggestions.active {
            display: block;
        }

        .suggestion-item {
            padding: 14px;
            cursor: pointer;
            border-bottom: 1px solid #404040;
            color: white;
            transition: background 0.2s;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: #353535;
        }

        .player-select-wrapper {
            position: relative;
        }

        .loading-spinner {
            border: 3px solid #404040;
            border-top: 3px solid #e31837;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #505050;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>NBA COMPARISON VIDEO GENERATOR</h1>
        <p>Create high-quality comparison videos for social media | Powered by HoopsHype</p>
    </div>

    <div class="container">
        <div class="settings-panel">
            <div class="settings-section">
                <h3>Select Players to Compare</h3>
                <div class="player-inputs">
                    <div class="player-select-wrapper">
                        <input type="text" id="player1" placeholder="Type player name..." autocomplete="off">
                        <div id="suggestions1" class="autocomplete-suggestions"></div>
                        <div class="season-select-group" id="season1Group">
                            <label>Season for Player 1</label>
                            <select id="season1Select" disabled>
                                <option value="">-- Choose Season --</option>
                            </select>
                        </div>
                    </div>
                    <div class="vs-divider">VS</div>
                    <div class="player-select-wrapper">
                        <input type="text" id="player2" placeholder="Type player name..." autocomplete="off">
                        <div id="suggestions2" class="autocomplete-suggestions"></div>
                        <div class="season-select-group" id="season2Group">
                            <label>Season for Player 2</label>
                            <select id="season2Select" disabled>
                                <option value="">-- Choose Season --</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h3>Video Configuration</h3>
                <div class="video-settings">
                    <div class="setting-group">
                        <label>Comparison Type</label>
                        <select id="comparisonType">
                            <option value="career" selected>Career vs Career</option>
                            <option value="season">Season vs Season</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label>Resolution / Format</label>
                        <select id="resolution">
                            <option value="1080p">1080p HD (1920x1080) - YouTube/Twitter</option>
                            <option value="720p" selected>720p HD (1280x720) - Standard</option>
                            <option value="square">Square (1080x1080) - Instagram Feed</option>
                            <option value="story">Story (1080x1920) - Instagram/TikTok</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label>Video Duration</label>
                        <select id="duration">
                            <option value="30">30 seconds - Quick</option>
                            <option value="45" selected>45 seconds - Standard</option>
                            <option value="60">60 seconds - Detailed</option>
                            <option value="90">90 seconds - Complete</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label>Frame Rate</label>
                        <select id="framerate">
                            <option value="24">24 FPS - Cinematic</option>
                            <option value="30" selected>30 FPS - Standard</option>
                            <option value="60">60 FPS - Smooth</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label>Categories to Include</label>
                        <select id="sections">
                            <option value="all" selected>All Categories</option>
                            <option value="highlights">Highlights Only (Awards + Key Stats)</option>
                            <option value="awards">Awards & Accolades</option>
                            <option value="stats">Career Statistics</option>
                            <option value="playoff">Playoff Performance</option>
                        </select>
                    </div>
                </div>
            </div>

            <button class="generate-btn" id="generateBtn" disabled>
                <span class="loading-spinner" id="loadingSpinner" style="display: none;"></span>
                <span id="btnText">Loading Data...</span>
            </button>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-label">
                <span id="progressText">Rendering video...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="preview-panel" id="previewPanel">
            <div class="preview-header">
                <h3>Video Preview</h3>
            </div>
            <canvas id="videoCanvas" width="1280" height="720"></canvas>
            <div class="button-group">
                <button class="download-btn" id="downloadBtn">Download Video (WebM)</button>
                <button class="reset-btn" id="resetBtn">Create Another</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // CONFIGURATION
        // ========================================

        const DATA_BASE_URL = 'https://jsierrahoopshype.github.io/nba-player-data/';

        // ========================================
        // GLOBAL STATE
        // ========================================

        let playerData = {};
        let allPlayers = [];
        let videoBlob = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let lastComparisonData = null;

        // ========================================
        // DATA LOADING
        // ========================================

        async function loadAllData() {
            try {
                showStatus('Loading NBA database...', 'info');
                document.getElementById('btnText').textContent = 'Loading Data...';

                const timestamp = Date.now();
                const cb = '?t=' + timestamp;

                const [awards, rsStats, poStats, allStar, salaries, nba2k, combine, comparisons, awardVotes, poSeries, sneakers] = await Promise.all([
                    fetch(DATA_BASE_URL + 'awards.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'rsStats.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'poStats.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'allStar.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'salaries.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'nba2k.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'combine-v3.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'comparisons.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'awardVotes.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'poSeries.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'sneakers.json' + cb).then(r => r.json())
                ]);

                playerData = { awards, rsStats, poStats, allStar, salaries, nba2k, combine, comparisons, awardVotes, poSeries, sneakers };

                // Extract unique players from regular season stats
                const playerSet = new Set();
                rsStats.forEach(row => {
                    if (row.PLAYER) playerSet.add(row.PLAYER);
                });
                allPlayers = Array.from(playerSet).sort();

                // Force browser to load Google Fonts before canvas rendering
                document.body.insertAdjacentHTML('beforeend',
                    '<span style="font-family:\'Barlow Condensed\'; font-weight:900; position:absolute; opacity:0;">.</span>' +
                    '<span style="font-family:\'Barlow\'; font-weight:400; position:absolute; opacity:0;">.</span>'
                );
                await new Promise(function(r) { setTimeout(r, 500); });

                showStatus('Database loaded! ' + allPlayers.length.toLocaleString() + ' players ready.', 'success');
                document.getElementById('btnText').textContent = 'Generate Video';
                document.getElementById('generateBtn').disabled = false;

            } catch (error) {
                showStatus('Error loading data: ' + error.message, 'error');
                document.getElementById('btnText').textContent = 'Error - Reload Page';
            }
        }

        // ========================================
        // AUTOCOMPLETE
        // ========================================

        function setupAutocomplete(inputId, suggestionsId) {
            const input = document.getElementById(inputId);
            const suggestions = document.getElementById(suggestionsId);

            input.addEventListener('input', function() {
                const value = this.value.toLowerCase();
                if (value.length < 2) {
                    suggestions.classList.remove('active');
                    return;
                }

                const matches = allPlayers
                    .filter(p => p.toLowerCase().includes(value))
                    .slice(0, 15);

                if (matches.length > 0) {
                    suggestions.innerHTML = matches.map(player =>
                        '<div class="suggestion-item" data-player="' + player + '">' + player + '</div>'
                    ).join('');
                    suggestions.classList.add('active');

                    suggestions.querySelectorAll('.suggestion-item').forEach(item => {
                        item.addEventListener('click', function() {
                            input.value = this.dataset.player;
                            suggestions.classList.remove('active');
                            // Populate season dropdown for this player
                            const playerNum = inputId === 'player1' ? '1' : '2';
                            populateSeasonDropdown(this.dataset.player, playerNum);
                        });
                    });
                } else {
                    suggestions.classList.remove('active');
                }
            });

            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !suggestions.contains(e.target)) {
                    suggestions.classList.remove('active');
                }
            });
        }

        // ========================================
        // SEASON DROPDOWN MANAGEMENT
        // ========================================

        function populateSeasonDropdown(playerName, playerNum) {
            const select = document.getElementById('season' + playerNum + 'Select');
            select.innerHTML = '<option value="">-- Choose Season --</option>';

            if (!playerName) {
                select.disabled = true;
                return;
            }

            // Get unique seasons for this player from rsStats
            const yearSet = new Set();
            playerData.rsStats.forEach(row => {
                if (row.PLAYER === playerName && row.YEAR) {
                    yearSet.add(row.YEAR);
                }
            });

            const years = Array.from(yearSet).sort((a, b) => {
                return parseInt(b) - parseInt(a); // Most recent first
            });

            if (years.length === 0) {
                select.disabled = true;
                return;
            }

            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = formatSeasonYear(year);
                select.appendChild(opt);
            });

            select.disabled = false;
            // Auto-select most recent season
            select.value = years[0];
        }

        function formatSeasonYear(year) {
            const endYear = parseInt(year);
            if (isNaN(endYear)) return year;
            return (endYear - 1) + '-' + String(endYear).slice(-2);
        }

        function onComparisonTypeChange() {
            const type = document.getElementById('comparisonType').value;
            const isSeason = type === 'season';

            document.getElementById('season1Group').classList.toggle('active', isSeason);
            document.getElementById('season2Group').classList.toggle('active', isSeason);

            // Update sections dropdown options based on mode
            const sectionsEl = document.getElementById('sections');
            if (isSeason) {
                sectionsEl.innerHTML = '<option value="all" selected>All Categories</option>' +
                    '<option value="averages">Averages Only</option>' +
                    '<option value="totals">Totals Only</option>' +
                    '<option value="shooting">Shooting Only</option>';
            } else {
                sectionsEl.innerHTML = '<option value="all" selected>All Categories</option>' +
                    '<option value="highlights">Highlights Only (Awards + Key Stats)</option>' +
                    '<option value="awards">Awards & Accolades</option>' +
                    '<option value="stats">Career Statistics</option>' +
                    '<option value="playoff">Playoff Performance</option>';
            }
        }

        // ========================================
        // UI HELPERS
        // ========================================

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message active ' + type;
        }

        function updateProgress(percent, text) {
            text = text || 'Rendering video...';
            const container = document.getElementById('progressContainer');
            const fill = document.getElementById('progressFill');
            const percentEl = document.getElementById('progressPercent');
            const textEl = document.getElementById('progressText');

            container.classList.add('active');
            fill.style.width = percent + '%';
            percentEl.textContent = Math.round(percent) + '%';
            textEl.textContent = text;
        }

        // ========================================
        // CAREER COMPARISON LOGIC
        // (From nba-player-comparison-tool.html)
        // ========================================

        function parseNumericValue(value) {
            if (!value && value !== 0) return NaN;
            var strValue = String(value);
            // feet-inches format
            var feetInchesMatch = strValue.match(/(\d+)'\s*([\d.]+)['"]+/);
            if (feetInchesMatch) {
                return (parseFloat(feetInchesMatch[1]) * 12) + parseFloat(feetInchesMatch[2]);
            }
            return parseFloat(strValue.replace(/[\$,]/g, ''));
        }

        function deduplicateSeasonRows(playerRows) {
            var byYear = {};
            playerRows.forEach(function(row) {
                var year = row.YEAR || 'unknown';
                if (!byYear[year]) byYear[year] = [];
                byYear[year].push(row);
            });

            var deduplicated = [];
            for (var year in byYear) {
                var yearRows = byYear[year];
                if (yearRows.length === 1) {
                    deduplicated.push(yearRows[0]);
                } else {
                    var totRow = yearRows.find(function(r) {
                        return r.TEAM === 'TOT' || r.TM === 'TOT' || r.Team === 'TOT';
                    });
                    if (totRow) {
                        deduplicated.push(totRow);
                    } else {
                        var aggregated = Object.assign({}, yearRows[0]);
                        var numericColumns = ['GP', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TOV',
                                             'FGM', 'FGA', '3P', '3PA', 'FTM', 'FTA', 'MIN',
                                             'OREB', 'DREB', 'PF'];
                        numericColumns.forEach(function(col) { aggregated[col] = 0; });
                        yearRows.forEach(function(row) {
                            numericColumns.forEach(function(col) {
                                var val = parseFloat(row[col]);
                                if (!isNaN(val)) aggregated[col] = (aggregated[col] || 0) + val;
                            });
                        });
                        deduplicated.push(aggregated);
                    }
                }
            }
            return deduplicated;
        }

        function getAwardCount(playerName, awardType) {
            if (awardType === 'All-NBA Selections') {
                var total = playerData.awards.filter(function(row) {
                    return row['PLAYER / COACH'] === playerName &&
                        (row.AWARD === 'All-NBA First Team' || row.AWARD === 'All-NBA Second Team' || row.AWARD === 'All-NBA Third Team');
                }).length;
                return total > 0 ? total : null;
            }

            if (awardType === 'All-Defensive Team Selections') {
                var total = playerData.awards.filter(function(row) {
                    return row['PLAYER / COACH'] === playerName &&
                        (row.AWARD === 'All-Defensive First Team' || row.AWARD === 'All-Defensive Second Team');
                }).length;
                return total > 0 ? total : null;
            }

            if (awardType === 'Olympic Medals') {
                var total = playerData.awards.filter(function(row) {
                    return row['PLAYER / COACH'] === playerName &&
                        (row.AWARD === 'Olympic Gold' || row.AWARD === 'Olympic Silver' || row.AWARD === 'Olympic Bronze');
                }).length;
                return total > 0 ? total : null;
            }

            if (awardType === 'World Cup Medals') {
                var total = playerData.awards.filter(function(row) {
                    return row['PLAYER / COACH'] === playerName &&
                        (row.AWARD === 'World Cup Gold' || row.AWARD === 'World Cup Silver' || row.AWARD === 'World Cup Bronze');
                }).length;
                return total > 0 ? total : null;
            }

            if (awardType === 'Conference Finals MVP') {
                var total = playerData.awards.filter(function(row) {
                    return row['PLAYER / COACH'] === playerName &&
                        (row.AWARD === 'EC Finals MVP' || row.AWARD === 'WC Finals MVP');
                }).length;
                return total > 0 ? total : null;
            }

            var count = playerData.awards.filter(function(row) {
                return row['PLAYER / COACH'] === playerName && row.AWARD === awardType;
            }).length;
            return count > 0 ? count : null;
        }

        function getRegularSeasonStat(playerName, metric) {
            var rawRows = playerData.rsStats.filter(function(row) { return row.PLAYER === playerName; });

        function getSalaryStat(playerName, metric) {
            var playerRows = playerData.salaries.filter(function(row) { return row.PLAYER === playerName; });
            if (playerRows.length === 0) return null;

            var salariesByYear = {};
            playerRows.forEach(function(row) {
                var year = row.YEAR;
                var salary = parseFloat(String(row.SALARY || '').replace(/[$,]/g, ''));
                if (!isNaN(salary) && salary > 0 && year) {
                    if (!salariesByYear[year]) salariesByYear[year] = [];
                    salariesByYear[year].push(salary);
                }
            });

            var yearlyTotals = [];
            for (var year in salariesByYear) {
                yearlyTotals.push(salariesByYear[year].reduce(function(sum, val) { return sum + val; }, 0));
            }
            if (yearlyTotals.length === 0) return null;

            if (metric === 'Career earnings') {
                var total = yearlyTotals.reduce(function(sum, val) { return sum + val; }, 0);
                return '$' + Math.round(total).toLocaleString();
            }
            if (metric === 'Average salary') {
                var avg = yearlyTotals.reduce(function(sum, val) { return sum + val; }, 0) / yearlyTotals.length;
                return '$' + Math.round(avg).toLocaleString();
            }
            if (metric === 'Highest salary') {
                return '$' + Math.round(Math.max.apply(null, yearlyTotals)).toLocaleString();
            }
            if (metric === 'Lowest salary') {
                return '$' + Math.round(Math.min.apply(null, yearlyTotals)).toLocaleString();
            }
            return null;
        }

        // ========================================
        // CAREER COMPARISON (using comparisons.json)
        // ========================================

        function performCareerComparison(player1Name, player2Name, sectionFilter) {
            var player1Score = 0;
            var player2Score = 0;
            var sections = [];
            var currentSection = null;
            var currentSectionObj = null;

            var alwaysAwardSections = ['ACCOLADES', 'BEST AWARDS RANKING', 'YEARS RECEIVING VOTES', 'SIGNATURE SHOES', 'PLAYOFF SUCCESS'];
            var requireBothDataSections = ['SALARIES', 'NBA 2K'];
            var excludeFromOverall = ['DRAFT COMBINE'];

            playerData.comparisons.forEach(function(comp) {
                var category = comp['Comparison points'];
                var winCondition = comp['Who wins?'];
                var dataSource = comp['Wheres the data?'];

                // Section header
                if (!winCondition && !dataSource) {
                    currentSection = category;
                    currentSectionObj = { name: category, items: [], sectionP1: 0, sectionP2: 0 };
                    sections.push(currentSectionObj);
                    return;
                }

                if (!currentSectionObj || !category) return;

                // Apply section filter
                if (sectionFilter && sectionFilter !== 'all') {
                    if (sectionFilter === 'awards' && currentSection !== 'ACCOLADES') return;
                    if (sectionFilter === 'stats' && !['NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK'].includes(currentSection)) return;
                    if (sectionFilter === 'playoff' && !['PLAYOFF SUCCESS'].includes(currentSection) && !category.includes('PO')) return;
                    if (sectionFilter === 'highlights' && !['ACCOLADES', 'NBA CAREER AVERAGES'].includes(currentSection)) return;
                }

                var p1Value = getPlayerStat(player1Name, category, dataSource);
                var p2Value = getPlayerStat(player2Name, category, dataSource);

                var winner = 'tie';
                var awardPoint = false;
                var alwaysAward = alwaysAwardSections.includes(currentSection);
                var requireBothData = requireBothDataSections.includes(currentSection) || excludeFromOverall.includes(currentSection);

                if (p1Value !== null && p2Value !== null) {
                    var p1Num = parseNumericValue(p1Value);
                    var p2Num = parseNumericValue(p2Value);

                    if (!isNaN(p1Num) && !isNaN(p2Num)) {
                        if (winCondition === 'Most') {
                            if (p1Num > p2Num) { winner = 'player1'; awardPoint = true; }
                            else if (p2Num > p1Num) { winner = 'player2'; awardPoint = true; }
                        } else if (winCondition === 'Least') {
                            if (p1Num < p2Num) { winner = 'player1'; awardPoint = true; }
                            else if (p2Num < p1Num) { winner = 'player2'; awardPoint = true; }
                        }

                        // Untracked stat check
                        if (awardPoint) {
                            var untrackedSections = ['NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK'];
                            var untrackedCategories = ['steals', 'steal', 'blocks', 'block', 'turnovers', 'turnover', 'three', '3p', 'stl', 'blk', 'tov'];
                            var inUntrackedSection = untrackedSections.some(function(s) {
                                return currentSection && currentSection.trim().toUpperCase() === s.toUpperCase();
                            });
                            var isUntrackedCategory = untrackedCategories.some(function(c) {
                                return category && category.toLowerCase().includes(c);
                            });

                            if (inUntrackedSection && isUntrackedCategory) {
                                var isZero = function(raw, num) {
                                    if (num === 0) return true;
                                    var s = String(raw).trim();
                                    return s === '0' || s === '0.0' || s === '0.00' || parseFloat(s) === 0;
                                };
                                if (isZero(p1Value, p1Num) || isZero(p2Value, p2Num)) {
                                    awardPoint = false;
                                    winner = 'tie';
                                }
                            }
                        }
                    }
                } else if (alwaysAward && !requireBothData) {
                    if (p1Value !== null && p2Value === null) {
                        var p1Num = parseNumericValue(p1Value);
                        if (!isNaN(p1Num) && p1Num > 0) { winner = 'player1'; awardPoint = true; }
                    } else if (p2Value !== null && p1Value === null) {
                        var p2Num = parseNumericValue(p2Value);
                        if (!isNaN(p2Num) && p2Num > 0) { winner = 'player2'; awardPoint = true; }
                    }
                }

                if (awardPoint) {
                    if (winner === 'player1') {
                        currentSectionObj.sectionP1++;
                        if (!excludeFromOverall.includes(currentSection)) player1Score++;
                    } else if (winner === 'player2') {
                        currentSectionObj.sectionP2++;
                        if (!excludeFromOverall.includes(currentSection)) player2Score++;
                    }
                }

                // Only add items that have data for at least one player
                if (p1Value !== null || p2Value !== null) {
                    // Filter out untracked stats where both are zero
                    var untrackedSections2 = ['NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK'];
                    var untrackedCategories2 = ['steals', 'steal', 'blocks', 'block', 'turnovers', 'turnover', 'three', '3p', 'stl', 'blk', 'tov'];
                    var inUT = untrackedSections2.some(function(s) { return currentSection && currentSection.trim().toUpperCase() === s.toUpperCase(); });
                    var isUT = untrackedCategories2.some(function(c) { return category && category.toLowerCase().includes(c); });

                    var skipRow = false;
                    if (inUT && isUT) {
                        var isZ = function(val) {
                            if (val === null || val === undefined) return true;
                            var s = String(val).trim();
                            return s === '0' || s === '0.0' || s === '0.00' || parseFloat(s) === 0;
                        };
                        if (isZ(p1Value) && isZ(p2Value)) skipRow = true;
                    }

                    if (!skipRow) {
                        currentSectionObj.items.push({
                            metric: category,
                            p1Value: p1Value !== null ? String(p1Value) : '-',
                            p2Value: p2Value !== null ? String(p2Value) : '-',
                            winner: winner
                        });
                    }
                }
            });

            // Remove empty sections
            sections = sections.filter(function(s) { return s.items.length > 0; });

            return {
                player1Name: player1Name,
                player2Name: player2Name,
                player1Score: player1Score,
                player2Score: player2Score,
                sections: sections
            };
        }

        function getSeasonData(playerName, year, source) {
            var dataArr = source === 'po' ? playerData.poStats : playerData.rsStats;
            var rows = dataArr.filter(function(row) {
                return row.PLAYER === playerName && row.YEAR === year;
            });
            if (rows.length === 0) return null;

            // Handle traded players (TOT row preferred)
            if (rows.length > 1) {
                var totRow = rows.find(function(r) { return r.TEAM === 'TOT' || r.TM === 'TOT'; });
                if (totRow) return totRow;
                // Aggregate if no TOT
                var agg = Object.assign({}, rows[0]);
                var numCols = ['GP', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TOV', 'FGM', 'FGA', '3P', '3PA', 'FTM', 'FTA', 'MIN', 'OREB', 'DREB', 'PF'];
                numCols.forEach(function(col) { agg[col] = 0; });
                rows.forEach(function(row) {
                    numCols.forEach(function(col) {
                        var val = parseFloat(row[col]);
                        if (!isNaN(val)) agg[col] = (agg[col] || 0) + val;
                    });
                });
                return agg;
            }
            return rows[0];
        }

        function performSeasonComparison(player1Name, player2Name, season1, season2, sectionFilter) {
            var player1Score = 0;
            var player2Score = 0;
            var sections = [];

            var rs1 = getSeasonData(player1Name, season1, 'rs');
            var rs2 = getSeasonData(player2Name, season2, 'rs');
            var po1 = getSeasonData(player1Name, season1, 'po');
            var po2 = getSeasonData(player2Name, season2, 'po');

            var gp1 = rs1 ? parseFloat(rs1.GP) : 0;
            var gp2 = rs2 ? parseFloat(rs2.GP) : 0;
            var gpPO1 = po1 ? parseFloat(po1.GP) : 0;
            var gpPO2 = po2 ? parseFloat(po2.GP) : 0;

            // Define season comparison categories
            var seasonConfig = [
                {
                    category: 'COUNTING STATS: AVERAGES',
                    filterKey: 'averages',
                    metrics: [
                        { name: 'Points', col: 'PTS', src: 'rs', higher: true, pg: true },
                        { name: 'Rebounds', col: 'REB', src: 'rs', higher: true, pg: true },
                        { name: 'Assists', col: 'AST', src: 'rs', higher: true, pg: true },
                        { name: 'Steals', col: 'STL', src: 'rs', higher: true, pg: true },
                        { name: 'Blocks', col: 'BLK', src: 'rs', higher: true, pg: true },
                        { name: 'Field Goal %', col: 'calc_fg_pct', src: 'rs', higher: true, pct: true },
                        { name: 'Three Point %', col: 'calc_3p_pct', src: 'rs', higher: true, pct: true },
                        { name: 'Free Throw %', col: 'calc_ft_pct', src: 'rs', higher: true, pct: true },
                        { name: 'Turnovers', col: 'TOV', src: 'rs', higher: false, pg: true },
                        { name: 'Points PO', col: 'PTS', src: 'po', higher: true, pg: true },
                        { name: 'Rebounds PO', col: 'REB', src: 'po', higher: true, pg: true },
                        { name: 'Assists PO', col: 'AST', src: 'po', higher: true, pg: true },
                        { name: 'Steals PO', col: 'STL', src: 'po', higher: true, pg: true },
                        { name: 'Blocks PO', col: 'BLK', src: 'po', higher: true, pg: true },
                        { name: 'Field Goal % PO', col: 'calc_fg_pct', src: 'po', higher: true, pct: true },
                        { name: 'Three Point % PO', col: 'calc_3p_pct', src: 'po', higher: true, pct: true },
                        { name: 'Free Throw % PO', col: 'calc_ft_pct', src: 'po', higher: true, pct: true },
                        { name: 'Turnovers PO', col: 'TOV', src: 'po', higher: false, pg: true }
                    ]
                },
                {
                    category: 'COUNTING STATS: TOTALS',
                    filterKey: 'totals',
                    metrics: [
                        { name: 'Games Played', col: 'GP', src: 'rs', higher: true },
                        { name: 'Points', col: 'PTS', src: 'rs', higher: true },
                        { name: 'Rebounds', col: 'REB', src: 'rs', higher: true },
                        { name: 'Assists', col: 'AST', src: 'rs', higher: true },
                        { name: 'Steals', col: 'STL', src: 'rs', higher: true },
                        { name: 'Blocks', col: 'BLK', src: 'rs', higher: true },
                        { name: 'Turnovers', col: 'TOV', src: 'rs', higher: false },
                        { name: 'Games Played PO', col: 'GP', src: 'po', higher: true },
                        { name: 'Points PO', col: 'PTS', src: 'po', higher: true },
                        { name: 'Rebounds PO', col: 'REB', src: 'po', higher: true },
                        { name: 'Assists PO', col: 'AST', src: 'po', higher: true },
                        { name: 'Steals PO', col: 'STL', src: 'po', higher: true },
                        { name: 'Blocks PO', col: 'BLK', src: 'po', higher: true },
                        { name: 'Turnovers PO', col: 'TOV', src: 'po', higher: false }
                    ]
                },
                {
                    category: 'SHOOTING EFFICIENCY',
                    filterKey: 'shooting',
                    metrics: [
                        { name: 'Field Goals Made', col: 'FGM', src: 'rs', higher: true },
                        { name: 'Field Goals Attempted', col: 'FGA', src: 'rs', higher: true },
                        { name: 'Three Pointers Made', col: '3P', src: 'rs', higher: true },
                        { name: 'Three Pointers Attempted', col: '3PA', src: 'rs', higher: true },
                        { name: 'Free Throws Made', col: 'FTM', src: 'rs', higher: true },
                        { name: 'Free Throws Attempted', col: 'FTA', src: 'rs', higher: true }
                    ]
                }
            ];

            function getSeasonStatValue(data, gp, metric) {
                if (!data) return null;

                // Calculated percentages
                if (metric.col === 'calc_fg_pct') {
                    var m = parseFloat(data.FGM), a = parseFloat(data.FGA);
                    if (!isNaN(m) && !isNaN(a) && a > 0) return ((m / a) * 100).toFixed(1) + '%';
                    return null;
                }
                if (metric.col === 'calc_3p_pct') {
                    var m = parseFloat(data['3P']), a = parseFloat(data['3PA']);
                    if (!isNaN(m) && !isNaN(a) && a > 0) return ((m / a) * 100).toFixed(1) + '%';
                    return null;
                }
                if (metric.col === 'calc_ft_pct') {
                    var m = parseFloat(data.FTM), a = parseFloat(data.FTA);
                    if (!isNaN(m) && !isNaN(a) && a > 0) return ((m / a) * 100).toFixed(1) + '%';
                    return null;
                }

                var val = parseFloat(data[metric.col]);
                if (isNaN(val)) return null;

                if (metric.pg && gp > 0) {
                    return (val / gp).toFixed(1);
                }

                return metric.pct ? val.toFixed(1) + '%' : Math.round(val);
            }

            seasonConfig.forEach(function(cat) {
                // Apply filter
                if (sectionFilter && sectionFilter !== 'all') {
                    if (sectionFilter !== cat.filterKey) return;
                }

                var sectionObj = { name: cat.category, items: [], sectionP1: 0, sectionP2: 0 };

                cat.metrics.forEach(function(metric) {
                    var data1 = metric.src === 'po' ? po1 : rs1;
                    var data2 = metric.src === 'po' ? po2 : rs2;
                    var g1 = metric.src === 'po' ? gpPO1 : gp1;
                    var g2 = metric.src === 'po' ? gpPO2 : gp2;

                    var v1 = getSeasonStatValue(data1, g1, metric);
                    var v2 = getSeasonStatValue(data2, g2, metric);

                    if (v1 === null && v2 === null) return;

                    var winner = 'tie';
                    var n1 = parseNumericValue(v1);
                    var n2 = parseNumericValue(v2);

                    if (!isNaN(n1) && !isNaN(n2)) {
                        if (metric.higher) {
                            if (n1 > n2) winner = 'player1';
                            else if (n2 > n1) winner = 'player2';
                        } else {
                            if (n1 < n2) winner = 'player1';
                            else if (n2 < n1) winner = 'player2';
                        }
                    }

                    if (winner === 'player1') { sectionObj.sectionP1++; player1Score++; }
                    if (winner === 'player2') { sectionObj.sectionP2++; player2Score++; }

                    sectionObj.items.push({
                        metric: metric.name,
                        p1Value: v1 !== null ? String(v1) : '-',
                        p2Value: v2 !== null ? String(v2) : '-',
                        winner: winner
                    });
                });

                if (sectionObj.items.length > 0) sections.push(sectionObj);
            });

            return {
                player1Name: player1Name + ' (' + formatSeasonYear(season1) + ')',
                player2Name: player2Name + ' (' + formatSeasonYear(season2) + ')',
                player1Score: player1Score,
                player2Score: player2Score,
                sections: sections
            };
        }

        // ========================================
        // UNIFIED COMPARISON DISPATCHER
        // ========================================

        function performComparison(player1, player2) {
            var compType = document.getElementById('comparisonType').value;
            var sectionFilter = document.getElementById('sections').value;

            if (compType === 'season') {
                var season1 = document.getElementById('season1Select').value;
                var season2 = document.getElementById('season2Select').value;
                return performSeasonComparison(player1, player2, season1, season2, sectionFilter);
            } else {
                return performCareerComparison(player1, player2, sectionFilter);
            }
        }

        // ========================================
        // CANVAS RENDERING ENGINE
        // ========================================

        // Pre-calculate all content layout
        // Canvas helper: rounded rectangle
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function buildContentLayout(comparisonData, width, height) {
            var layout = [];
            var y = 0;
            var SECTION_HEADER_HEIGHT = 80;
            var ITEM_ROW_HEIGHT = 52;
            var ITEM_GAP = 6;
            var SECTION_GAP = 36;

            comparisonData.sections.forEach(function(section) {
                layout.push({
                    type: 'sectionHeader', y: y, text: section.name,
                    sectionP1: section.sectionP1, sectionP2: section.sectionP2,
                    p1Name: comparisonData.player1Name, p2Name: comparisonData.player2Name
                });
                y += SECTION_HEADER_HEIGHT;

                section.items.forEach(function(item) {
                    layout.push({
                        type: 'item', y: y,
                        metric: item.metric,
                        p1Value: item.p1Value, p2Value: item.p2Value,
                        winner: item.winner,
                        p1Name: comparisonData.player1Name, p2Name: comparisonData.player2Name
                    });
                    y += ITEM_ROW_HEIGHT + ITEM_GAP;
                });

                y += SECTION_GAP;
            });

            return { items: layout, totalHeight: y };
        }

        // Global font scale multiplier (1.3 = 30% larger across all drawing)
        var FS = 1.3;

        // Font families (Barlow Condensed for headings/scores, Barlow for body)
        var FF_HEAD = '"Barlow Condensed", "Arial Narrow", Arial, sans-serif';
        var FF_MONO = '"Barlow Condensed", "Courier New", monospace';
        var FF_BODY = '"Barlow", Arial, sans-serif';

        // --- Colors from comparison tool CSS variables ---
        var C = {
            bg: '#f5f5f7', surface: '#ffffff', border: '#d1d1d6',
            text: '#1d1d1f', textSec: '#6e6e73', accent: '#3b82f6',
            green: '#34c759', greenDim: 'rgba(52, 199, 89, 0.15)',
            orange: '#f59e0b', orangeDim: 'rgba(245, 158, 11, 0.15)'
        };

        function drawHeader(ctx, data, width, p1Score, p2Score) {
            var HEADER_H = 140;
            // White background behind header card
            ctx.fillStyle = C.bg;
            ctx.fillRect(0, 0, width, HEADER_H);

            var pad = Math.round(width * 0.04);
            var cardX = pad, cardY = 10;
            var cardW = width - pad * 2, cardH = HEADER_H - 20;
            var r = 12;

            // Card shadow
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.06)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 2;
            roundRect(ctx, cardX, cardY, cardW, cardH, r);
            ctx.fillStyle = C.surface;
            ctx.fill();
            ctx.restore();

            // Card border
            roundRect(ctx, cardX, cardY, cardW, cardH, r);
            ctx.strokeStyle = C.border;
            ctx.lineWidth = 1;
            ctx.stroke();

            var midX = width / 2;
            var centerY = cardY + cardH / 2;

            // Player 1 name (left)
            var nameSize = Math.round(Math.min(24, width * 0.019) * FS);
            ctx.font = '700 ' + nameSize + 'px ' + FF_HEAD;
            ctx.fillStyle = C.text;
            ctx.textAlign = 'center';
            ctx.fillText(data.player1Name, midX - cardW * 0.25, centerY - 16);

            // Player 1 score
            var scoreSize = Math.round(Math.min(48, width * 0.037) * FS);
            var p1Won = p1Score > p2Score;
            var p2Won = p2Score > p1Score;
            ctx.font = '800 ' + scoreSize + 'px ' + FF_MONO;
            ctx.fillStyle = p1Won ? C.green : C.accent;
            ctx.fillText(String(Math.round(p1Score)), midX - cardW * 0.25, centerY + 30);

            // Divider
            ctx.font = '400 ' + Math.round(Math.min(30, width * 0.023) * FS) + 'px ' + FF_BODY;
            ctx.fillStyle = C.textSec;
            ctx.textAlign = 'center';
            ctx.fillText('\u2013', midX, centerY + 8);

            // Player 2 name (right)
            ctx.font = '700 ' + nameSize + 'px ' + FF_HEAD;
            ctx.fillStyle = C.text;
            ctx.fillText(data.player2Name, midX + cardW * 0.25, centerY - 16);

            // Player 2 score
            ctx.font = '800 ' + scoreSize + 'px ' + FF_MONO;
            ctx.fillStyle = p2Won ? C.green : C.accent;
            ctx.fillText(String(Math.round(p2Score)), midX + cardW * 0.25, centerY + 30);
        }

        function drawScrollingContent(ctx, contentLayout, width, height, scrollY, itemRevealedAtFrame, currentFrame) {
            var HEADER_HEIGHT = 140;
            var contentAreaTop = HEADER_HEIGHT;
            var contentAreaHeight = height - HEADER_HEIGHT;

            ctx.fillStyle = C.bg;
            ctx.fillRect(0, contentAreaTop, width, contentAreaHeight);

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, contentAreaTop, width, contentAreaHeight);
            ctx.clip();

            var pad = Math.round(width * 0.04);
            var rowW = width - pad * 2;
            var fr = rowW / 11;
            var col1W = fr * 2;
            var col2W = fr * 3;
            var col3W = fr * 1;
            var col4W = fr * 3;
            var col5W = fr * 2;
            var col1X = pad;
            var col2X = pad + col1W;
            var col3X = pad + col1W + col2W;
            var col4X = pad + col1W + col2W + col3W;
            var col5X = pad + col1W + col2W + col3W + col4W;

            contentLayout.items.forEach(function(item, idx) {
                var drawY = contentAreaTop + item.y - scrollY;

                if (drawY < contentAreaTop - 90 || drawY > height + 20) return;

                if (item.type === 'sectionHeader') {
                    ctx.fillStyle = C.bg;
                    ctx.fillRect(pad, drawY, rowW, 80);

                    var titleSize = Math.round(Math.min(22, width * 0.017) * FS);
                    ctx.font = '700 ' + titleSize + 'px ' + FF_HEAD;
                    ctx.fillStyle = C.text;
                    ctx.textAlign = 'left';
                    ctx.fillText(item.text, pad + 4, drawY + 32);

                    ctx.fillStyle = C.accent;
                    ctx.fillRect(pad, drawY + 52, rowW, 2);

                    if (item.sectionP1 > 0 || item.sectionP2 > 0) {
                        var subSize = Math.round(Math.min(15, width * 0.012) * FS);
                        ctx.font = '500 ' + subSize + 'px ' + FF_BODY;
                        ctx.fillStyle = C.textSec;
                        ctx.textAlign = 'left';
                        ctx.fillText(
                            item.p1Name + ' ' + item.sectionP1 + '  \u2013  ' + item.p2Name + ' ' + item.sectionP2,
                            pad + 4, drawY + 72
                        );
                    }

                } else if (item.type === 'item') {
                    var ROW_H = 52;
                    var RAD = 8;

                    // Track reveal using simple array
                    var inView = drawY >= contentAreaTop && drawY < height;
                    if (inView && itemRevealedAtFrame[idx] === -1) {
                        itemRevealedAtFrame[idx] = currentFrame;
                    }
                    var age = itemRevealedAtFrame[idx] === -1 ? -1 : (currentFrame - itemRevealedAtFrame[idx]);
                    var settled = age >= 8;

                    var isP1Win = settled && item.winner === 'player1';
                    var isP2Win = settled && item.winner === 'player2';
                    var isTie = settled && item.winner === 'tie' && item.p1Value !== '-' && item.p2Value !== '-';

                    // Card background
                    ctx.save();
                    roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                    ctx.fillStyle = C.surface;
                    ctx.fill();

                    // Red flash overlay (age 0-7)
                    if (age >= 0 && age < 8) {
                        ctx.save();
                        roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                        ctx.clip();
                        ctx.fillStyle = 'rgba(227,24,55,0.2)';
                        ctx.fillRect(pad, drawY, rowW, ROW_H);
                        ctx.restore();
                    }

                    // Final winner/tie tints (settled, age >= 8)
                    if (isP1Win) {
                        ctx.save();
                        roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                        ctx.clip();
                        var grad = ctx.createLinearGradient(pad, 0, pad + rowW, 0);
                        grad.addColorStop(0, C.greenDim);
                        grad.addColorStop(0.4, 'rgba(255,255,255,0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(pad, drawY, rowW, ROW_H);
                        ctx.restore();
                    } else if (isP2Win) {
                        ctx.save();
                        roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                        ctx.clip();
                        var grad = ctx.createLinearGradient(pad, 0, pad + rowW, 0);
                        grad.addColorStop(0.6, 'rgba(255,255,255,0)');
                        grad.addColorStop(1, C.greenDim);
                        ctx.fillStyle = grad;
                        ctx.fillRect(pad, drawY, rowW, ROW_H);
                        ctx.restore();
                    } else if (isTie) {
                        ctx.save();
                        roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                        ctx.clip();
                        var grad = ctx.createLinearGradient(pad, 0, pad + rowW, 0);
                        grad.addColorStop(0, C.orangeDim);
                        grad.addColorStop(0.3, 'rgba(255,255,255,0)');
                        grad.addColorStop(0.7, 'rgba(255,255,255,0)');
                        grad.addColorStop(1, C.orangeDim);
                        ctx.fillStyle = grad;
                        ctx.fillRect(pad, drawY, rowW, ROW_H);
                        ctx.restore();
                    }

                    // Card border
                    roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                    ctx.strokeStyle = C.border;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Winner accent borders (only if settled)
                    if (isP1Win) {
                        ctx.fillStyle = C.green;
                        ctx.fillRect(pad, drawY + 4, 3, ROW_H - 8);
                    } else if (isP2Win) {
                        ctx.fillStyle = C.green;
                        ctx.fillRect(pad + rowW - 3, drawY + 4, 3, ROW_H - 8);
                    } else if (isTie) {
                        ctx.fillStyle = C.orange;
                        ctx.fillRect(pad, drawY + 4, 3, ROW_H - 8);
                        ctx.fillRect(pad + rowW - 3, drawY + 4, 3, ROW_H - 8);
                    }

                    ctx.restore();

                    var textY = drawY + ROW_H / 2 + 5;
                    var valSize = Math.round(Math.min(18, width * 0.014) * FS);
                    var nameColSize = Math.round(Math.min(14, width * 0.011) * FS);
                    var metricSize = Math.round(Math.min(14, width * 0.011) * FS);

                    var showColors = settled;

                    // Col 1: Player 1 value
                    ctx.font = ((showColors && item.winner === 'player1') ? '700 ' : '600 ') + valSize + 'px ' + FF_MONO;
                    ctx.fillStyle = showColors ? (item.winner === 'player1' ? C.green : C.text) : C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(item.p1Value, col1X + col1W / 2, textY);

                    // Col 2: Player 1 name
                    ctx.font = '400 ' + nameColSize + 'px ' + FF_BODY;
                    ctx.fillStyle = C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(item.p1Name, col2X + col2W / 2, textY);

                    // Col 3: Metric label
                    ctx.font = '600 ' + metricSize + 'px ' + FF_HEAD;
                    ctx.fillStyle = C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(item.metric, col3X + col3W / 2, textY);

                    // Col 4: Player 2 name
                    ctx.font = '400 ' + nameColSize + 'px ' + FF_BODY;
                    ctx.fillStyle = C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(item.p2Name, col4X + col4W / 2, textY);

                    // Col 5: Player 2 value
                    ctx.font = ((showColors && item.winner === 'player2') ? '700 ' : '600 ') + valSize + 'px ' + FF_MONO;
                    ctx.fillStyle = showColors ? (item.winner === 'player2' ? C.green : C.text) : C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(item.p2Value, col5X + col5W / 2, textY);
                }
            });

            ctx.restore();
        }

        // Priority list for ranking "biggest wins"
        var WIN_PRIORITY = [
            'NBA Champion', 'Finals MVP', 'Most Valuable Player', 'Conference Finals MVP',
            'All-NBA First Team', 'All-NBA Selections', 'All-Star', 'Points', 'Points PO',
            'Points per game', 'Points per game PO', 'Scoring Leader',
            'Defensive Player of the Year', 'Rookie of the Year', 'Olympic Gold',
            'Olympic Medals', 'All-Defensive First Team', 'All-Defensive Team Selections',
            'Rebounds', 'Rebounds PO', 'Rebounding Leader', 'Rebounds per game',
            'Rebounds per game PO', 'Assists', 'Assists PO', 'Assists Leader',
            'Assists per game', 'Assists per game PO', 'World Cup Medals',
            'Sixth Man of the Year', 'All-Star MVP', 'Player of the Month',
            'Player of the Week', 'NBA Cup Champion', 'NBA Cup MVP'
        ];

        var DISPLAY_LABELS = {
            'All-NBA First Team': 'All-NBA 1st Team',
            'All-Defensive First Team': 'All-Defense 1st Team'
        };

        // Abbreviated labels for the final card (fits larger fonts)
        var ABBREV_LABELS = {
            'Conference Finals MVP': 'Conf. Finals MVP',
            'Defensive Player of the Year': 'DPOY',
            'Most Valuable Player': 'MVP',
            'Rookie of the Year': 'ROY',
            'Most Improved Player': 'MIP',
            'Sixth Man of the Year': '6th Man',
            'Points per game': 'PPG',
