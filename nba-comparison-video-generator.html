<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Comparison Video Generator - HoopsHype</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 0;
        }

        .header {
            background: linear-gradient(135deg, #e31837 0%, #c41230 100%);
            color: white;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(227, 24, 55, 0.3);
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .header p {
            font-size: 18px;
            opacity: 0.95;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 30px;
        }

        .settings-panel {
            background: #2a2a2a;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .settings-section {
            margin-bottom: 35px;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .settings-section h3 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 700;
        }

        .player-inputs {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 25px;
            align-items: start;
        }

        .vs-divider {
            font-size: 32px;
            font-weight: bold;
            color: #e31837;
            text-shadow: 0 2px 10px rgba(227, 24, 55, 0.5);
            padding-top: 12px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            background: #1a1a1a;
            color: white;
            border: 2px solid #404040;
            border-radius: 8px;
            transition: all 0.3s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #e31837;
            box-shadow: 0 0 0 3px rgba(227, 24, 55, 0.1);
        }

        select option {
            background: #2a2a2a;
            color: white;
        }

        .video-settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
        }

        .setting-group label {
            font-size: 15px;
            margin-bottom: 10px;
            color: #bbb;
            font-weight: 600;
        }

        .season-select-group {
            margin-top: 12px;
            display: none;
        }

        .season-select-group.active {
            display: block;
        }

        .season-select-group label {
            font-size: 13px;
            color: #bbb;
            display: block;
            margin-bottom: 6px;
        }

        .season-select-group select {
            padding: 12px;
            font-size: 14px;
        }

        /* Range Comparison settings (additive) */
        .range-settings-group { margin-top: 12px; display: none; }
        .range-settings-group.active { display: block; }
        .range-settings-group > label { font-size: 15px; color: #bbb; font-weight: 600; margin-bottom: 10px; display: block; }
        .range-inputs { display: flex; gap: 12px; }
        .range-inputs > div { flex: 1; }
        .range-inputs label { font-size: 13px; color: #bbb; display: block; margin-bottom: 6px; }
        .range-settings-group input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            background: #1a1a1a;
            color: white;
            border: 2px solid #404040;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .range-settings-group input[type="number"]:focus {
            outline: none;
            border-color: #e31837;
            box-shadow: 0 0 0 3px rgba(227, 24, 55, 0.1);
        }
        .range-settings-group select.range-cal-select {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            background: #1a1a1a;
            color: white;
            border: 2px solid #404040;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .range-settings-group select.range-cal-select:focus {
            outline: none;
            border-color: #e31837;
            box-shadow: 0 0 0 3px rgba(227, 24, 55, 0.1);
        }
        .range-diff-row { margin-top: 12px; display: flex; align-items: center; gap: 8px; color: #bbb; }
        .range-diff-row input[type="checkbox"] { width: auto; }

        .generate-btn {
            width: 100%;
            padding: 22px;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #e31837 0%, #c41230 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(227, 24, 55, 0.4);
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(227, 24, 55, 0.5);
        }

        .generate-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .generate-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .preview-panel {
            background: #2a2a2a;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: none;
        }

        .preview-panel.active {
            display: block;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .preview-header h3 {
            font-size: 24px;
            font-weight: 700;
        }

        #videoCanvas {
            width: 100%;
            border: 3px solid #404040;
            border-radius: 12px;
            background: #000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .progress-container {
            margin: 25px 0;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-label {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #1a1a1a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #404040;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e31837 0%, #c41230 100%);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(227, 24, 55, 0.5);
        }

        .status-message {
            text-align: center;
            padding: 18px;
            border-radius: 10px;
            margin: 25px 0;
            font-size: 16px;
            font-weight: 600;
            display: none;
        }

        .status-message.active {
            display: block;
        }

        .status-message.info {
            background: rgba(33, 150, 243, 0.15);
            color: #42a5f5;
            border: 2px solid rgba(33, 150, 243, 0.3);
        }

        .status-message.success {
            background: rgba(76, 175, 80, 0.15);
            color: #66bb6a;
            border: 2px solid rgba(76, 175, 80, 0.3);
        }

        .status-message.error {
            background: rgba(244, 67, 54, 0.15);
            color: #ef5350;
            border: 2px solid rgba(244, 67, 54, 0.3);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .download-btn, .reset-btn {
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .download-btn {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(76, 175, 80, 0.4);
        }

        .reset-btn {
            background: #404040;
            color: white;
        }

        .reset-btn:hover {
            background: #505050;
        }

        .autocomplete-suggestions {
            position: absolute;
            background: #2a2a2a;
            border: 2px solid #404040;
            border-top: none;
            max-height: 350px;
            overflow-y: auto;
            width: 100%;
            z-index: 1000;
            display: none;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .autocomplete-suggestions.active {
            display: block;
        }

        .suggestion-item {
            padding: 14px;
            cursor: pointer;
            border-bottom: 1px solid #404040;
            color: white;
            transition: background 0.2s;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: #353535;
        }

        .player-select-wrapper {
            position: relative;
        }

        .loading-spinner {
            border: 3px solid #404040;
            border-top: 3px solid #e31837;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #505050;
        }
    </style>
    <style>
        /* ===== Section include/exclude filter (additive) ===== */
        .section-load-btn {
            background: #2a2a2a; color: #fff; border: 2px solid #404040;
            border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer;
            transition: all 0.3s;
        }
        .section-load-btn:hover { border-color: #e31837; }
        .section-filter-hint { font-size: 13px; color: #888; margin: 12px 0 4px; }
        .section-filter-list { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px 22px; }
        .section-filter-list label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #ddd; cursor: pointer; }
        .section-filter-list input[type="checkbox"] { width: auto; cursor: pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@latest/build/mp4-muxer.js"></script>
</head>
<body>
    <div class="header">
        <h1>NBA COMPARISON VIDEO GENERATOR</h1>
        <p>Create high-quality comparison videos for social media | Powered by HoopsHype</p>
    </div>

    <div class="container">
        <div class="settings-panel">
            <div class="settings-section">
                <h3>Select Players to Compare</h3>
                <div class="player-inputs">
                    <div class="player-select-wrapper">
                        <input type="text" id="player1" placeholder="Type player name..." autocomplete="off">
                        <div id="suggestions1" class="autocomplete-suggestions"></div>
                        <div class="season-select-group" id="season1Group">
                            <label>Season for Player 1</label>
                            <select id="season1Select" disabled>
                                <option value="">-- Choose Season --</option>
                            </select>
                        </div>
                    </div>
                    <div class="vs-divider">VS</div>
                    <div class="player-select-wrapper">
                        <input type="text" id="player2" placeholder="Type player name..." autocomplete="off">
                        <div id="suggestions2" class="autocomplete-suggestions"></div>
                        <div class="season-select-group" id="season2Group">
                            <label>Season for Player 2</label>
                            <select id="season2Select" disabled>
                                <option value="">-- Choose Season --</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h3>Video Configuration</h3>
                <div class="video-settings">
                    <div class="setting-group">
                        <label>Comparison Type</label>
                        <select id="comparisonType">
                            <option value="career" selected>Career vs Career</option>
                            <option value="season">Season vs Season</option>
                            <option value="seasonRange">Season Range (e.g. Seasons 3-8)</option>
                            <option value="ageRange">Age Range (e.g. Ages 23-28)</option>
                            <option value="calendarRange">Calendar Range (e.g. 2018-2026)</option>
                        </select>
                    </div>

                    <div class="setting-group range-settings-group" id="rangeSettingsGroup" style="grid-column: 1 / -1;">
                        <label>Range</label>
                        <div class="range-inputs">
                            <div>
                                <label id="rangeFromLabel">From (season #)</label>
                                <input type="number" id="rangeFrom" min="1" value="1">
                                <select id="rangeFromCal" class="range-cal-select" style="display:none;" onchange="onCalSelectChange()"></select>
                            </div>
                            <div>
                                <label id="rangeToLabel">To (season #)</label>
                                <input type="number" id="rangeTo" min="1" value="5">
                                <select id="rangeToCal" class="range-cal-select" style="display:none;" onchange="onCalSelectChange()"></select>
                            </div>
                        </div>
                        <div class="range-diff-row">
                            <input type="checkbox" id="rangeDiffP2" onchange="onRangeDiffToggle()">
                            <label for="rangeDiffP2" style="margin:0; display:inline; font-size:13px;">Use different range for Player 2</label>
                        </div>
                        <div class="range-inputs" id="rangeP2Fields" style="display:none; margin-top:10px;">
                            <div>
                                <label id="rangeFrom2Label">Player 2 From (season #)</label>
                                <input type="number" id="rangeFrom2" min="1" value="1">
                                <select id="rangeFrom2Cal" class="range-cal-select" style="display:none;" onchange="onCalSelectChange()"></select>
                            </div>
                            <div>
                                <label id="rangeTo2Label">Player 2 To (season #)</label>
                                <input type="number" id="rangeTo2" min="1" value="5">
                                <select id="rangeTo2Cal" class="range-cal-select" style="display:none;" onchange="onCalSelectChange()"></select>
                            </div>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label>Resolution / Format</label>
                        <select id="resolution">
                            <option value="1080p">1080p HD (1920x1080) - YouTube/Twitter</option>
                            <option value="720p">720p HD (1280x720) - Standard</option>
                            <option value="square" selected>Square (1080x1080) - Instagram Feed</option>
                            <option value="story">Story (1080x1920) - Instagram/TikTok</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label>Video Duration</label>
                        <select id="duration" disabled>
                            <option value="auto" selected>Automatic (based on content)</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label>Frame Rate</label>
                        <select id="framerate">
                            <option value="24">24 FPS - Cinematic</option>
                            <option value="30">30 FPS - Standard</option>
                            <option value="60" selected>60 FPS - Smooth</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label>Categories to Include</label>
                        <select id="sections">
                            <option value="all" selected>All Categories</option>
                            <option value="highlights">Highlights Only (Awards + Key Stats)</option>
                            <option value="awards">Awards & Accolades</option>
                            <option value="stats">Career Statistics</option>
                            <option value="playoff">Playoff Performance</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="settings-section" id="sectionFilterSection">
                <h3>Sections to Include <span style="font-weight:400;font-size:13px;color:#888;">(optional)</span></h3>
                <button type="button" class="section-load-btn" id="loadSectionsBtn" onclick="loadSectionFilterList()">Load sections for these players</button>
                <div id="sectionFilterList" class="section-filter-list"></div>
            </div>

            <button class="generate-btn" id="generateBtn" disabled>
                <span class="loading-spinner" id="loadingSpinner" style="display: none;"></span>
                <span id="btnText">Loading Data...</span>
            </button>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-label">
                <span id="progressText">Rendering video...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="preview-panel" id="previewPanel">
            <div class="preview-header">
                <h3>Video Preview</h3>
            </div>
            <canvas id="videoCanvas" width="1280" height="720"></canvas>
            <div class="button-group">
                <button class="download-btn" id="downloadMp4Btn">Download MP4</button>
                <button class="reset-btn" id="downloadBtn">Download WebM</button>
                <button class="reset-btn" id="resetBtn">Create Another</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // CONFIGURATION
        // ========================================

        const DATA_BASE_URL = 'https://jsierrahoopshype.github.io/nba-player-data/';

        // ========================================
        // GLOBAL STATE
        // ========================================

        let playerData = {};
        let allPlayers = [];
        let videoBlob = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let lastComparisonData = null;

        // ========================================
        // DATA LOADING
        // ========================================

        async function loadAllData() {
            try {
                showStatus('Loading NBA database...', 'info');
                document.getElementById('btnText').textContent = 'Loading Data...';

                const timestamp = Date.now();
                const cb = '?t=' + timestamp;

                const [awards, rsStats, poStats, allStar, salaries, nba2k, combine, comparisons, awardVotes, poSeries, sneakers] = await Promise.all([
                    fetch(DATA_BASE_URL + 'awards.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'rsStats.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'poStats.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'allStar.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'salaries.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'nba2k.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'combine-v3.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'comparisons.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'awardVotes.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'poSeries.json' + cb).then(r => r.json()),
                    fetch(DATA_BASE_URL + 'sneakers.json' + cb).then(r => r.json())
                ]);

                playerData = { awards, rsStats, poStats, allStar, salaries, nba2k, combine, comparisons, awardVotes, poSeries, sneakers };

                // Load player headshots lookup
                try {
                    var headshots = await fetch(DATA_BASE_URL + 'player-headshots.json' + cb).then(r => r.json());
                    playerData.headshots = headshots;
                } catch (e) {
                    console.warn('Could not load headshots:', e);
                    playerData.headshots = {};
                }

                // Load bio data (for Range Comparison mode) — graceful fallback
                try {
                    playerData.bio = await fetch(DATA_BASE_URL + 'bio.json' + cb).then(r => r.json());
                } catch (e) {
                    console.warn('Could not load bio:', e);
                    playerData.bio = [];
                }

                // Extract unique players from regular season stats
                const playerSet = new Set();
                rsStats.forEach(row => {
                    if (row.PLAYER) playerSet.add(row.PLAYER);
                });
                allPlayers = Array.from(playerSet).sort();

                // Force browser to load Google Fonts before canvas rendering
                document.body.insertAdjacentHTML('beforeend',
                    '<span style="font-family:\'Barlow Condensed\'; font-weight:900; position:absolute; opacity:0;">.</span>' +
                    '<span style="font-family:\'Barlow\'; font-weight:400; position:absolute; opacity:0;">.</span>'
                );
                await new Promise(function(r) { setTimeout(r, 500); });

                // Pre-fill with two random All-Stars
                var allStarNames = [];
                if (playerData.allStar) {
                    var starSet = new Set();
                    playerData.allStar.forEach(function(row) {
                        if (row.NAME && allPlayers.includes(row.NAME)) starSet.add(row.NAME);
                    });
                    allStarNames = Array.from(starSet);
                }
                if (allStarNames.length >= 2) {
                    var shuffled = allStarNames.sort(function() { return Math.random() - 0.5; });
                    document.getElementById('player1').value = shuffled[0];
                    document.getElementById('player2').value = shuffled[1];
                    populateSeasonDropdown(shuffled[0], '1');
                    populateSeasonDropdown(shuffled[1], '2');
                }

                showStatus('Database loaded! ' + allPlayers.length.toLocaleString() + ' players ready.', 'success');
                document.getElementById('btnText').textContent = 'Generate Video';
                document.getElementById('generateBtn').disabled = false;

            } catch (error) {
                showStatus('Error loading data: ' + error.message, 'error');
                document.getElementById('btnText').textContent = 'Error - Reload Page';
            }
        }

        // ========================================
        // AUTOCOMPLETE
        // ========================================

        function setupAutocomplete(inputId, suggestionsId) {
            const input = document.getElementById(inputId);
            const suggestions = document.getElementById(suggestionsId);

            input.addEventListener('input', function() {
                const value = this.value.toLowerCase();
                if (value.length < 2) {
                    suggestions.classList.remove('active');
                    return;
                }

                const matches = allPlayers
                    .filter(p => p.toLowerCase().includes(value))
                    .slice(0, 15);

                if (matches.length > 0) {
                    suggestions.innerHTML = matches.map(player =>
                        '<div class="suggestion-item" data-player="' + player + '">' + player + '</div>'
                    ).join('');
                    suggestions.classList.add('active');

                    suggestions.querySelectorAll('.suggestion-item').forEach(item => {
                        item.addEventListener('click', function() {
                            input.value = this.dataset.player;
                            suggestions.classList.remove('active');
                            // Populate season dropdown for this player
                            const playerNum = inputId === 'player1' ? '1' : '2';
                            populateSeasonDropdown(this.dataset.player, playerNum);
                            // Refresh calendar year dropdowns when a player is picked
                            if (document.getElementById('comparisonType').value === 'calendarRange') populateCalendarYears();
                        });
                    });
                } else {
                    suggestions.classList.remove('active');
                }
            });

            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !suggestions.contains(e.target)) {
                    suggestions.classList.remove('active');
                }
            });
        }

        // ========================================
        // HEADSHOT HELPER
        // ========================================

        function getHeadshotUrl(playerName) {
            if (playerData.headshots && playerData.headshots[playerName]) {
                return 'https://jsierrahoopshype.github.io/nba-headshots/players/headshots/face/' + playerData.headshots[playerName] + '.png';
            }
            return null;
        }

        // ========================================
        // SEASON DROPDOWN MANAGEMENT
        // ========================================

        function populateSeasonDropdown(playerName, playerNum) {
            const select = document.getElementById('season' + playerNum + 'Select');
            select.innerHTML = '<option value="">-- Choose Season --</option>';

            if (!playerName) {
                select.disabled = true;
                return;
            }

            // Get unique seasons for this player from rsStats
            const yearSet = new Set();
            playerData.rsStats.forEach(row => {
                if (row.PLAYER === playerName && row.YEAR) {
                    yearSet.add(row.YEAR);
                }
            });

            const years = Array.from(yearSet).sort((a, b) => {
                return parseInt(b) - parseInt(a); // Most recent first
            });

            if (years.length === 0) {
                select.disabled = true;
                return;
            }

            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = formatSeasonYear(year);
                select.appendChild(opt);
            });

            select.disabled = false;
            // Auto-select most recent season
            select.value = years[0];
        }

        function formatSeasonYear(year) {
            const endYear = parseInt(year);
            if (isNaN(endYear)) return year;
            return (endYear - 1) + '-' + String(endYear).slice(-2);
        }

        function parseNumericValue(value) {
            if (!value && value !== 0) return NaN;
            var strValue = String(value);
            // feet-inches format
            var feetInchesMatch = strValue.match(/(\d+)'\s*([\d.]+)['"]+/);
            if (feetInchesMatch) {
                return (parseFloat(feetInchesMatch[1]) * 12) + parseFloat(feetInchesMatch[2]);
            }
            return parseFloat(strValue.replace(/[\$,]/g, ''));
        }

        function deduplicateSeasonRows(playerRows) {
            var byYear = {};
            playerRows.forEach(function(row) {
                var year = row.YEAR || 'unknown';
                if (!byYear[year]) byYear[year] = [];
                byYear[year].push(row);
            });

            var deduplicated = [];
            for (var year in byYear) {
                var yearRows = byYear[year];
                if (yearRows.length === 1) {
                    deduplicated.push(yearRows[0]);
                } else {
                    var totRow = yearRows.find(function(r) {
                        return r.TEAM === 'TOT' || r.TM === 'TOT' || r.Team === 'TOT';
                    });
                    if (totRow) {
                        deduplicated.push(totRow);
                    } else {
                        var aggregated = Object.assign({}, yearRows[0]);
                        var numericColumns = ['GP', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TOV',
                                             'FGM', 'FGA', '3P', '3PA', 'FTM', 'FTA', 'MIN',
                                             'OREB', 'DREB', 'PF'];
                        numericColumns.forEach(function(col) { aggregated[col] = 0; });
                        yearRows.forEach(function(row) {
                            numericColumns.forEach(function(col) {
                                var val = parseFloat(row[col]);
                                if (!isNaN(val)) aggregated[col] = (aggregated[col] || 0) + val;
                            });
                        });
                        deduplicated.push(aggregated);
                    }
                }
            }
            return deduplicated;
        }

        function getRegularSeasonStat(playerName, metric) {
            var rawRows = playerData.rsStats.filter(function(row) { return row.PLAYER === playerName; });
            if (rawRows.length === 0) return null;
            var playerRows = deduplicateSeasonRows(rawRows);

            var peakPerGameMetrics = {
                'Points per game peak': 'PTS',
                'Rebounds per game peak': 'REB',
                'Assists per game peak': 'AST',
                'Steals per game peak': 'STL',
                'Blocks per game peak': 'BLK',
                'Turnovers per game peak': 'TOV'
            };

            var peakPctMetrics = {
                'Field Goal % peak': { made: 'FGM', att: 'FGA', minAtt: 200 },
                'Three Point % peak': { made: '3P', att: '3PA', minAtt: 50 },
                'Free Throw % peak': { made: 'FTM', att: 'FTA', minAtt: 50 }
            };

            var MIN_GAMES_FOR_PEAK = 20;
            var isSingleSeasonPlayer = playerRows.length === 1;

            if (peakPerGameMetrics[metric]) {
                var statColumn = peakPerGameMetrics[metric];
                var maxValue = -Infinity;
                playerRows.forEach(function(row) {
                    var stat = parseFloat(row[statColumn]);
                    var games = parseFloat(row['GP']);
                    var meetsGames = isSingleSeasonPlayer || (games >= MIN_GAMES_FOR_PEAK);
                    if (!isNaN(stat) && !isNaN(games) && games > 0 && meetsGames) {
                        var perGame = stat / games;
                        if (perGame > maxValue) maxValue = perGame;
                    }
                });
                return maxValue > -Infinity ? maxValue.toFixed(1) : null;
            }

            if (peakPctMetrics[metric]) {
                var pctInfo = peakPctMetrics[metric];
                var maxPct = -Infinity;
                playerRows.forEach(function(row) {
                    var made = parseFloat(row[pctInfo.made]);
                    var att = parseFloat(row[pctInfo.att]);
                    var games = parseFloat(row['GP']);
                    var meetsReq = isSingleSeasonPlayer ? (att > 0) :
                        (att >= pctInfo.minAtt && !isNaN(games) && games >= MIN_GAMES_FOR_PEAK);
                    if (!isNaN(made) && !isNaN(att) && meetsReq) {
                        var pct = (made / att) * 100;
                        if (pct > maxPct) maxPct = pct;
                    }
                });
                return maxPct > -Infinity ? maxPct.toFixed(1) + '%' : null;
            }

            // Per-game stats
            var perGameMap = {
                'Points per game': 'PTS',
                'Rebounds per game': 'REB',
                'Assists per game': 'AST',
                'Steals per game': 'STL',
                'Blocks per game': 'BLK',
                'Turnovers per game': 'TOV'
            };

            if (perGameMap[metric]) {
                var totalColumn = perGameMap[metric];
                var totalStat = 0, totalGames = 0;
                playerRows.forEach(function(row) {
                    var stat = parseFloat(row[totalColumn]);
                    var games = parseFloat(row['GP']);
                    if (!isNaN(stat) && !isNaN(games)) {
                        totalStat += stat;
                        totalGames += games;
                    }
                });
                return totalGames > 0 ? (totalStat / totalGames).toFixed(1) : null;
            }

            // Percentage stats
            var pctMap = {
                'Field Goal %': { made: 'FGM', att: 'FGA' },
                'Three Point %': { made: '3P', att: '3PA' },
                'Free Throw %': { made: 'FTM', att: 'FTA' }
            };

            if (pctMap[metric]) {
                var info = pctMap[metric];
                var totalMade = 0, totalAtt = 0;
                playerRows.forEach(function(row) {
                    var made = parseFloat(row[info.made]);
                    var att = parseFloat(row[info.att]);
                    if (!isNaN(made) && !isNaN(att)) {
                        totalMade += made;
                        totalAtt += att;
                    }
                });
                if (totalAtt > 0) return ((totalMade / totalAtt) * 100).toFixed(1) + '%';
                return null;
            }

            // Totals
            var totalMap = {
                'Games': 'GP', 'Points': 'PTS', 'Rebounds': 'REB',
                'Assists': 'AST', 'Steals': 'STL', 'Blocks': 'BLK', 'Turnovers': 'TOV'
            };

            if (totalMap[metric]) {
                var col = totalMap[metric];
                var total = 0;
                playerRows.forEach(function(row) {
                    var val = parseFloat(row[col]);
                    if (!isNaN(val)) total += val;
                });
                return total > 0 ? Math.round(total) : null;
            }

            return null;
        }

        function getSalaryStat(playerName, metric) {
            var playerRows = playerData.salaries.filter(function(row) { return row.PLAYER === playerName; });
            if (playerRows.length === 0) return null;

            var salariesByYear = {};
            playerRows.forEach(function(row) {
                var year = row.YEAR;
                var salary = parseFloat(String(row.SALARY || '').replace(/[$,]/g, ''));
                if (!isNaN(salary) && salary > 0 && year) {
                    if (!salariesByYear[year]) salariesByYear[year] = [];
                    salariesByYear[year].push(salary);
                }
            });

            var yearlyTotals = [];
            for (var year in salariesByYear) {
                yearlyTotals.push(salariesByYear[year].reduce(function(sum, val) { return sum + val; }, 0));
            }
            if (yearlyTotals.length === 0) return null;

            if (metric === 'Career earnings') {
                var total = yearlyTotals.reduce(function(sum, val) { return sum + val; }, 0);
                return '$' + Math.round(total).toLocaleString();
            }
            if (metric === 'Average salary') {
                var avg = yearlyTotals.reduce(function(sum, val) { return sum + val; }, 0) / yearlyTotals.length;
                return '$' + Math.round(avg).toLocaleString();
            }
            if (metric === 'Highest salary') {
                return '$' + Math.round(Math.max.apply(null, yearlyTotals)).toLocaleString();
            }
            if (metric === 'Lowest salary') {
                return '$' + Math.round(Math.min.apply(null, yearlyTotals)).toLocaleString();
            }
            return null;
        }

        function getPlayerStat(playerName, metric, dataSource) {
