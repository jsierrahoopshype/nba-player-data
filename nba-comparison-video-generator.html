            if (dataSource === 'Sneakers.csv') return getSneakerStat(playerName, metric);
            if (dataSource === 'NBA2K.csv') return get2KRating(playerName, metric);
            if (dataSource === 'All-Star.csv') return getAllStarContestWins(playerName, metric);
            return null;
        }

        // ========================================
        // CAREER COMPARISON (using comparisons.json)
        // ========================================

        function performCareerComparison(player1Name, player2Name, sectionFilter) {
            var player1Score = 0;
            var player2Score = 0;
            var sections = [];
            var currentSection = null;
            var currentSectionObj = null;

            var alwaysAwardSections = ['ACCOLADES', 'BEST AWARDS RANKING', 'YEARS RECEIVING VOTES', 'SIGNATURE SHOES', 'PLAYOFF SUCCESS'];
            var requireBothDataSections = ['SALARIES', 'NBA 2K'];
            var excludeFromOverall = ['DRAFT COMBINE'];

            playerData.comparisons.forEach(function(comp) {
                var category = comp['Comparison points'];
                var winCondition = comp['Who wins?'];
                var dataSource = comp['Wheres the data?'];

                // Section header
                if (!winCondition && !dataSource) {
                    currentSection = category;
                    if (currentSection === 'BEST VOTE RANKING') {
                        currentSectionObj = null;
                        return;
                    }
                    currentSectionObj = { name: category, items: [], sectionP1: 0, sectionP2: 0 };
                    sections.push(currentSectionObj);
                    return;
                }

                if (!currentSectionObj || !category) return;

                // Apply section filter
                if (sectionFilter && sectionFilter !== 'all') {
                    if (sectionFilter === 'awards' && currentSection !== 'ACCOLADES') return;
                    if (sectionFilter === 'stats' && !['NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK'].includes(currentSection)) return;
                    if (sectionFilter === 'playoff' && !['PLAYOFF SUCCESS'].includes(currentSection) && !category.includes('PO')) return;
                    if (sectionFilter === 'highlights' && !['ACCOLADES', 'NBA CAREER AVERAGES'].includes(currentSection)) return;
                }

                var p1Value = getPlayerStat(player1Name, category, dataSource);
                var p2Value = getPlayerStat(player2Name, category, dataSource);

                var winner = 'tie';
                var awardPoint = false;
                var alwaysAward = alwaysAwardSections.includes(currentSection);
                var requireBothData = requireBothDataSections.includes(currentSection) || excludeFromOverall.includes(currentSection);

                if (p1Value !== null && p2Value !== null) {
                    var p1Num = parseNumericValue(p1Value);
                    var p2Num = parseNumericValue(p2Value);

                    if (!isNaN(p1Num) && !isNaN(p2Num)) {
                        if (winCondition === 'Most') {
                            if (p1Num > p2Num) { winner = 'player1'; awardPoint = true; }
                            else if (p2Num > p1Num) { winner = 'player2'; awardPoint = true; }
                        } else if (winCondition === 'Least') {
                            if (p1Num < p2Num) { winner = 'player1'; awardPoint = true; }
                            else if (p2Num < p1Num) { winner = 'player2'; awardPoint = true; }
                        }

                        // Untracked stat check
                        if (awardPoint) {
                            var untrackedSections = ['NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK'];
                            var untrackedCategories = ['steals', 'steal', 'blocks', 'block', 'turnovers', 'turnover', 'three', '3p', 'stl', 'blk', 'tov'];
                            var inUntrackedSection = untrackedSections.some(function(s) {
                                return currentSection && currentSection.trim().toUpperCase() === s.toUpperCase();
                            });
                            var isUntrackedCategory = untrackedCategories.some(function(c) {
                                return category && category.toLowerCase().includes(c);
                            });

                            if (inUntrackedSection && isUntrackedCategory) {
                                var isZero = function(raw, num) {
                                    if (num === 0) return true;
                                    var s = String(raw).trim();
                                    return s === '0' || s === '0.0' || s === '0.00' || parseFloat(s) === 0;
                                };
                                if (isZero(p1Value, p1Num) || isZero(p2Value, p2Num)) {
                                    awardPoint = false;
                                    winner = 'tie';
                                }
                            }
                        }
                    }
                } else if (alwaysAward && !requireBothData) {
                    if (p1Value !== null && p2Value === null) {
                        var p1Num = parseNumericValue(p1Value);
                        if (!isNaN(p1Num) && p1Num > 0) { winner = 'player1'; awardPoint = true; }
                    } else if (p2Value !== null && p1Value === null) {
                        var p2Num = parseNumericValue(p2Value);
                        if (!isNaN(p2Num) && p2Num > 0) { winner = 'player2'; awardPoint = true; }
                    }
                }

                if (awardPoint) {
                    if (winner === 'player1') {
                        currentSectionObj.sectionP1++;
                        if (!excludeFromOverall.includes(currentSection)) player1Score++;
                    } else if (winner === 'player2') {
                        currentSectionObj.sectionP2++;
                        if (!excludeFromOverall.includes(currentSection)) player2Score++;
                    }
                }

                // Only add items that have data for at least one player
                if (p1Value !== null || p2Value !== null) {
                    // Filter out untracked stats where both are zero
                    var untrackedSections2 = ['NBA CAREER AVERAGES', 'NBA CAREER TOTALS', 'NBA SEASON PEAK'];
                    var untrackedCategories2 = ['steals', 'steal', 'blocks', 'block', 'turnovers', 'turnover', 'three', '3p', 'stl', 'blk', 'tov'];
                    var inUT = untrackedSections2.some(function(s) { return currentSection && currentSection.trim().toUpperCase() === s.toUpperCase(); });
                    var isUT = untrackedCategories2.some(function(c) { return category && category.toLowerCase().includes(c); });

                    var skipRow = false;
                    if (inUT && isUT) {
                        var isZ = function(val) {
                            if (val === null || val === undefined) return true;
                            var s = String(val).trim();
                            return s === '0' || s === '0.0' || s === '0.00' || parseFloat(s) === 0;
                        };
                        if (isZ(p1Value) && isZ(p2Value)) skipRow = true;
                    }

                    if (!skipRow) {
                        currentSectionObj.items.push({
                            metric: category,
                            p1Value: p1Value !== null ? String(p1Value) : '-',
                            p2Value: p2Value !== null ? String(p2Value) : '-',
                            winner: winner
                        });
                    }
                }
            });

            // Remove empty sections
            sections = sections.filter(function(s) { return s.items.length > 0; });

            return {
                player1Name: player1Name,
                player2Name: player2Name,
                player1Score: player1Score,
                player2Score: player2Score,
                sections: sections
            };
        }

        // ========================================
        // SEASON COMPARISON LOGIC
        // ========================================

        function getSeasonData(playerName, year, source) {
            var dataArr = source === 'po' ? playerData.poStats : playerData.rsStats;
            var rows = dataArr.filter(function(row) {
                return row.PLAYER === playerName && row.YEAR === year;
            });
            if (rows.length === 0) return null;

            // Handle traded players (TOT row preferred)
            if (rows.length > 1) {
                var totRow = rows.find(function(r) { return r.TEAM === 'TOT' || r.TM === 'TOT'; });
                if (totRow) return totRow;
                // Aggregate if no TOT
                var agg = Object.assign({}, rows[0]);
                var numCols = ['GP', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TOV', 'FGM', 'FGA', '3P', '3PA', 'FTM', 'FTA', 'MIN', 'OREB', 'DREB', 'PF'];
                numCols.forEach(function(col) { agg[col] = 0; });
                rows.forEach(function(row) {
                    numCols.forEach(function(col) {
                        var val = parseFloat(row[col]);
                        if (!isNaN(val)) agg[col] = (agg[col] || 0) + val;
                    });
                });
                return agg;
            }
            return rows[0];
        }

        function performSeasonComparison(player1Name, player2Name, season1, season2, sectionFilter) {
            var player1Score = 0;
            var player2Score = 0;
            var sections = [];

            var rs1 = getSeasonData(player1Name, season1, 'rs');
            var rs2 = getSeasonData(player2Name, season2, 'rs');
            var po1 = getSeasonData(player1Name, season1, 'po');
            var po2 = getSeasonData(player2Name, season2, 'po');

            var gp1 = rs1 ? parseFloat(rs1.GP) : 0;
            var gp2 = rs2 ? parseFloat(rs2.GP) : 0;
            var gpPO1 = po1 ? parseFloat(po1.GP) : 0;
            var gpPO2 = po2 ? parseFloat(po2.GP) : 0;

            // Define season comparison categories
            var seasonConfig = [
                {
                    category: 'COUNTING STATS: AVERAGES',
                    filterKey: 'averages',
                    metrics: [
                        { name: 'Points', col: 'PTS', src: 'rs', higher: true, pg: true },
                        { name: 'Rebounds', col: 'REB', src: 'rs', higher: true, pg: true },
                        { name: 'Assists', col: 'AST', src: 'rs', higher: true, pg: true },
                        { name: 'Steals', col: 'STL', src: 'rs', higher: true, pg: true },
                        { name: 'Blocks', col: 'BLK', src: 'rs', higher: true, pg: true },
                        { name: 'Field Goal %', col: 'calc_fg_pct', src: 'rs', higher: true, pct: true },
                        { name: 'Three Point %', col: 'calc_3p_pct', src: 'rs', higher: true, pct: true },
                        { name: 'Free Throw %', col: 'calc_ft_pct', src: 'rs', higher: true, pct: true },
                        { name: 'Turnovers', col: 'TOV', src: 'rs', higher: false, pg: true },
                        { name: 'Points PO', col: 'PTS', src: 'po', higher: true, pg: true },
                        { name: 'Rebounds PO', col: 'REB', src: 'po', higher: true, pg: true },
                        { name: 'Assists PO', col: 'AST', src: 'po', higher: true, pg: true },
                        { name: 'Steals PO', col: 'STL', src: 'po', higher: true, pg: true },
                        { name: 'Blocks PO', col: 'BLK', src: 'po', higher: true, pg: true },
                        { name: 'Field Goal % PO', col: 'calc_fg_pct', src: 'po', higher: true, pct: true },
                        { name: 'Three Point % PO', col: 'calc_3p_pct', src: 'po', higher: true, pct: true },
                        { name: 'Free Throw % PO', col: 'calc_ft_pct', src: 'po', higher: true, pct: true },
                        { name: 'Turnovers PO', col: 'TOV', src: 'po', higher: false, pg: true }
                    ]
                },
                {
                    category: 'COUNTING STATS: TOTALS',
                    filterKey: 'totals',
                    metrics: [
                        { name: 'Games Played', col: 'GP', src: 'rs', higher: true },
                        { name: 'Points', col: 'PTS', src: 'rs', higher: true },
                        { name: 'Rebounds', col: 'REB', src: 'rs', higher: true },
                        { name: 'Assists', col: 'AST', src: 'rs', higher: true },
                        { name: 'Steals', col: 'STL', src: 'rs', higher: true },
                        { name: 'Blocks', col: 'BLK', src: 'rs', higher: true },
                        { name: 'Turnovers', col: 'TOV', src: 'rs', higher: false },
                        { name: 'Games Played PO', col: 'GP', src: 'po', higher: true },
                        { name: 'Points PO', col: 'PTS', src: 'po', higher: true },
                        { name: 'Rebounds PO', col: 'REB', src: 'po', higher: true },
                        { name: 'Assists PO', col: 'AST', src: 'po', higher: true },
                        { name: 'Steals PO', col: 'STL', src: 'po', higher: true },
                        { name: 'Blocks PO', col: 'BLK', src: 'po', higher: true },
                        { name: 'Turnovers PO', col: 'TOV', src: 'po', higher: false }
                    ]
                },
                {
                    category: 'SHOOTING EFFICIENCY',
                    filterKey: 'shooting',
                    metrics: [
                        { name: 'Field Goals Made', col: 'FGM', src: 'rs', higher: true },
                        { name: 'Field Goals Attempted', col: 'FGA', src: 'rs', higher: true },
                        { name: 'Three Pointers Made', col: '3P', src: 'rs', higher: true },
                        { name: 'Three Pointers Attempted', col: '3PA', src: 'rs', higher: true },
                        { name: 'Free Throws Made', col: 'FTM', src: 'rs', higher: true },
                        { name: 'Free Throws Attempted', col: 'FTA', src: 'rs', higher: true }
                    ]
                }
            ];

            function getSeasonStatValue(data, gp, metric) {
                if (!data) return null;

                // Calculated percentages
                if (metric.col === 'calc_fg_pct') {
                    var m = parseFloat(data.FGM), a = parseFloat(data.FGA);
                    if (!isNaN(m) && !isNaN(a) && a > 0) return ((m / a) * 100).toFixed(1) + '%';
                    return null;
                }
                if (metric.col === 'calc_3p_pct') {
                    var m = parseFloat(data['3P']), a = parseFloat(data['3PA']);
                    if (!isNaN(m) && !isNaN(a) && a > 0) return ((m / a) * 100).toFixed(1) + '%';
                    return null;
                }
                if (metric.col === 'calc_ft_pct') {
                    var m = parseFloat(data.FTM), a = parseFloat(data.FTA);
                    if (!isNaN(m) && !isNaN(a) && a > 0) return ((m / a) * 100).toFixed(1) + '%';
                    return null;
                }

                var val = parseFloat(data[metric.col]);
                if (isNaN(val)) return null;

                if (metric.pg && gp > 0) {
                    return (val / gp).toFixed(1);
                }

                return metric.pct ? val.toFixed(1) + '%' : Math.round(val);
            }

            seasonConfig.forEach(function(cat) {
                // Apply filter
                if (sectionFilter && sectionFilter !== 'all') {
                    if (sectionFilter !== cat.filterKey) return;
                }

                var sectionObj = { name: cat.category, items: [], sectionP1: 0, sectionP2: 0 };

                cat.metrics.forEach(function(metric) {
                    var data1 = metric.src === 'po' ? po1 : rs1;
                    var data2 = metric.src === 'po' ? po2 : rs2;
                    var g1 = metric.src === 'po' ? gpPO1 : gp1;
                    var g2 = metric.src === 'po' ? gpPO2 : gp2;

                    var v1 = getSeasonStatValue(data1, g1, metric);
                    var v2 = getSeasonStatValue(data2, g2, metric);

                    if (v1 === null && v2 === null) return;

                    var winner = 'tie';
                    var n1 = parseNumericValue(v1);
                    var n2 = parseNumericValue(v2);

                    if (!isNaN(n1) && !isNaN(n2)) {
                        if (metric.higher) {
                            if (n1 > n2) winner = 'player1';
                            else if (n2 > n1) winner = 'player2';
                        } else {
                            if (n1 < n2) winner = 'player1';
                            else if (n2 < n1) winner = 'player2';
                        }
                    }

                    if (winner === 'player1') { sectionObj.sectionP1++; player1Score++; }
                    if (winner === 'player2') { sectionObj.sectionP2++; player2Score++; }

                    sectionObj.items.push({
                        metric: metric.name,
                        p1Value: v1 !== null ? String(v1) : '-',
                        p2Value: v2 !== null ? String(v2) : '-',
                        winner: winner
                    });
                });

                if (sectionObj.items.length > 0) sections.push(sectionObj);
            });

            return {
                player1Name: player1Name + ' (' + formatSeasonYear(season1) + ')',
                player2Name: player2Name + ' (' + formatSeasonYear(season2) + ')',
                player1Score: player1Score,
                player2Score: player2Score,
                sections: sections
            };
        }

        // ========================================
        // RANGE COMPARISON LOGIC (additive)
        // Mirrors the Range Comparison built into nba-player-comparison-tool.html:
        // it filters each player's data to a span of seasons (Season Range) or
        // ages (Age Range), swaps the filtered copies into playerData, and reuses
        // the unchanged performCareerComparison() engine. Restored in a finally.
        // ========================================

        // Distinct YEARs (ascending) a player has regular-season rows for.
        function getPlayerSeasonYears(playerName) {
            var rawRows = playerData.rsStats.filter(function(row) { return row.PLAYER === playerName; });
            var dedup = deduplicateSeasonRows(rawRows);
            var years = [];
            var seen = {};
            dedup.forEach(function(r) {
                var y = parseInt(r.YEAR, 10);
                if (!isNaN(y) && !seen[y]) { seen[y] = true; years.push(y); }
            });
            years.sort(function(a, b) { return a - b; });
            return years;
        }

        function parseBioBirthday(str) {
            if (!str) return null;
            var parts = String(str).split('/');
            if (parts.length !== 3) return null;
            var m = parseInt(parts[0], 10), d = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
            if (isNaN(m) || isNaN(d) || isNaN(y)) return null;
            return { month: m, day: d, year: y };
        }

        // Age on February 1 of the season's ending year.
        function ageAsOfFeb1(bd, seasonYear) {
            var age = seasonYear - bd.year;
            if (bd.month > 2 || (bd.month === 2 && bd.day > 1)) age -= 1;
            return age;
        }

        // Calendar years that fall within the requested range for this player.
        // mode: 'seasonRange' (season 1 = earliest year) | 'ageRange' (age via bio BIRTHDAY).
        function getRangeYears(playerName, mode, from, to) {
            var years = getPlayerSeasonYears(playerName);
            var result = [];
            if (mode === 'calendarRange') {
                // Calendar Range: the year itself is the filter — every year from..to inclusive.
                for (var cy = from; cy <= to; cy++) result.push(cy);
                return result;
            }
            if (mode === 'ageRange') {
                var bio = (playerData.bio || []).find(function(r) { return r.PLAYER === playerName; });
                var bd = bio ? parseBioBirthday(bio.BIRTHDAY) : null;
                if (!bd) return result;
                years.forEach(function(y) {
                    var age = ageAsOfFeb1(bd, y);
                    if (age >= from && age <= to) result.push(y);
                });
            } else {
                years.forEach(function(y, idx) {
                    var seasonNum = idx + 1;
                    if (seasonNum >= from && seasonNum <= to) result.push(y);
                });
            }
            return result;
        }

        function rangeLabelText(mode, from, to) {
            if (mode === 'calendarRange') return from + '-' + to;
            return (mode === 'ageRange' ? 'Ages ' : 'Seasons ') + from + '-' + to;
        }

        // comparisons list with DRAFT COMBINE, SIGNATURE SHOES and All-Star contest
        // entries removed (the rest of the section exclusions, e.g. BEST VOTE RANKING,
        // are already handled inside performCareerComparison).
        function buildRangeComparisons() {
            var excludeSections = ['DRAFT COMBINE', 'SIGNATURE SHOES'];
            var out = [];
            var skip = false;
            playerData.comparisons.forEach(function(comp) {
                var cat = comp['Comparison points'];
                var isHeader = !comp['Who wins?'] && !comp['Wheres the data?'];
                if (isHeader) {
                    skip = excludeSections.indexOf(cat) !== -1;
                    if (!skip) out.push(comp);
                } else if (!skip) {
                    if (comp['Wheres the data?'] === 'All-Star.csv') return;
                    out.push(comp);
                }
            });
            return out;
        }

        // Shallow copy of a player's NBA 2K row with out-of-range editions blanked.
        // 2K editions map to years: 2K16 -> 2016. yearsSet is a {year:true} map.
        function build2KRangeClone(playerName, yearsSet) {
            var row = playerData.nba2k.find(function(r) {
                return r['Full Name'] === playerName ||
                    (r['First Name'] + ' ' + r['Last Name']) === playerName;
            });
            if (!row) return null;
            var clone = {};
            for (var k in row) clone[k] = row[k];
            Object.keys(clone).forEach(function(key) {
                if (key.indexOf('2K') === 0 || key.indexOf('2k') === 0) {
                    var yy = parseInt(key.substring(2), 10);
                    if (isNaN(yy)) return;
                    if (!yearsSet[2000 + yy]) clone[key] = '';
                }
            });
            return clone;
        }

        // Validate the range inputs; throws (with a user-facing message) on any problem,
        // including a player having no seasons in the selected range. Returns the params.
        function validateRangeInputs(player1, player2) {
            var mode = document.getElementById('comparisonType').value; // seasonRange | ageRange
            var useDiff = document.getElementById('rangeDiffP2').checked;
            var from1 = parseInt(document.getElementById('rangeFrom').value, 10);
            var to1 = parseInt(document.getElementById('rangeTo').value, 10);
            var from2 = useDiff ? parseInt(document.getElementById('rangeFrom2').value, 10) : from1;
            var to2 = useDiff ? parseInt(document.getElementById('rangeTo2').value, 10) : to1;

            if ([from1, to1, from2, to2].some(function(v) { return isNaN(v); })) {
                throw new Error('Please enter From and To values for the range.');
            }
            if (from1 > to1 || from2 > to2) {
                throw new Error('Range "From" must be less than or equal to "To".');
            }
            if (getRangeYears(player1, mode, from1, to1).length === 0) {
                throw new Error(player1 + ' has no seasons in the selected range (' + rangeLabelText(mode, from1, to1) + ').');
            }
            if (getRangeYears(player2, mode, from2, to2).length === 0) {
                throw new Error(player2 + ' has no seasons in the selected range (' + rangeLabelText(mode, from2, to2) + ').');
            }
            return { mode: mode, from1: from1, to1: to1, from2: from2, to2: to2 };
        }

        function performRangeComparison(p1, p2, mode, from1, to1, from2, to2) {
            var sectionFilter = document.getElementById('sections').value;

            var set1 = {}, set2 = {};
            getRangeYears(p1, mode, from1, to1).forEach(function(y) { set1[y] = true; });
            getRangeYears(p2, mode, from2, to2).forEach(function(y) { set2[y] = true; });

            function yr(v) { return parseInt(v, 10); }
            function keepRow(player, year) {
                return (player === p1 && set1[yr(year)]) || (player === p2 && set2[yr(year)]);
            }

            var filteredRs = playerData.rsStats.filter(function(r) { return keepRow(r.PLAYER, r.YEAR); });
            var filteredPo = playerData.poStats.filter(function(r) { return keepRow(r.PLAYER, r.YEAR); });
            var filteredAwards = playerData.awards.filter(function(r) { return keepRow(r['PLAYER / COACH'], r.YEAR); });
            var filteredVotes = playerData.awardVotes.filter(function(r) { return keepRow(r.PLAYER, r.YEAR); });
            var filteredSalaries = playerData.salaries.filter(function(r) { return keepRow(r.PLAYER, r.YEAR); });
            var filtered2K = [];
            var c1 = build2KRangeClone(p1, set1); if (c1) filtered2K.push(c1);
            var c2 = build2KRangeClone(p2, set2); if (c2) filtered2K.push(c2);
            var filteredComparisons = buildRangeComparisons();

            var orig = {
                rsStats: playerData.rsStats, poStats: playerData.poStats, awards: playerData.awards,
                awardVotes: playerData.awardVotes, salaries: playerData.salaries, nba2k: playerData.nba2k,
                comparisons: playerData.comparisons
            };

            var result;
            try {
                playerData.rsStats = filteredRs;
                playerData.poStats = filteredPo;
                playerData.awards = filteredAwards;
                playerData.awardVotes = filteredVotes;
                playerData.salaries = filteredSalaries;
                playerData.nba2k = filtered2K;
                playerData.comparisons = filteredComparisons;
                result = performCareerComparison(p1, p2, sectionFilter);
            } finally {
                playerData.rsStats = orig.rsStats;
                playerData.poStats = orig.poStats;
                playerData.awards = orig.awards;
                playerData.awardVotes = orig.awardVotes;
                playerData.salaries = orig.salaries;
                playerData.nba2k = orig.nba2k;
                playerData.comparisons = orig.comparisons;
            }

            // Append the range to the names so the header + final card show it
            // (same pattern as season mode's "(2008-09)" suffix).
            result.player1Name = p1 + ' (' + rangeLabelText(mode, from1, to1) + ')';
            result.player2Name = p2 + ' (' + rangeLabelText(mode, from2, to2) + ')';
            return result;
        }

        // Show/hide the range settings row and relabel inputs for the active mode.
        function updateRangeUI() {
            var type = document.getElementById('comparisonType').value;
            var isRange = (type === 'seasonRange' || type === 'ageRange' || type === 'calendarRange');
            document.getElementById('rangeSettingsGroup').classList.toggle('active', isRange);
            if (isRange) {
                var unit = type === 'ageRange' ? 'age' : (type === 'calendarRange' ? 'year' : 'season #');
                document.getElementById('rangeFromLabel').textContent = 'From (' + unit + ')';
                document.getElementById('rangeToLabel').textContent = 'To (' + unit + ')';
                document.getElementById('rangeFrom2Label').textContent = 'Player 2 From (' + unit + ')';
                document.getElementById('rangeTo2Label').textContent = 'Player 2 To (' + unit + ')';
            }

            // Calendar mode uses year dropdowns (populated from the players); other modes
            // keep their free number inputs. Only the input UI swaps — validateRangeInputs
            // still reads the same rangeFrom/rangeTo (kept mirrored from the selects).
            var isCal = type === 'calendarRange';
            [['rangeFrom', 'rangeFromCal'], ['rangeTo', 'rangeToCal'],
             ['rangeFrom2', 'rangeFrom2Cal'], ['rangeTo2', 'rangeTo2Cal']].forEach(function(pair) {
                var ie = document.getElementById(pair[0]);
                var se = document.getElementById(pair[1]);
                if (ie) ie.style.display = isCal ? 'none' : '';
                if (se) se.style.display = isCal ? '' : 'none';
            });
            if (isCal) populateCalendarYears();
        }

        // Format an NBA ending-year as a full season label, e.g. 2018 -> "2017-18".
        function formatSeasonLabel(y) {
            var yr = parseInt(y, 10);
            if (isNaN(yr)) return String(y);
            return (yr - 1) + '-' + String(yr).slice(-2);
        }

        // Distinct rsStats YEARs (ascending, as strings) across the given players.
        function getUnionYears(names) {
            var set = {};
            names.forEach(function(n) {
                getPlayerSeasonYears(n).forEach(function(y) { set[y] = true; });
            });
            return Object.keys(set).sort(function(a, b) { return parseInt(a, 10) - parseInt(b, 10); });
        }

        // Fill one year <select>, preserving the paired number input's value if still valid
        // (else default to min/max), then mirror the choice back into the number input.
        function populateOneYearSelect(selId, inpId, years, defaultLast) {
            var sel = document.getElementById(selId);
            var inp = document.getElementById(inpId);
            if (!sel || !inp) return;
            if (!years.length) { sel.innerHTML = ''; sel.disabled = true; return; }
            sel.disabled = false;
            sel.innerHTML = years.map(function(y) {
                return '<option value="' + y + '">' + formatSeasonLabel(y) + '</option>';
            }).join('');
            var cur = String(inp.value);
            sel.value = years.indexOf(cur) !== -1 ? cur : (defaultLast ? years[years.length - 1] : years[0]);
            inp.value = sel.value;
        }

        // Populate the four calendar year dropdowns from the selected players' careers.
        function populateCalendarYears() {
            var p1 = document.getElementById('player1').value.trim();
            var p2 = document.getElementById('player2').value.trim();
            var union = getUnionYears([p1, p2].filter(Boolean));
            var p2years = p2 ? getUnionYears([p2]) : union;
            populateOneYearSelect('rangeFromCal', 'rangeFrom', union, false);
            populateOneYearSelect('rangeToCal', 'rangeTo', union, true);
            populateOneYearSelect('rangeFrom2Cal', 'rangeFrom2', p2years, false);
            populateOneYearSelect('rangeTo2Cal', 'rangeTo2', p2years, true);
        }

        // Mirror the calendar dropdown selections into the number inputs validateRangeInputs reads.
        function onCalSelectChange() {
            [['rangeFromCal', 'rangeFrom'], ['rangeToCal', 'rangeTo'],
             ['rangeFrom2Cal', 'rangeFrom2'], ['rangeTo2Cal', 'rangeTo2']].forEach(function(pair) {
                var se = document.getElementById(pair[0]);
                var ie = document.getElementById(pair[1]);
                if (se && ie && se.value) ie.value = se.value;
            });
        }

        function onRangeDiffToggle() {
            var checked = document.getElementById('rangeDiffP2').checked;
            document.getElementById('rangeP2Fields').style.display = checked ? 'flex' : 'none';
        }

        // Wire the range-row toggle without touching the existing change handler.
        window.addEventListener('DOMContentLoaded', function() {
            var ct = document.getElementById('comparisonType');
            if (ct) ct.addEventListener('change', updateRangeUI);
        });

        // ========================================
        // UNIFIED COMPARISON DISPATCHER
        // ========================================

        function performComparison(player1, player2) {
            var compType = document.getElementById('comparisonType').value;
            var sectionFilter = document.getElementById('sections').value;

            if (compType === 'season') {
                var season1 = document.getElementById('season1Select').value;
                var season2 = document.getElementById('season2Select').value;
                return performSeasonComparison(player1, player2, season1, season2, sectionFilter);
            } else if (compType === 'seasonRange' || compType === 'ageRange' || compType === 'calendarRange') {
                var rp = validateRangeInputs(player1, player2); // throws -> caught by generateVideo, aborts before recording
                return performRangeComparison(player1, player2, rp.mode, rp.from1, rp.to1, rp.from2, rp.to2);
            } else {
                return performCareerComparison(player1, player2, sectionFilter);
            }
        }

        // ========================================
        // CANVAS RENDERING ENGINE
        // ========================================

        // Pre-calculate all content layout
        // Canvas helper: rounded rectangle
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function buildContentLayout(comparisonData, width, height) {
            var layout = [];
            var y = 0;
            var SECTION_HEADER_HEIGHT = 80;
            var ITEM_ROW_HEIGHT = 52;
            var ITEM_GAP = 6;
            var SECTION_GAP = 36;

            comparisonData.sections.forEach(function(section) {
                layout.push({
                    type: 'sectionHeader', y: y, text: section.name,
                    sectionP1: section.sectionP1, sectionP2: section.sectionP2,
                    p1Name: comparisonData.player1Name, p2Name: comparisonData.player2Name
                });
                y += SECTION_HEADER_HEIGHT;

                section.items.forEach(function(item) {
                    layout.push({
                        type: 'item', y: y,
                        metric: item.metric,
                        p1Value: item.p1Value, p2Value: item.p2Value,
                        winner: item.winner,
                        p1Name: comparisonData.player1Name, p2Name: comparisonData.player2Name
                    });
                    y += ITEM_ROW_HEIGHT + ITEM_GAP;
                });

                y += SECTION_GAP;
            });

            return { items: layout, totalHeight: y };
        }

        // Global font scale multiplier (1.3 = 30% larger across all drawing)
        var FS = 1.3;

        // Font families (Barlow Condensed for headings/scores, Barlow for body)
        var FF_HEAD = '"Barlow Condensed", "Arial Narrow", Arial, sans-serif';
        var FF_MONO = '"Barlow Condensed", "Courier New", monospace';
        var FF_BODY = '"Barlow", Arial, sans-serif';

        // --- Colors from comparison tool CSS variables ---
        var C = {
            bg: '#f5f5f7', surface: '#ffffff', border: '#d1d1d6',
            text: '#1d1d1f', textSec: '#6e6e73', accent: '#3b82f6',
            green: '#34c759', greenDim: 'rgba(52, 199, 89, 0.15)',
            orange: '#f59e0b', orangeDim: 'rgba(245, 158, 11, 0.15)'
        };

        // Range comparisons carry a "(Seasons X-Y)" / "(Ages X-Y)" suffix in the
        // player names (used by the comparison logic). Strip it for on-screen display
        // so the video stays clean and the final-card trophy doesn't overlap.
        function stripRangeSuffix(name) {
            return String(name).replace(/\s*\((Seasons|Ages)[^)]*\)$/, '');
        }

        function drawHeader(ctx, data, width, p1Score, p2Score, p1Img, p2Img) {
            // Display names without the range suffix (local copy only; does not mutate caller data)
            data = Object.assign({}, data, {
                player1Name: stripRangeSuffix(data.player1Name),
                player2Name: stripRangeSuffix(data.player2Name)
            });
            var HEADER_H = 140;
            var S = width / 1280;
            // White background behind header card
            ctx.fillStyle = C.bg;
            ctx.fillRect(0, 0, width, HEADER_H);

            var pad = Math.round(width * 0.04);
            var cardX = pad, cardY = 10;
            var cardW = width - pad * 2, cardH = HEADER_H - 20;
            var r = 12;

            // Card shadow
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.06)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 2;
            roundRect(ctx, cardX, cardY, cardW, cardH, r);
            ctx.fillStyle = C.surface;
            ctx.fill();
            ctx.restore();

            // Card border
            roundRect(ctx, cardX, cardY, cardW, cardH, r);
            ctx.strokeStyle = C.border;
            ctx.lineWidth = 1;
            ctx.stroke();

            var midX = width / 2;
            var centerY = cardY + cardH / 2;

            // Player 1 headshot (circle-clipped, left side)
            var hsD = Math.round(70 * S);
            var hsR = hsD / 2;
            if (p1Img) {
                var p1cx = cardX + Math.round(20 * S) + hsR;
                var p1cy = centerY;
                ctx.save();
                ctx.beginPath();
                ctx.arc(p1cx, p1cy, hsR, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(p1Img, p1cx - hsR, p1cy - hsR, hsD, hsD);
                ctx.restore();
            }

            // Player 2 headshot (circle-clipped, right side)
            if (p2Img) {
                var p2cx = cardX + cardW - Math.round(20 * S) - hsR;
                var p2cy = centerY;
                ctx.save();
                ctx.beginPath();
                ctx.arc(p2cx, p2cy, hsR, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(p2Img, p2cx - hsR, p2cy - hsR, hsD, hsD);
                ctx.restore();
            }

            // Player 1 name (left)
            var nameSize = Math.round(Math.min(24, width * 0.019) * FS);
            ctx.font = '700 ' + nameSize + 'px ' + FF_HEAD;
            ctx.fillStyle = C.text;
            ctx.textAlign = 'center';
            ctx.fillText(data.player1Name, midX - cardW * 0.25, centerY - 16);

            // Player 1 score
            var scoreSize = Math.round(Math.min(48, width * 0.037) * FS);
            var p1Won = p1Score > p2Score;
            var p2Won = p2Score > p1Score;
            ctx.font = '900 ' + scoreSize + 'px ' + FF_HEAD;
            ctx.fillStyle = p1Won ? C.green : C.accent;
            ctx.fillText(String(Math.round(p1Score)), midX - cardW * 0.25, centerY + 30);

            // Divider
            ctx.font = '400 ' + Math.round(Math.min(30, width * 0.023) * FS) + 'px ' + FF_HEAD;
            ctx.fillStyle = C.textSec;
            ctx.textAlign = 'center';
            ctx.fillText('\u2013', midX, centerY + 8);

            // Player 2 name (right)
            ctx.font = '700 ' + nameSize + 'px ' + FF_HEAD;
            ctx.fillStyle = C.text;
            ctx.fillText(data.player2Name, midX + cardW * 0.25, centerY - 16);

            // Player 2 score
            ctx.font = '900 ' + scoreSize + 'px ' + FF_HEAD;
            ctx.fillStyle = p2Won ? C.green : C.accent;
            ctx.fillText(String(Math.round(p2Score)), midX + cardW * 0.25, centerY + 30);
        }

        function drawScrollingContent(ctx, contentLayout, width, height, scrollY, itemRevealSchedule, currentFrame) {
            var HEADER_HEIGHT = 140;
            var contentAreaTop = HEADER_HEIGHT;
            var contentAreaHeight = height - HEADER_HEIGHT;

            ctx.fillStyle = C.bg;
            ctx.fillRect(0, contentAreaTop, width, contentAreaHeight);

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, contentAreaTop, width, contentAreaHeight);
            ctx.clip();

            var pad = Math.round(width * 0.04);
            var rowW = width - pad * 2;
            var fr = rowW / 11;
            var col1W = fr * 2;
            var col2W = fr * 3;
            var col3W = fr * 1;
            var col4W = fr * 3;
            var col5W = fr * 2;
            var col1X = pad;
            var col2X = pad + col1W;
            var col3X = pad + col1W + col2W;
            var col4X = pad + col1W + col2W + col3W;
            var col5X = pad + col1W + col2W + col3W + col4W;

            for (var idx = 0; idx < contentLayout.items.length; idx++) {
                var item = contentLayout.items[idx];
                var drawY = contentAreaTop + item.y - scrollY;

                if (drawY < contentAreaTop - 90 || drawY > height + 20) continue;

                if (item.type === 'sectionHeader') {
                    ctx.fillStyle = C.bg;
                    ctx.fillRect(pad, drawY, rowW, 80);

                    var titleSize = Math.round(Math.min(22, width * 0.017) * FS * 1.15);
                    ctx.font = '700 ' + titleSize + 'px ' + FF_HEAD;
                    ctx.fillStyle = C.text;
                    ctx.textAlign = 'left';
                    ctx.fillText(item.text, pad + 4, drawY + 32);

                    ctx.fillStyle = C.accent;
                    ctx.fillRect(pad, drawY + 52, rowW, 2);

                    if (item.sectionP1 > 0 || item.sectionP2 > 0) {
                        var subSize = Math.round(Math.min(15, width * 0.012) * FS * 1.15);
                        ctx.font = '400 ' + subSize + 'px ' + FF_HEAD;
                        ctx.fillStyle = C.textSec;
                        ctx.textAlign = 'left';
                        ctx.fillText(
                            stripRangeSuffix(item.p1Name) + ' ' + item.sectionP1 + '  \u2013  ' + stripRangeSuffix(item.p2Name) + ' ' + item.sectionP2,
                            pad + 4, drawY + 72
                        );
                    }

                } else if (item.type === 'item') {
                    var ROW_H = 52;
                    var RAD = 8;

                    // Schedule-based reveal (-2 = always settled tie, -1 = non-item, >= 0 = reveal frame)
                    var schedFrame = itemRevealSchedule[idx];
                    var age = (schedFrame === -2) ? 999 : ((schedFrame === -1 || currentFrame < schedFrame) ? -1 : (currentFrame - schedFrame));
                    var settled = age >= 8;

                    var isP1Win = settled && item.winner === 'player1';
                    var isP2Win = settled && item.winner === 'player2';
                    var isTie = settled && item.winner === 'tie' && item.p1Value !== '-' && item.p2Value !== '-';

                    // Card background
                    ctx.save();
                    roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                    ctx.fillStyle = C.surface;
                    ctx.fill();

                    // Tint boundaries
                    var tintLeftEnd = width * 0.42;
                    var tintRightStart = width * 0.58;
                    var tintLeftW = tintLeftEnd - pad;
                    var tintRightW = pad + rowW - tintRightStart;

                    // Flash overlay (age 0-7): winner's half only
                    if (age >= 0 && age < 8) {
                        ctx.save();
                        roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                        ctx.clip();
                        if (item.winner === 'player1') {
                            ctx.fillStyle = 'rgba(227,24,55,0.2)';
                            ctx.fillRect(pad, drawY, tintLeftW, ROW_H);
                        } else if (item.winner === 'player2') {
                            ctx.fillStyle = 'rgba(227,24,55,0.2)';
                            ctx.fillRect(tintRightStart, drawY, tintRightW, ROW_H);
                        } else {
                            ctx.fillStyle = 'rgba(245,158,11,0.15)';
                            ctx.fillRect(pad, drawY, tintLeftW, ROW_H);
                            ctx.fillRect(tintRightStart, drawY, tintRightW, ROW_H);
                        }
                        ctx.restore();
                    }

                    // Settled tints (age >= 8)
                    if (isP1Win) {
                        ctx.save();
                        roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                        ctx.clip();
                        ctx.fillStyle = C.greenDim;
                        ctx.fillRect(pad, drawY, tintLeftW, ROW_H);
                        ctx.restore();
                    } else if (isP2Win) {
                        ctx.save();
                        roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                        ctx.clip();
                        ctx.fillStyle = C.greenDim;
                        ctx.fillRect(tintRightStart, drawY, tintRightW, ROW_H);
                        ctx.restore();
                    } else if (isTie) {
                        ctx.save();
                        roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                        ctx.clip();
                        ctx.fillStyle = C.orangeDim;
                        ctx.fillRect(pad, drawY, tintLeftW, ROW_H);
                        ctx.fillRect(tintRightStart, drawY, tintRightW, ROW_H);
                        ctx.restore();
                    }

                    // Card border
                    roundRect(ctx, pad, drawY, rowW, ROW_H, RAD);
                    ctx.strokeStyle = C.border;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Winner accent borders (only if settled)
                    if (isP1Win) {
                        ctx.fillStyle = C.green;
                        ctx.fillRect(pad, drawY + 4, 3, ROW_H - 8);
                    } else if (isP2Win) {
                        ctx.fillStyle = C.green;
                        ctx.fillRect(pad + rowW - 3, drawY + 4, 3, ROW_H - 8);
                    } else if (isTie) {
                        ctx.fillStyle = C.orange;
                        ctx.fillRect(pad, drawY + 4, 3, ROW_H - 8);
                        ctx.fillRect(pad + rowW - 3, drawY + 4, 3, ROW_H - 8);
                    }

                    ctx.restore();

                    var textY = drawY + ROW_H / 2 + 5;
                    var valSize = Math.round(Math.min(18, width * 0.014) * FS * 1.15);
                    var nameColSize = Math.round(Math.min(14, width * 0.011) * FS * 1.15);
                    var metricSize = Math.round(Math.min(14, width * 0.011) * FS * 1.15);

                    var showColors = settled;

                    ctx.font = ((showColors && item.winner === 'player1') ? '700 ' : '600 ') + valSize + 'px ' + FF_HEAD;
                    ctx.fillStyle = showColors ? (item.winner === 'player1' ? C.green : C.text) : C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(item.p1Value, col1X + col1W / 2, textY);

                    ctx.font = '600 ' + nameColSize + 'px ' + FF_HEAD;
                    ctx.fillStyle = C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(stripRangeSuffix(item.p1Name), col2X + col2W / 2, textY);

                    ctx.font = '400 ' + metricSize + 'px ' + FF_HEAD;
                    ctx.fillStyle = C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(item.metric, col3X + col3W / 2, textY);

                    ctx.font = '600 ' + nameColSize + 'px ' + FF_HEAD;
                    ctx.fillStyle = C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(stripRangeSuffix(item.p2Name), col4X + col4W / 2, textY);

                    ctx.font = ((showColors && item.winner === 'player2') ? '700 ' : '600 ') + valSize + 'px ' + FF_HEAD;
                    ctx.fillStyle = showColors ? (item.winner === 'player2' ? C.green : C.text) : C.textSec;
                    ctx.textAlign = 'center';
                    ctx.fillText(item.p2Value, col5X + col5W / 2, textY);
                }
            }

            ctx.restore();
        }

        // Priority list for ranking "biggest wins"
        var WIN_PRIORITY = [
            'NBA Champion', 'Finals MVP', 'Most Valuable Player', 'Conference Finals MVP',
            'All-NBA First Team', 'All-NBA Selections', 'All-Star', 'Points', 'Points PO',
            'Points per game', 'Points per game PO', 'Scoring Leader',
            'Defensive Player of the Year', 'Rookie of the Year', 'Olympic Gold',
            'Olympic Medals', 'All-Defensive First Team', 'All-Defensive Team Selections',
            'Rebounds', 'Rebounds PO', 'Rebounding Leader', 'Rebounds per game',
            'Rebounds per game PO', 'Assists', 'Assists PO', 'Assists Leader',
            'Assists per game', 'Assists per game PO', 'World Cup Medals',
            'Sixth Man of the Year', 'All-Star MVP', 'Player of the Month',
            'Player of the Week', 'NBA Cup Champion', 'NBA Cup MVP'
        ];

        var DISPLAY_LABELS = {
            'All-NBA First Team': 'All-NBA 1st Team',
            'All-Defensive First Team': 'All-Defense 1st Team'
        };

        // Abbreviated labels for the final card (fits larger fonts)
        var ABBREV_LABELS = {
            'Conference Finals MVP': 'Conf. Finals MVP',
            'Defensive Player of the Year': 'DPOY',
            'Most Valuable Player': 'MVP',
            'Rookie of the Year': 'ROY',
            'Most Improved Player': 'MIP',
            'Sixth Man of the Year': '6th Man',
            'Points per game': 'PPG',
            'Points per game PO': 'PPG (PO)',
            'Rebounds per game': 'RPG',
            'Rebounds per game PO': 'RPG (PO)',
            'Assists per game': 'APG',
            'Assists per game PO': 'APG (PO)',
            'All-NBA Selections': 'All-NBA',
            'All-NBA First Team': 'All-NBA 1st',
            'All-NBA 1st Team': 'All-NBA 1st',
            'All-Defensive Team Selections': 'All-Defense',
            'All-Defensive First Team': 'All-Def 1st',
            'All-Defense 1st Team': 'All-Def 1st',
            'World Cup Medals': 'World Cup',
            'Scoring Leader': 'Scoring Title',
            'Rebounding Leader': 'Reb. Leader',
            'Assists Leader': 'Ast. Leader'
        };

        function labelFor(metric) {
            // First apply DISPLAY_LABELS, then ABBREV_LABELS
            var display = DISPLAY_LABELS[metric] || metric;
            return ABBREV_LABELS[display] || ABBREV_LABELS[metric] || display;
        }

        // Sections excluded from biggest wins (voting ranks, not actual awards)
        var EXCLUDED_WIN_SECTIONS = ['BEST AWARDS RANKING', 'BEST VOTE RANKING', 'YEARS RECEIVING VOTES'];

        function getTopWins(whichPlayer, compData) {
            var wins = [];
            var globalIndex = 0;
            compData.sections.forEach(function(section) {
                var skipSection = EXCLUDED_WIN_SECTIONS.indexOf(section.name) >= 0;
                section.items.forEach(function(item) {
                    if (!skipSection && item.winner === whichPlayer) {
                        var prioIdx = WIN_PRIORITY.indexOf(item.metric);
                        var sortKey = prioIdx >= 0 ? prioIdx : WIN_PRIORITY.length + globalIndex;
                        wins.push({
                            metric: item.metric,
                            p1Value: item.p1Value,
                            p2Value: item.p2Value,
                            sortKey: sortKey
                        });
                    }
                    globalIndex++;
                });
            });

            wins.sort(function(a, b) { return a.sortKey - b.sortKey; });

            // Deduplicate by metric name (keep first occurrence)
            var seen = {};
            var deduped = [];
            for (var i = 0; i < wins.length; i++) {
                if (!seen[wins[i].metric]) {
                    seen[wins[i].metric] = true;
                    deduped.push(wins[i]);
                }
            }

            return deduped.slice(0, 10);
        }

        function formatWinLabel(metric) {
            return DISPLAY_LABELS[metric] || metric;
        }

        // Normalize a stat value: null / '-' / '–' → '0', otherwise keep as-is
        function valOrZero(v) {
            if (v === null || v === undefined || v === '-' || v === '\u2013' || v === '') return '0';
            return String(v);
        }

        function drawFinalScreen(ctx, data, width, height, fadeProgress, p1Img, p2Img, p1FinalScore, p2FinalScore) {
            // Display names without the range suffix (local copy only; does not mutate caller data)
            data = Object.assign({}, data, {
                player1Name: stripRangeSuffix(data.player1Name),
                player2Name: stripRangeSuffix(data.player2Name)
            });
            var S = width / 1280;
            var isSquare = Math.abs(width - height) < 50;
            var maxLines = isSquare ? 12 : 10;

            var p1Won = p1FinalScore > p2FinalScore;
            var p2Won = p2FinalScore > p1FinalScore;
            var tied = p1FinalScore === p2FinalScore;

            // White background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            ctx.globalAlpha = Math.min(1, fadeProgress * 2);

            var pad = Math.round(32 * S);
            var midX = width / 2;

            // --- TOP SECTION (0 to 28%) ---
            var topBot = Math.round(height * 0.28);
            var nameY = Math.round(height * 0.10);
            var scoreY = Math.round(height * 0.22);

            // Headshot sizing for final screen
            var fHsD = Math.round(90 * S);
            var fHsR = fHsD / 2;
            var fHsGap = Math.round(12 * S);

            // Player names — 52*S, auto-shrink to 28*S, with trophy for winner
            var nameSize = Math.round(52 * S);
            var minNameSize = Math.round(28 * S);
            var maxNameW = width * 0.45;
            var trophyStr = '\uD83C\uDFC6 '; // trophy + space for measurement

            function fitNameWithTrophy(name, isWinner) {
                var sz = nameSize;
                ctx.font = '800 ' + sz + 'px ' + FF_HEAD;
                var extra = isWinner ? ctx.measureText(trophyStr).width : 0;
                while (extra + ctx.measureText(name).width > maxNameW && sz > minNameSize) {
                    sz--;
                    ctx.font = '800 ' + sz + 'px ' + FF_HEAD;
                    extra = isWinner ? ctx.measureText(trophyStr).width : 0;
                }
                return sz;
            }

            // Column center points (accounting for headshots)
            var p1ColLeft = pad + (p1Img ? fHsD + fHsGap : 0);
            var p1ColCenter = (p1ColLeft + midX) / 2;
            var p2ColRight = width - pad - (p2Img ? fHsD + fHsGap : 0);
            var p2ColCenter = (midX + p2ColRight) / 2;

            // Player 1: headshot + trophy/name (left side)
            var p1IsWinner = p1Won;
            var p1NS = fitNameWithTrophy(data.player1Name.toUpperCase(), p1IsWinner);
            if (p1Img) {
                var p1cx = pad + fHsR;
                var p1cy = nameY - p1NS * 0.35;
                ctx.save();
                ctx.beginPath();
                ctx.arc(p1cx, p1cy, fHsR, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(p1Img, p1cx - fHsR, p1cy - fHsR, fHsD, fHsD);
                ctx.restore();
            }
            ctx.font = '800 ' + p1NS + 'px ' + FF_HEAD;
            ctx.fillStyle = '#111111';
            ctx.textAlign = 'left';
            if (p1IsWinner) {
                var p1EmojiW = ctx.measureText(trophyStr).width;
                var p1NameW = ctx.measureText(data.player1Name.toUpperCase()).width;
                var p1TotalW = p1EmojiW + p1NameW;
                var p1StartX = p1ColCenter - p1TotalW / 2;
                ctx.fillText('\uD83C\uDFC6', p1StartX, nameY);
                ctx.fillText(data.player1Name.toUpperCase(), p1StartX + p1EmojiW, nameY);
            } else {
                var p1NameW = ctx.measureText(data.player1Name.toUpperCase()).width;
                ctx.fillText(data.player1Name.toUpperCase(), p1ColCenter - p1NameW / 2, nameY);
            }

            // Scores — 160*S, auto-shrink to 80*S
            var scoreSize = Math.round(160 * S);
            var maxScoreW = width * 0.40;
            function fitScore(val, base) {
                var sz = base;
                ctx.font = '900 ' + sz + 'px ' + FF_HEAD;
                while (ctx.measureText(String(val)).width > maxScoreW && sz > Math.round(80 * S)) {
                    sz--;
                    ctx.font = '900 ' + sz + 'px ' + FF_HEAD;
                }
                return sz;
            }

            var p1ScoreSize = fitScore(p1FinalScore, scoreSize);
            ctx.font = '900 ' + p1ScoreSize + 'px ' + FF_HEAD;
            ctx.fillStyle = p1Won ? '#22a861' : '#111111';
            ctx.textAlign = 'center';
            ctx.fillText(String(p1FinalScore), p1ColCenter, scoreY + p1ScoreSize * 0.35);

            // Player 2: headshot + trophy/name (right side)
            var p2IsWinner = p2Won;
            var p2NS = fitNameWithTrophy(data.player2Name.toUpperCase(), p2IsWinner);
            if (p2Img) {
                var p2cx = width - pad - fHsR;
                var p2cy = nameY - p2NS * 0.35;
                ctx.save();
                ctx.beginPath();
                ctx.arc(p2cx, p2cy, fHsR, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(p2Img, p2cx - fHsR, p2cy - fHsR, fHsD, fHsD);
                ctx.restore();
            }
            ctx.font = '800 ' + p2NS + 'px ' + FF_HEAD;
            ctx.fillStyle = '#111111';
            ctx.textAlign = 'left';
            if (p2IsWinner) {
                var p2EmojiW = ctx.measureText(trophyStr).width;
                var p2NameW = ctx.measureText(data.player2Name.toUpperCase()).width;
                var p2TotalW = p2EmojiW + p2NameW;
                var p2StartX = p2ColCenter - p2TotalW / 2;
                ctx.fillText('\uD83C\uDFC6', p2StartX, nameY);
                ctx.fillText(data.player2Name.toUpperCase(), p2StartX + p2EmojiW, nameY);
            } else {
                var p2NameW = ctx.measureText(data.player2Name.toUpperCase()).width;
                ctx.fillText(data.player2Name.toUpperCase(), p2ColCenter - p2NameW / 2, nameY);
            }

            var p2ScoreSize = fitScore(p2FinalScore, scoreSize);
            ctx.font = '900 ' + p2ScoreSize + 'px ' + FF_HEAD;
            ctx.fillStyle = p2Won ? '#22a861' : '#111111';
            ctx.textAlign = 'center';
            ctx.fillText(String(p2FinalScore), p2ColCenter, scoreY + p2ScoreSize * 0.35);

            // Divider
            ctx.fillStyle = '#e8e8e8';
            ctx.fillRect(0, topBot, width, 1);

            // --- COLUMN HEADERS (28% to 33%) ---
            var hdrTop = topBot + 1;
            var hdrBot = Math.round(height * 0.33);
            var hdrH = hdrBot - hdrTop;

            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, hdrTop, width, hdrH);

            var hdrNameSize = Math.round(22 * S);
            var hdrScoreSize = Math.round(18 * S);

            // Left column header: "[Player] BIGGEST WINS"
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, hdrTop, midX, hdrH);
            ctx.clip();
            ctx.font = '700 ' + hdrNameSize + 'px ' + FF_HEAD;
            ctx.fillStyle = '#999999';
            ctx.textAlign = 'left';
            ctx.fillText(data.player1Name.toUpperCase() + ' BIGGEST WINS', pad, hdrTop + hdrH * 0.62);
            ctx.font = '400 ' + hdrScoreSize + 'px ' + FF_HEAD;
            ctx.fillStyle = '#bbbbbb';
            ctx.textAlign = 'right';
            ctx.fillText(p1FinalScore + ' \u2013 ' + p2FinalScore, midX - pad, hdrTop + hdrH * 0.62);
            ctx.restore();

            // Right column header
            ctx.save();
            ctx.beginPath();
            ctx.rect(midX, hdrTop, midX, hdrH);
            ctx.clip();
            ctx.font = '700 ' + hdrNameSize + 'px ' + FF_HEAD;
            ctx.fillStyle = '#999999';
            ctx.textAlign = 'left';
            ctx.fillText(data.player2Name.toUpperCase() + ' BIGGEST WINS', midX + pad, hdrTop + hdrH * 0.62);
            ctx.font = '400 ' + hdrScoreSize + 'px ' + FF_HEAD;
            ctx.fillStyle = '#bbbbbb';
            ctx.textAlign = 'right';
            ctx.fillText(p2FinalScore + ' \u2013 ' + p1FinalScore, width - pad, hdrTop + hdrH * 0.62);
            ctx.restore();

            // Header bottom border
            ctx.fillStyle = '#e8e8e8';
            ctx.fillRect(0, hdrBot, width, 1);

            // --- DATA ROWS (33% to 96%) ---
            var rowTop = hdrBot + 1;
            var rowBot = Math.round(height * 0.96);
            var rowAvailH = rowBot - rowTop;

            var compData = lastComparisonData;
            if (compData) {
                var p1Wins = getTopWins('player1', compData);
                var p2Wins = getTopWins('player2', compData);

                var leftColX = 0;
                var leftColW = midX;
                var rightColX = midX;
                var rightColW = width - midX;

                var minRowH = Math.round(48 * S);
                var maxWins = Math.max(p1Wins.length, p2Wins.length, 1);
                var displayLines = Math.min(maxWins, maxLines);
                while (displayLines > 4 && rowAvailH / displayLines < minRowH) displayLines--;
                var rowH = rowAvailH / displayLines;
                var mFontSize = Math.round(26 * S);
                var vWinSize = Math.round(30 * S);
                var vLoseSize = Math.round(26 * S);

                function drawDataCol(wins, colX, colW, isP1Col) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(colX, rowTop, colW, rowAvailH);
                    ctx.clip();

                    for (var i = 0; i < wins.length && i < displayLines; i++) {
                        var y = rowTop + i * rowH;
                        var w = wins[i];
                        var label = labelFor(w.metric).toUpperCase();
                        var winVal = isP1Col ? valOrZero(w.p1Value) : valOrZero(w.p2Value);
                        var loseVal = isP1Col ? valOrZero(w.p2Value) : valOrZero(w.p1Value);
                        var textY = y + rowH * 0.6;

                        // Alternating bg
                        ctx.fillStyle = (i % 2 === 0) ? '#ffffff' : '#fafafa';
                        ctx.fillRect(colX, y, colW, rowH);

                        // Metric name (no row numbers)
                        ctx.font = '600 ' + mFontSize + 'px ' + FF_HEAD;
                        ctx.fillStyle = '#555555';
                        ctx.textAlign = 'left';
                        ctx.fillText(label, colX + pad, textY);

                        // Values right: "winVal – loseVal"
                        var rEdge = colX + colW - pad;
                        ctx.textAlign = 'right';

                        ctx.font = '400 ' + vLoseSize + 'px ' + FF_HEAD;
                        var loseW = ctx.measureText(loseVal).width;
                        var dashStr = ' \u2013 ';
                        var dashW = ctx.measureText(dashStr).width;

                        ctx.fillStyle = '#aaaaaa';
                        ctx.fillText(loseVal, rEdge, textY);

                        ctx.fillStyle = '#cccccc';
                        ctx.fillText(dashStr, rEdge - loseW, textY);

                        ctx.font = '800 ' + vWinSize + 'px ' + FF_HEAD;
                        ctx.fillStyle = '#22a861';
                        ctx.fillText(winVal, rEdge - loseW - dashW, textY);

                        // Row separator
                        if (i < wins.length - 1 && i < displayLines - 1) {
                            ctx.fillStyle = '#f0f0f0';
                            ctx.fillRect(colX + pad, y + rowH - 1, colW - pad * 2, 1);
                        }
                    }
                    ctx.restore();
                }

                drawDataCol(p1Wins, leftColX, leftColW, true);
                drawDataCol(p2Wins, rightColX, rightColW, false);

                // Center divider
                ctx.fillStyle = '#eeeeee';
                ctx.fillRect(midX - 0.5, rowTop, 1, rowAvailH);
            }

            // --- BOTTOM (96% to 100%) ---
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, rowBot, width, height - rowBot);

            var brandSize = Math.round(16 * S);
            var brandSpacing = Math.round(brandSize * 0.18);
            ctx.font = '400 ' + brandSize + 'px ' + FF_HEAD;
            ctx.fillStyle = '#bbbbbb';
            // Spaced branding
            var bStr = 'HOOPSMATIC.COM';
            var bTotalW = 0;
            for (var bi = 0; bi < bStr.length; bi++) bTotalW += ctx.measureText(bStr[bi]).width + (bi < bStr.length - 1 ? brandSpacing : 0);
            var bStartX = (width - bTotalW) / 2;
            for (var bi = 0; bi < bStr.length; bi++) {
                ctx.textAlign = 'left';
                ctx.fillText(bStr[bi], bStartX, Math.round(height * 0.985));
                bStartX += ctx.measureText(bStr[bi]).width + brandSpacing;
            }

            ctx.globalAlpha = 1;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
