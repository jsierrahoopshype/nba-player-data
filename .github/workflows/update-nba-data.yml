name: Update NBA Current Season Data

on:
  schedule:
    # Run at 6:00 AM ET (11:00 UTC) every day
    - cron: '35 11 * * *'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # Writes nba-<season>-data.json + nba-current-season-data.json (season from today's UTC date).
      # Writes nothing if the current season has no players yet.
      - name: Fetch NBA data from Google Sheets
        run: python scripts/fetch_nba_data.py
      
      - name: Commit and push if changed
        run: |
          SEASON=$(python -c "import sys; sys.path.insert(0, 'scripts'); from fetch_nba_data import get_current_season; print(get_current_season())")
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "nba-${SEASON}-data.json" nba-current-season-data.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update NBA ${SEASON} data - $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main && git push || (sleep $((RANDOM % 20 + 5)) && git pull --rebase origin main && git push)
