name: Update Bio from Google Sheets

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and generate bio.json
        run: python scripts/update-bio.py

      # A failed or bad fetch must never replace the committed file: the update
      # script exits 1 on a fetch error or error page, and this refuses an empty
      # file or one with fewer than 90% of the committed records.
      - name: Refuse a worse bio.json
        run: python scripts/check_data_file.py bio.json

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bio.json
          git diff --cached --quiet || git commit -m "Auto-update bio.json from Google Sheets [$(date +'%Y-%m-%d %H:%M')]"
          git pull --rebase origin main && git push || (sleep $((RANDOM % 20 + 5)) && git pull --rebase origin main && git push)
