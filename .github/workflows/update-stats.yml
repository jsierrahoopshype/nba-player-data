name: Update RS Stats

on:
  workflow_dispatch:  # Allows manual trigger from GitHub UI
  # Run daily by the "Daily data chain" workflow (daily-chain.yml), in order,
  # instead of a schedule of its own.
  workflow_call:
    inputs:
      checkout_ref:
        description: Branch to check out; the chain passes main so each step sees the previous step's push
        type: string
        default: ''

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install pandas requests
        
      - name: Fetch and update rsStats.json
        run: python scripts/update-rs-stats.py

      # A failed or bad fetch must never replace the committed file: the update
      # script exits 1 on a fetch error or error page, and this refuses an empty
      # file or one with fewer than 90% of the committed records.
      - name: Refuse a worse rsStats.json
        run: python scripts/check_data_file.py rsStats.json
        
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet rsStats.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rsStats.json
          git commit -m "Auto-update rsStats.json from data/stats/rs-stats.csv [$(date +'%Y-%m-%d %H:%M')]"
          git pull --rebase origin main && git push || (sleep $((RANDOM % 20 + 5)) && git pull --rebase origin main && git push)
