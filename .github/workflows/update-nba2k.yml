name: Update NBA 2K Ratings from Google Sheets

on:
  schedule:
    # Runs every day at 6 AM UTC (adjust as needed)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update nba2k.json
        run: python scripts/update-nba2k.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet nba2k.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add nba2k.json
          git commit -m "Auto-update nba2k.json from Google Sheets [$(date +'%Y-%m-%d %H:%M')]"
          git push
